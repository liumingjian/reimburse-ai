<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>报销助手：换账号</title>
    <style>
      body { font: 14px/1.6 system-ui, sans-serif; margin: 0; padding: 20px; color: #161616; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      button { padding: 6px 12px; font: inherit; cursor: pointer; }
      #accept { background: #0f62fe; border: 1px solid #0f62fe; color: #fff; }
    </style>
  </head>
  <body>
    <h1>把报销助手换到另一个账号？</h1>
    <p id="current"></p>
    <p id="consequence"></p>
    <div class="actions">
      <button id="accept" type="button"></button>
      <button id="keep" type="button"></button>
    </div>
    <script type="module" src="switch.js"></script>
  </body>
</html>
