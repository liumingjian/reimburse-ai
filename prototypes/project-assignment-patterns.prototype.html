<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>baox · 项目归属交互原型</title>
    <style>
      :root {
        --ink: #17211e;
        --ink-soft: #35423d;
        --muted: #6d7a74;
        --canvas: #f4f6f3;
        --panel: #ffffff;
        --panel-soft: #f8faf8;
        --line: #d8e0dc;
        --line-strong: #bdcbc4;
        --blue: #2862ad;
        --blue-soft: #edf3fb;
        --amber: #a66506;
        --amber-soft: #fff5df;
        --coral: #c3533f;
        --green: #2b765d;
        --shadow: 0 12px 28px rgb(27 47 40 / 10%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
      }

      body {
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
        background: var(--canvas);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select,
      input[type="checkbox"] {
        cursor: pointer;
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      button {
        border: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 58px;
        padding: 0 32px;
        color: #f4f8f5;
        background: #1b2622;
      }

      .brand-lockup,
      .topbar-meta,
      .brand-context,
      .task-meta,
      .topbar-meta {
        display: flex;
        align-items: center;
      }

      .brand-lockup {
        gap: 12px;
      }

      .brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-context {
        color: #c9d5cf;
        font-size: 12px;
      }

      .topbar-meta {
        gap: 12px;
        color: #c9d5cf;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }

      .topbar-meta button {
        width: 30px;
        height: 30px;
        border: 1px solid #53625c;
        border-radius: 6px;
        color: #f4f8f5;
        background: transparent;
        font-size: 16px;
      }

      .page-main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 38px 0 92px;
      }

      .task-overview {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 30px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--line-strong);
      }

      .eyebrow,
      .section-kicker {
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .task-overview h1 {
        max-width: 720px;
        margin: 7px 0 8px;
        font-size: clamp(28px, 4vw, 43px);
        line-height: 1.12;
        letter-spacing: 0;
      }

      .task-overview p {
        max-width: 760px;
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .task-total {
        flex: 0 0 auto;
        text-align: right;
      }

      .task-total strong {
        display: block;
        color: var(--blue);
        font-size: 29px;
        line-height: 1;
      }

      .task-total span {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .design-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin: 29px 0 16px;
      }

      .design-heading h2 {
        margin: 5px 0 5px;
        font-size: 22px;
        line-height: 1.2;
      }

      .design-heading p {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .variant-badge,
      .status-chip,
      .project-chip,
      .count-badge {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }

      .variant-badge {
        align-self: start;
        padding: 6px 9px;
        border: 1px solid #c2d1c8;
        border-radius: 5px;
        color: var(--green);
        background: #eff6f1;
        font-size: 11px;
        font-weight: 800;
      }

      .progress-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        background: var(--line);
      }

      .progress-block {
        min-height: 58px;
        padding: 12px 15px;
        background: var(--panel);
      }

      .progress-block strong,
      .progress-block span {
        display: block;
      }

      .progress-block strong {
        color: var(--ink-soft);
        font-size: 14px;
      }

      .progress-block.active strong {
        color: var(--blue);
      }

      .progress-block span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .filter-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 11px;
      }

      .filter-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      .filter-label {
        padding: 0 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .filter-button {
        min-height: 28px;
        padding: 0 9px;
        border-radius: 4px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
      }

      .filter-button.active {
        color: var(--blue);
        background: var(--blue-soft);
        font-weight: 800;
      }

      .filter-note {
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }

      .assignment-dock,
      .project-panel,
      .basket-drawer {
        border: 1px solid #b9cce3;
        background: #fbfdff;
      }

      .assignment-dock {
        position: sticky;
        z-index: 5;
        top: 10px;
        display: grid;
        grid-template-columns: minmax(190px, 0.7fr) minmax(0, 1.3fr);
        gap: 17px;
        align-items: center;
        margin-bottom: 12px;
        padding: 13px 15px;
        box-shadow: 0 7px 17px rgb(34 66 103 / 9%);
      }

      .dock-stat strong,
      .dock-stat span {
        display: block;
      }

      .dock-stat strong {
        color: var(--blue);
        font-size: 16px;
      }

      .dock-stat span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .dock-controls,
      .project-control,
      .dock-project-actions,
      .assignment-footer,
      .panel-heading,
      .panel-selection,
      .project-destination,
      .drawer-header,
      .drawer-summary,
      .drawer-project-heading,
      .summary-heading,
      .summary-actions {
        display: flex;
        align-items: center;
      }

      .dock-controls {
        justify-content: flex-end;
        gap: 9px;
      }

      .project-control {
        min-width: 230px;
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }

      .project-control label,
      .field-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      select,
      .search-input {
        min-height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--ink);
        background: var(--panel);
      }

      select {
        padding: 0 30px 0 10px;
      }

      .search-input {
        width: 100%;
        padding: 0 10px;
        outline: 0;
      }

      .search-input:focus,
      select:focus,
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgb(46 104 181 / 22%);
        outline-offset: 1px;
      }

      .button-primary,
      .button-secondary,
      .button-quiet,
      .button-danger {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 800;
      }

      .button-primary {
        color: #ffffff;
        background: var(--blue);
      }

      .button-secondary {
        border: 1px solid #b8c9db;
        color: var(--blue);
        background: #f7faff;
      }

      .button-quiet {
        color: var(--blue);
        background: transparent;
      }

      .button-danger {
        color: #8f3427;
        background: #fff0ed;
      }

      .used-project-toggle {
        min-height: 28px;
        padding: 0 8px;
        color: var(--blue);
        background: transparent;
        font-size: 10px;
        text-align: left;
      }

      .overwrite-alert {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        grid-column: 1 / -1;
        padding-top: 10px;
        border-top: 1px solid #d5e1ef;
      }

      .overwrite-alert p,
      .overwrite-alert strong,
      .overwrite-alert span {
        margin: 0;
      }

      .overwrite-alert strong,
      .overwrite-alert span {
        display: block;
      }

      .overwrite-alert strong {
        color: #8f4e05;
        font-size: 11px;
      }

      .overwrite-alert span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .overwrite-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 5px;
      }

      .event-grid-head,
      .event-row {
        display: grid;
        grid-template-columns: 27px 48px 94px 112px minmax(220px, 1fr) 100px 160px 178px;
        align-items: center;
        gap: 0;
      }

      .event-grid-head {
        position: sticky;
        z-index: 3;
        top: 10px;
        min-height: 36px;
        border: 1px solid var(--line-strong);
        border-bottom: 0;
        color: var(--muted);
        background: #edf2ee;
        font-size: 10px;
        font-weight: 800;
      }

      .event-grid-head span,
      .event-row > span {
        min-width: 0;
        padding: 0 9px;
      }

      .event-grid-head span:first-child,
      .event-row > input {
        margin-left: 9px;
      }

      .region-section {
        border: 1px solid var(--line-strong);
        border-top: 0;
        background: var(--panel);
      }

      .region-heading {
        position: sticky;
        z-index: 2;
        top: 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 39px;
        padding: 0 10px;
        border-top: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line);
        background: #f7f9f7;
      }

      .region-select {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 800;
      }

      .region-select input,
      .event-row input,
      .c-event-row input,
      .drawer-project-choice input,
      .panel-project-choice input {
        width: 16px;
        height: 16px;
        accent-color: var(--blue);
      }

      .region-heading > span {
        color: var(--muted);
        font-size: 10px;
        text-align: right;
      }

      .event-row {
        min-height: 65px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }

      .event-row:last-child {
        border-bottom: 0;
      }

      .event-row:hover {
        background: #fbfdff;
      }

      .event-row.is-checked {
        background: #f3f8ff;
      }

      .event-row > input {
        grid-column: 1;
      }

      .event-index,
      .event-when,
      .event-proof {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
      }

      .event-when strong,
      .event-when small,
      .event-route strong,
      .event-route small,
      .event-proof strong,
      .event-proof small {
        display: block;
      }

      .event-when small,
      .event-route small,
      .event-proof small {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .event-kind {
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 700;
      }

      .event-route {
        overflow: hidden;
      }

      .event-route strong {
        overflow: hidden;
        color: var(--ink-soft);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-amount {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        text-align: right;
      }

      .project-chip {
        max-width: 100%;
        overflow: hidden;
        min-height: 25px;
        padding: 0 8px;
        border: 1px solid #e9c27f;
        border-radius: 999px;
        color: var(--amber);
        background: var(--amber-soft);
        font-size: 10px;
        font-weight: 800;
        text-overflow: ellipsis;
      }

      .project-chip.assigned {
        border-color: #b5d5c7;
        color: var(--green);
        background: #edf7f1;
      }

      .assignment-footer {
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
        padding: 12px 0;
        color: var(--muted);
        font-size: 11px;
      }

      .assignment-footer strong {
        color: var(--ink-soft);
      }

      .page-b .b-workbench {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 17px;
        align-items: start;
      }

      .b-event-list {
        min-width: 0;
      }

      .b-event-list .event-grid-head {
        top: 10px;
      }

      .b-project-panel {
        position: sticky;
        top: 10px;
        padding: 16px;
        box-shadow: 0 7px 17px rgb(34 66 103 / 6%);
      }

      .panel-heading {
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 13px;
        border-bottom: 1px solid #d5e1ef;
      }

      .panel-heading h2 {
        margin: 4px 0 0;
        font-size: 17px;
      }

      .count-badge {
        min-height: 25px;
        padding: 0 7px;
        border-radius: 999px;
        color: var(--blue);
        background: var(--blue-soft);
        font-size: 10px;
        font-weight: 800;
      }

      .panel-selection {
        justify-content: space-between;
        gap: 10px;
        padding: 13px 0;
      }

      .panel-selection strong,
      .panel-selection span {
        display: block;
      }

      .panel-selection strong {
        color: var(--blue);
        font-size: 15px;
      }

      .panel-selection span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .panel-group {
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .panel-group + .panel-group {
        margin-top: 13px;
      }

      .panel-group-heading,
      .panel-project-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel-group-heading {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .panel-project-list {
        display: grid;
        gap: 6px;
      }

      .project-destination {
        width: 100%;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--ink-soft);
        background: var(--panel);
        text-align: left;
      }

      .project-destination:hover:not(:disabled) {
        border-color: #8dafd7;
        background: #f5f9ff;
      }

      .project-destination strong,
      .project-destination small {
        display: block;
      }

      .project-destination strong {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-destination small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 9px;
      }

      .project-destination .destination-action {
        flex: 0 0 auto;
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
      }

      .panel-note {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }

      .panel-overwrite {
        display: block;
        margin: 0 0 12px;
        padding: 10px;
      }

      .panel-overwrite .overwrite-actions {
        margin-top: 9px;
      }

      .page-c .c-event-sections {
        display: grid;
        gap: 14px;
      }

      .page-c .region-section {
        border-top: 1px solid var(--line-strong);
      }

      .page-c .region-heading {
        position: static;
        min-height: 47px;
        padding: 0 14px;
      }

      .c-event-row {
        display: grid;
        grid-template-columns: 29px 52px 95px minmax(0, 1fr) 100px 160px 154px;
        align-items: center;
        min-height: 69px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }

      .c-event-row:hover,
      .c-event-row.is-checked {
        background: #f5f9ff;
      }

      .c-event-row input {
        margin-left: 13px;
      }

      .c-event-row > span {
        min-width: 0;
        padding: 0 9px;
      }

      .c-event-index,
      .c-event-date,
      .c-event-proof {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
      }

      .c-event-date strong,
      .c-event-date small,
      .c-event-main strong,
      .c-event-main small,
      .c-event-proof strong,
      .c-event-proof small {
        display: block;
      }

      .c-event-date small,
      .c-event-main small,
      .c-event-proof small {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .c-event-main {
        overflow: hidden;
      }

      .c-event-main strong {
        overflow: hidden;
        color: var(--ink-soft);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .c-event-amount {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 800;
        text-align: right;
      }

      .basket-peek {
        position: fixed;
        z-index: 8;
        right: 22px;
        bottom: 76px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px 9px 13px;
        border: 1px solid #b9cce3;
        border-radius: 6px;
        box-shadow: var(--shadow);
        color: var(--blue);
        background: #fbfdff;
        font-size: 11px;
        font-weight: 800;
      }

      .basket-peek button {
        min-height: 29px;
        padding: 0 9px;
        border-radius: 4px;
        color: #ffffff;
        background: var(--blue);
        font-size: 10px;
        font-weight: 800;
      }

      .basket-drawer {
        position: fixed;
        z-index: 10;
        right: 22px;
        bottom: 76px;
        width: min(390px, calc(100vw - 44px));
        max-height: calc(100vh - 120px);
        overflow: auto;
        padding: 17px;
        box-shadow: var(--shadow);
      }

      .drawer-header {
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 13px;
        border-bottom: 1px solid #d5e1ef;
      }

      .drawer-header h2 {
        margin: 4px 0 0;
        font-size: 17px;
      }

      .drawer-close {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--muted);
        background: var(--panel);
        font-size: 17px;
      }

      .drawer-summary {
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
      }

      .drawer-summary strong,
      .drawer-summary span {
        display: block;
      }

      .drawer-summary strong {
        color: var(--blue);
        font-size: 19px;
      }

      .drawer-summary span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
      }

      .drawer-amount {
        color: var(--ink-soft);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 800;
        text-align: right;
      }

      .drawer-breakdown {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding-bottom: 13px;
      }

      .region-badge {
        padding: 4px 6px;
        border-radius: 4px;
        color: var(--ink-soft);
        background: #edf2ee;
        font-size: 10px;
      }

      .drawer-project-heading {
        justify-content: space-between;
        gap: 10px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
      }

      .drawer-project-heading strong {
        font-size: 12px;
      }

      .drawer-project-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .drawer-project-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 9px 0;
      }

      .drawer-project-choice {
        min-height: 31px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--ink-soft);
        background: var(--panel);

  <body data-env="prototype">
    <div id="app"></div>
    <div id="prototype-switcher" class="prototype-switcher" aria-label="原型方案切换" hidden></div>

    <script>
      /* Three project-assignment patterns on one throwaway route, switchable via ?variant=. */
      const variants = [
        { key: "A", name: "固定批量栏" },
        { key: "B", name: "项目工作台" },
        { key: "C", name: "选择篮抽屉" },
      ];

      const task = {
        id: "BX-260902-014",
        title: "华东多地客户交付 · 8 月差旅",
        employee: "林默 · 研发交付组",
      };

      const projects = [
        { value: "P-2307", label: "P-2307 · 华东客户交付" },
        { value: "P-1180", label: "P-1180 · 内部培训" },
        { value: "P-3312", label: "P-3312 · 产品调研" },
        { value: "P-4420", label: "P-4420 · 南京客户培训" },
      ];

      const contexts = [
        {
          id: "g1",
          city: "杭州",
          area: "西湖区",
          station: "东站",
          destination: "上海虹桥",
          localStop: "东站",
          dayStart: 18,
          count: 31,
          pattern: ["住宿费", "外地市内交通", "外地市内交通", "长途交通"],
        },
        {
          id: "g2",
          city: "苏州",
          area: "工业园",
          station: "站",
          destination: "上海虹桥",
          localStop: "园区门口",
          dayStart: 21,
          count: 24,
          pattern: ["长途交通", "外地市内交通", "外地市内交通"],
        },
        {
          id: "g3",
          city: "上海",
          area: "浦东",
          station: "虹桥",
          destination: "杭州东",
          localStop: "虹桥站",
          dayStart: 25,
          count: 28,
          pattern: ["外地市内交通", "住宿费", "外地市内交通"],
        },
        {
          id: "g4",
          city: "南京",
          area: "鼓楼",
          station: "南站",
          destination: "上海虹桥",
          localStop: "南站",
          dayStart: 29,
          count: 25,
          pattern: ["长途交通", "外地市内交通", "住宿费"],
        },
      ];

      const eventAmounts = { 住宿费: 720, 外地市内交通: 78, 长途交通: 174 };

      const events = contexts.flatMap((context, contextIndex) =>
        Array.from({ length: context.count }, (_, index) => {
          const type = context.pattern[(index + contextIndex) % context.pattern.length];
          const amount = eventAmounts[type] + (index % 4) * (type === "住宿费" ? 12 : 6);
          const day = context.dayStart + (index % 3);
          const hour = 8 + ((index * 2 + contextIndex) % 11);
          const detail =
            type === "住宿费"
              ? `${context.city}${context.area} · 入住/离店`
              : type === "长途交通"
                ? `${context.city}${context.station} → ${context.destination}`
                : `${context.city}客户现场 → ${context.city}${index % 2 ? context.localStop : "研发楼"}`;
          return {
            id: `v${String(contextIndex * 100 + index + 1).padStart(3, "0")}`,
            region: context.city,
            index: String(contextIndex * 100 + index + 1).padStart(3, "0"),
            date: `08-${String(day).padStart(2, "0")}`,
            time: `${String(hour).padStart(2, "0")}:${index % 2 ? "40" : "15"}`,
            type,
            detail,
            amount,
            invoice: `INV-${context.id.toUpperCase()}-${String(index + 1).padStart(3, "0")}`,
          };
        }),
      );

      const sortedEvents = [...events].sort(
        (a, b) => a.region.localeCompare(b.region, "zh-CN") || a.date.localeCompare(b.date) || a.time.localeCompare(b.time),
      );
      const regions = [...new Set(sortedEvents.map((expense) => expense.region))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      const total = events.reduce((sum, expense) => sum + expense.amount, 0);

      const getVariant = () => {
        const requested = new URLSearchParams(window.location.search).get("variant");
        return variants.some((variant) => variant.key === requested) ? requested : "A";
      };

      const state = {
        variant: getVariant(),
        filter: "all",
        selected: [],
        assignments: {},
        batchProject: "",
        basketProject: "",
        showUsedProjects: false,
        projectSearch: "",
        basketOpen: false,
        pendingOverwrite: null,
        stage: "details",
        toast: "",
        pendingFocusId: "",
      };

      let toastTimer;

      const money = (value) => `¥${value.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const projectLabel = (value) => projects.find((project) => project.value === value)?.label || "待选择项目";
      const projectShortLabel = (value) => projects.find((project) => project.value === value)?.value || "选择项目";
      const selectedEvents = () => sortedEvents.filter((expense) => state.selected.includes(expense.id));
      const projectEvents = (project) => sortedEvents.filter((expense) => state.assignments[expense.id] === project);
      const assignedCount = () => sortedEvents.filter((expense) => Boolean(state.assignments[expense.id])).length;
      const selectedAmount = () => selectedEvents().reduce((sum, expense) => sum + expense.amount, 0);
      const assignedAmount = (project) => projectEvents(project).reduce((sum, expense) => sum + expense.amount, 0);
      const allAssigned = () => assignedCount() === sortedEvents.length;
      const usedProjects = () => projects.filter((project) => projectEvents(project.value).length);
      const unusedProjects = () => projects.filter((project) => !projectEvents(project.value).length);
      const selectedRegions = () => [...new Set(selectedEvents().map((expense) => expense.region))];

      const visibleEvents = () =>
        sortedEvents.filter((expense) => {
          if (state.filter === "unassigned") return !state.assignments[expense.id];
          if (state.filter === "assigned") return Boolean(state.assignments[expense.id]);
          if (state.filter === "selected") return state.selected.includes(expense.id);
          return true;
        });

      const resetInteraction = () => {
        state.filter = "all";
        state.selected = [];
        state.assignments = {};
        state.batchProject = "";
        state.basketProject = "";
        state.showUsedProjects = false;
        state.projectSearch = "";
        state.basketOpen = false;
        state.pendingOverwrite = null;
        state.stage = "details";
        state.toast = "";
        state.pendingFocusId = "";
      };

      const captureView = () => ({
        scrollX: window.scrollX,
        scrollY: window.scrollY,
        focusId: document.activeElement?.id || "",
      });

      const setVariant = (key) => {
        state.variant = key;
        resetInteraction();
        const url = new URL(window.location.href);
        url.searchParams.set("variant", key);
        window.history.replaceState({}, "", url.href);
        render({ preserve: false });
      };

      const cycleVariant = (offset) => {
        const index = variants.findIndex((variant) => variant.key === state.variant);
        setVariant(variants[(index + offset + variants.length) % variants.length].key);
      };

      const showToast = (message, focusId = "") => {
        window.clearTimeout(toastTimer);
        state.toast = message;
        state.pendingFocusId = focusId;
        render();
        toastTimer = window.setTimeout(() => {
          state.toast = "";
          const toast = document.querySelector("[data-toast]");
          if (toast) toast.remove();
        }, 2600);
      };

      const statusChip = (label, tone = "") => `<span class="status-chip ${tone}">${label}</span>`;

      const projectChip = (expense) => {
        const project = state.assignments[expense.id];
        return `<span class="project-chip ${project ? "assigned" : ""}">${project ? projectLabel(project) : "待归属"}</span>`;
      };

      const selectOption = (project, selected) => `<option value="${project.value}"${project.value === selected ? " selected" : ""}>${project.label}</option>`;

      const unusedProjectOptions = (selected = "", placeholder = "选择未使用项目…") =>
        [
          `<option value="">${unusedProjects().length ? placeholder : "暂无未使用项目"}</option>`,
          unusedProjects().map((project) => selectOption(project, selected)).join(""),
        ].join("");

      const filterBar = () => {
        const counts = {
          all: sortedEvents.length,
          unassigned: sortedEvents.filter((expense) => !state.assignments[expense.id]).length,
          assigned: assignedCount(),
          selected: state.selected.length,
        };
        return `
          <div class="filter-bar" aria-label="费用事件显示范围">
            <span class="filter-label">显示</span>
            ${[
              ["all", "全部"],
              ["unassigned", "待归属"],
              ["assigned", "已归属"],
              ["selected", "已选"],
            ]
              .map(
                ([key, label]) =>
                  `<button class="filter-button ${state.filter === key ? "active" : ""}" type="button" data-action="set-filter" data-filter="${key}" aria-pressed="${state.filter === key}">${label} ${counts[key]}</button>`,
              )
              .join("")}
          </div>
        `;
      };

      const regionHeading = (region) => {
        const current = visibleEvents().filter((expense) => expense.region === region);
        const selected = current.filter((expense) => state.selected.includes(expense.id));
        if (!current.length) return "";
        const allSelected = selected.length === current.length;
        return `
          <div class="region-heading">
            <label class="region-select">
              <input id="region-${region}" data-focus-id="region-${region}" type="checkbox" data-control="region-select" data-region="${region}" ${allSelected ? "checked" : ""} aria-label="选择${region}当前显示的费用事件" />
              <span>${region}</span>
            </label>
            <span>${current.length} 条当前显示 · ${selected.length ? `已选 ${selected.length} · ` : ""}仅用于浏览排序</span>
          </div>
        `;
      };

      const regionSections = (rowRenderer, className = "") =>
        regions
          .map((region) => {
            const current = visibleEvents().filter((expense) => expense.region === region);
            if (!current.length) return "";
            return `<section class="region-section ${className}" data-region="${region}">${regionHeading(region)}${current.map(rowRenderer).join("")}</section>`;
          })
          .join("");

      const eventRow = (expense, className = "") => `
        <label class="event-row ${className} ${state.selected.includes(expense.id) ? "is-checked" : ""}" data-event-row="${expense.id}">
          <input id="event-${expense.id}" data-focus-id="event-${expense.id}" type="checkbox" data-control="event-select" data-event="${expense.id}" ${state.selected.includes(expense.id) ? "checked" : ""} aria-label="选择费用事件 ${expense.index}" />
          <span class="event-index">${expense.index}</span>
          <span class="event-when"><strong>${expense.date}</strong><small>${expense.time}</small></span>
          <span class="event-kind">${expense.type}</span>
          <span class="event-route"><strong>${expense.detail}</strong><small>${expense.region} · 行程上下文</small></span>
          <span class="event-amount">${money(expense.amount)}</span>
          <span class="event-proof"><strong>${expense.invoice}</strong><small>主要报销凭证</small></span>
          <span class="event-assignment">${projectChip(expense)}</span>
        </label>
      `;

      const cEventRow = (expense) => `
        <label class="c-event-row ${state.selected.includes(expense.id) ? "is-checked" : ""}" data-event-row="${expense.id}">
          <input id="event-${expense.id}" data-focus-id="event-${expense.id}" type="checkbox" data-control="event-select" data-event="${expense.id}" ${state.selected.includes(expense.id) ? "checked" : ""} aria-label="选择费用事件 ${expense.index}" />
          <span class="c-event-index">${expense.index}</span>
          <span class="c-event-date"><strong>${expense.date}</strong><small>${expense.time}</small></span>
          <span class="c-event-main"><strong>${expense.type} · ${expense.detail}</strong><small>${expense.region} · ${expense.invoice}</small></span>
          <span class="c-event-amount">${money(expense.amount)}</span>
          <span class="c-event-proof"><strong>${expense.invoice}</strong><small>主要报销凭证</small></span>
          <span class="c-event-assignment">${projectChip(expense)}</span>
        </label>
      `;

      const selectionStats = (label = "已选") => {
        const count = state.selected.length;
        const regionsText = selectedRegions().length ? ` · ${selectedRegions().join("、")}` : "";
        return `<strong>${label} ${count} 条</strong><span>${count ? `${money(selectedAmount())}${regionsText}` : "选择事件后开始批量归属"}</span>`;
      };

      const overwriteNotice = (className = "") => {
        if (!state.pendingOverwrite) return "";
        const changed = state.pendingOverwrite.changed.length;
        const untouched = selectedEvents().length - changed;
        return `
          <div class="overwrite-alert ${className}" role="alert">
            <div>
              <strong>将变更 ${changed} 条已有归属</strong>
              <span>${untouched ? `另有 ${untouched} 条未归属或已是同一项目。` : "当前选择均已有其他项目归属。"} 目标：${projectLabel(state.pendingOverwrite.project)}</span>
            </div>
            <div class="overwrite-actions">
              <button class="button-secondary" type="button" data-action="overwrite-apply" data-mode="unassigned">只处理未归属</button>
              <button class="button-danger" type="button" data-action="overwrite-apply" data-mode="all">确认覆盖</button>
            </div>
          </div>
        `;
      };

      const overview = (eyebrow, heading, copy) => `
        <section class="task-overview">
          <div>
            <div class="eyebrow">${eyebrow}</div>
            <h1>${heading}</h1>
            <p>${task.employee} · 2026-08-18 — 2026-08-31<br />${copy}</p>
          </div>
          <div class="task-total"><strong>${money(total)}</strong><span>${events.length} 个费用事件 · ${regions.length} 个区域</span></div>
        </section>
      `;

      const progressStrip = () => `
        <div class="progress-strip" aria-label="报销任务进度">
          <div class="progress-block"><strong>材料盘点</strong><span>125 份材料</span></div>
          <div class="progress-block"><strong>自动整理</strong><span>费用事件已就绪</span></div>
          <div class="progress-block active"><strong>任务选择</strong><span>${assignedCount()} / ${events.length} 条已归属</span></div>
          <div class="progress-block"><strong>ERP 草稿</strong><span>等待项目确认</span></div>
        </div>
      `;

      const assignmentFooter = () => `
        <div class="assignment-footer">
          <span><strong>${assignedCount()} / ${events.length} 条已归属</strong> · ${allAssigned() ? "可以确认项目归属" : `还有 ${events.length - assignedCount()} 条待归属`}</span>
          <button class="button-primary" type="button" data-action="confirm-projects" ${allAssigned() ? "" : "disabled"}>确认项目归属</button>
        </div>
      `;

      const header = (context) => `
        <header class="topbar">
          <div class="brand-lockup"><span class="brand">baox</span><span class="brand-context">项目归属交互原型 · ${context}</span></div>
          <div class="topbar-meta"><span>${task.id}</span><button type="button" data-action="reset" title="重置演示">↺</button></div>
        </header>
      `;

      const aProjectPicker = () => {
        const used = usedProjects();
        return `
          <div class="project-control">
            <label for="a-project-picker">项目归属</label>
            <select id="a-project-picker" data-focus-id="a-project-picker" data-control="a-project" aria-label="选择项目归属">
              ${unusedProjectOptions(state.batchProject)}
              ${state.showUsedProjects && used.length ? `<optgroup label="继续使用已归属项目">${used.map((project) => selectOption(project, state.batchProject)).join("")}</optgroup>` : ""}
            </select>
            ${used.length ? `<button class="used-project-toggle" type="button" data-action="toggle-used">${state.showUsedProjects ? "收起已归属项目" : `继续使用已归属项目（${used.length}）`}</button>` : ""}
          </div>
        `;
      };

      const aDock = () => {
        const count = state.selected.length;
        const canApply = count > 0 && Boolean(state.batchProject);
        const targetText = state.batchProject ? `归入 ${projectShortLabel(state.batchProject)} · ${count} 条` : "批量归入项目";
        return `
          <section class="assignment-dock" aria-label="固定批量归属栏">
            <div class="dock-stat">${selectionStats()}</div>
            <div class="dock-controls">
              ${aProjectPicker()}
              <div class="dock-project-actions"><button class="button-primary" type="button" data-action="apply-assignment" data-source="A" ${canApply ? "" : "disabled"}>${targetText}</button></div>
            </div>
            ${overwriteNotice()}
          </section>
        `;
      };

      const renderVariantA = () => `
        <div class="page page-a">
          ${header("A · 固定批量栏")}
          <main class="page-main">
            ${overview("方案 A · 一页完成批量归属", "先选事件，再在固定栏归入项目", "事件不预分组；区域与时间只帮助浏览，项目归属始终由用户批量决定。")}
            <div class="design-heading"><div><div class="section-kicker">固定批量栏</div><h2>费用事件</h2><p>操作栏随页面滚动保持可见，已使用项目默认收起。</p></div><span class="variant-badge">A · 桌面 / 移动均衡</span></div>
            ${progressStrip()}
            <div class="filter-line">${filterBar()}<span class="filter-note">区域仅用于排序 · 区域内按日期 / 时间排列</span></div>
            ${aDock()}
            <div class="event-grid-head" aria-hidden="true"><span></span><span>编号</span><span>日期 / 时间</span><span>类型</span><span>行程 / 商户</span><span>金额</span><span>主要报销凭证</span><span>项目归属</span></div>
            <div class="a-event-list">${regionSections((expense) => eventRow(expense, "a-event-row"))}</div>
            ${assignmentFooter()}
            <p class="demo-note">虚构数据 · 这是一次性原型，所有选择只存在于当前页面。</p>
          </main>
        </div>
      `;

      const destinationButton = (project) => {
        const count = projectEvents(project.value).length;
        const regionText = [...new Set(projectEvents(project.value).map((expense) => expense.region))].join("、");
        return `
          <button class="project-destination" type="button" data-action="apply-assignment" data-source="B" data-project="${project.value}" ${state.selected.length ? "" : "disabled"}>
            <span><strong>${project.label}</strong><small>${count ? `${count} 条 · ${regionText}` : "尚未使用"}</small></span>
            <span class="destination-action">${state.selected.length ? "归入" : "待选择"}</span>
          </button>
        `;
      };

      const bProjectPanel = () => {
        const used = usedProjects();
        const query = state.projectSearch.trim().toLowerCase();
        const other = projects.filter((project) => !used.some((usedProject) => usedProject.value === project.value) && project.label.toLowerCase().includes(query));
        return `
          <aside class="project-panel b-project-panel" aria-label="项目工作台">
            <div class="panel-heading"><div><div class="section-kicker">当前选择的归属目标</div><h2>项目工作台</h2></div><span class="count-badge">${state.selected.length} 条</span></div>
            <div class="panel-selection">${selectionStats("当前选择")}<span>${selectedRegions().length ? `${selectedRegions().join("、")} · ` : ""}${money(selectedAmount())}</span></div>
            ${overwriteNotice("panel-overwrite")}
            <div class="panel-group"><div class="panel-group-heading"><span>本次已归入</span><span>${used.length} 个项目</span></div><div class="panel-project-list">${used.length ? used.map(destinationButton).join("") : `<span class="panel-note" style="margin:0;">选择事件后点击项目目标</span>`}</div></div>
            <div class="panel-group"><div class="panel-group-heading"><span>其他有效项目</span><span>${other.length} 个</span></div><input class="search-input" id="b-project-search" data-focus-id="b-project-search" data-control="b-project-search" type="search" value="${state.projectSearch}" placeholder="查找项目号或名称" aria-label="查找其他有效项目" /><div class="panel-project-list" style="margin-top:8px;">${other.length ? other.map(destinationButton).join("") : `<span class="panel-note" style="margin:0;">没有匹配的项目</span>`}</div></div>
            <p class="panel-note">项目目标只作用于当前勾选事件，不代表系统预先建立了项目分组。</p>
          </aside>
        `;
      };

      const renderVariantB = () => `
        <div class="page page-b">
          ${header("B · 项目工作台")}
          <main class="page-main">
            ${overview("方案 B · 项目目标常驻", "左侧看事件，右侧选归属目标", "项目面板只显示可操作的有效项目；事件是否归入哪个项目，仍由当前勾选结果决定。")}
            <div class="design-heading"><div><div class="section-kicker">项目工作台</div><h2>事件与项目目标并列</h2><p>已使用项目显示数量和金额，其他项目通过查找进入。</p></div><span class="variant-badge">B · 项目目标优先</span></div>
            ${progressStrip()}
            <div class="filter-line">${filterBar()}<span class="filter-note">选择事件后，点击右侧项目目标</span></div>
            <div class="b-workbench">
              <section class="b-event-list" aria-label="费用事件列表"><div class="event-grid-head" aria-hidden="true"><span></span><span>编号</span><span>日期 / 时间</span><span>类型</span><span>行程 / 商户</span><span>金额</span><span>主要报销凭证</span><span>项目归属</span></div>${regionSections((expense) => eventRow(expense, "b-event-row"))}</section>
              ${bProjectPanel()}
            </div>
            ${assignmentFooter()}
            <p class="demo-note">虚构数据 · 项目面板不承载事件分组，只对当前选择执行一次批量归属。</p>
          </main>
        </div>
      `;

      const basketDrawer = () => {
        const used = usedProjects();
        const other = unusedProjects();
        const targetText = state.basketProject ? `归入 ${projectShortLabel(state.basketProject)} · ${state.selected.length} 条` : "选择项目后归入";
        return `
          <aside class="basket-drawer" role="dialog" aria-modal="false" aria-label="已选费用事件选择篮">
            <div class="drawer-header"><div><div class="section-kicker">已选费用事件</div><h2>选择篮</h2></div><button class="drawer-close" type="button" data-action="close-basket" aria-label="收起选择篮" title="收起">×</button></div>
            <div class="drawer-summary"><div>${selectionStats("已选")}</div><span class="drawer-amount">${money(selectedAmount())}</span></div>
            <div class="drawer-breakdown">${selectedRegions().map((region) => `<span class="region-badge">${region} · ${selectedEvents().filter((expense) => expense.region === region).length}</span>`).join("")}</div>
            <div class="drawer-project-heading"><strong>归入项目</strong><span>${used.length ? `${used.length} 个已使用项目可复用` : "项目目录"}</span></div>
            <div class="drawer-project-list">${used.map((project) => `<button class="drawer-project-choice ${state.basketProject === project.value ? "active" : ""}" type="button" data-action="choose-basket-project" data-project="${project.value}">${project.label} · ${projectEvents(project.value).length} 条</button>`).join("")}</div>
            <div class="drawer-project-other"><label for="c-project-picker">其他有效项目</label><select id="c-project-picker" data-focus-id="c-project-picker" data-control="c-project" aria-label="选择其他有效项目">${unusedProjectOptions(state.basketProject, "选择未使用项目…")}</select></div>
            ${overwriteNotice()}
            <button class="button-primary drawer-apply" type="button" data-action="apply-assignment" data-source="C" ${state.basketProject ? "" : "disabled"}>${targetText}</button>
          </aside>
        `;
      };

      const renderVariantC = () => `
        <div class="page page-c">
          ${header("C · 选择篮抽屉")}
          <main class="page-main">
            ${overview("方案 C · 选择后再操作", "列表保持干净，项目操作按需出现", "先在区域和时间顺序中勾选费用事件；选择篮只在有选择时出现，不预先占用页面空间。")}
            <div class="design-heading"><div><div class="section-kicker">选择篮抽屉</div><h2>费用事件</h2><p>已使用项目以快捷目标出现，未使用项目默认放在目录选择器中。</p></div><span class="variant-badge">C · 移动端优先</span></div>
            ${progressStrip()}
            <div class="filter-line">${filterBar()}<span class="filter-note">区域仅用于浏览排序 · 选择后打开右下角选择篮</span></div>
            <div class="c-event-sections" aria-label="费用事件列表">${regionSections(cEventRow, "c-region-section")}</div>
            ${assignmentFooter()}
            <p class="demo-note">虚构数据 · 选择篮不会保存选择，确认页只显示由用户选择生成的项目摘要。</p>
          </main>
          ${state.selected.length ? (state.basketOpen ? basketDrawer() : `<div class="basket-peek"><span>已选 ${state.selected.length} 条 · ${money(selectedAmount())}</span><button type="button" data-action="open-basket">打开选择篮</button></div>`) : ""}
        </div>
      `;

      const summaryRows = () =>
        projects
          .map((project) => {
            const assigned = projectEvents(project.value);
            if (!assigned.length) return "";
            const regionsText = [...new Set(assigned.map((expense) => expense.region))].join("、");
            return `<div class="summary-row"><div><strong>${project.label}</strong><span>${assigned.length} 条费用事件 · ${regionsText}</span></div><strong>${money(assignedAmount(project.value))}</strong></div>`;
          })
          .join("");

      const renderSummary = () => `
        <div class="page page-summary">
          ${header("项目归属确认")}
          <main class="page-main">
            ${overview("项目归属 · 用户已确认", "归属摘要", "以下项目分布完全由你勾选事件后批量归入形成，区域不是项目分组依据。")}
            <section class="summary-screen" aria-label="项目归属确认摘要">
              <div class="summary-heading"><div><div class="section-kicker">确认前快照</div><h2>${events.length} 条费用事件已完成归属</h2><p>这里不重复展开候选明细。</p></div><span class="summary-total">${money(total)}</span></div>
              <div class="summary-list">${summaryRows()}</div>
              <p class="summary-note">确认后才进入 ERP 草稿授权；本原型不会连接 ERP，也不会提交审批或付款。</p>
              <div class="summary-actions"><span class="next-step">下一步 · ERP 草稿授权</span><button class="button-secondary" type="button" data-action="back-to-details">返回修改项目归属</button></div>
            </section>
          </main>
        </div>
      `;

      const renderSwitcher = () => {
        const switcher = document.getElementById("prototype-switcher");
        const current = variants.find((variant) => variant.key === state.variant) || variants[0];
        switcher.hidden = state.variant === "C" && state.basketOpen && state.selected.length > 0;
        switcher.innerHTML = `
          <button class="switcher-arrow" type="button" data-switch="previous" aria-label="上一个方案" title="上一个方案">←</button>
          <span class="switcher-label">${current.key} · ${current.name}<span>方案 ${variants.findIndex((variant) => variant.key === current.key) + 1}/3</span></span>
          <button class="switcher-arrow" type="button" data-switch="next" aria-label="下一个方案" title="下一个方案">→</button>
        `;
      };

      const syncRegionIndicators = () => {
        document.querySelectorAll('[data-control="region-select"]').forEach((control) => {
          const current = visibleEvents().filter((expense) => expense.region === control.dataset.region);
          const selected = current.filter((expense) => state.selected.includes(expense.id));
          control.checked = current.length > 0 && selected.length === current.length;
          control.indeterminate = selected.length > 0 && selected.length < current.length;
        });
      };

      const render = ({ preserve = true } = {}) => {
        const previous = preserve ? captureView() : null;
        const html = state.stage === "summary" ? renderSummary() : state.variant === "A" ? renderVariantA() : state.variant === "B" ? renderVariantB() : renderVariantC();
        document.getElementById("app").innerHTML = html + (state.toast ? `<div class="toast" data-toast role="status">${state.toast}</div>` : "");
        document.body.classList.toggle("basket-open", state.variant === "C" && state.basketOpen && state.selected.length > 0);
        renderSwitcher();
        window.requestAnimationFrame(() => {
          const focusId = state.pendingFocusId || previous?.focusId;
          if (state.pendingFocusId) state.pendingFocusId = "";
          if (focusId) {
            const element = document.getElementById(focusId);
            if (element) {
              element.focus({ preventScroll: true });
              if (previous?.focusId !== focusId) element.scrollIntoView({ block: "center", inline: "nearest" });
            }
          }
          if (previous && previous.focusId === focusId) window.scrollTo(previous.scrollX, previous.scrollY);
          syncRegionIndicators();
        });
      };

      const prepareApply = (project) => {
        if (!state.selected.length || !project) {
          showToast("先勾选费用事件并选择项目。");
          return;
        }
        const changed = selectedEvents().filter((expense) => state.assignments[expense.id] && state.assignments[expense.id] !== project);
        if (changed.length) {
          state.pendingOverwrite = { project, changed };
          render();
          return;
        }
        applyProject(project, "all");
      };

      const applyProject = (project, mode) => {
        const selection = selectedEvents();
        const targetEvents = mode === "unassigned" ? selection.filter((expense) => !state.assignments[expense.id]) : selection;
        const changedCount = targetEvents.filter((expense) => state.assignments[expense.id] && state.assignments[expense.id] !== project).length;
        const newCount = targetEvents.length - changedCount;
        targetEvents.forEach((expense) => {
          state.assignments[expense.id] = project;
        });
        const nextUnassigned = sortedEvents.find((expense) => !state.assignments[expense.id]);
        const previousFilter = state.filter;
        if (previousFilter === "all" || previousFilter === "selected") state.filter = "unassigned";
        state.selected = [];
        state.batchProject = "";
        state.basketProject = "";
        state.pendingOverwrite = null;
        state.basketOpen = false;
        const assignedLabel = targetEvents.length ? `已将 ${targetEvents.length} 条费用事件归入 ${projectLabel(project)}${changedCount ? `，新增 ${newCount} 条，更新 ${changedCount} 条` : ""}。` : "没有新的项目归属变更。";
        showToast(assignedLabel, nextUnassigned ? `event-${nextUnassigned.id}` : "");
      };

      document.addEventListener("click", (event) => {
        const switchButton = event.target.closest("[data-switch]");
        if (switchButton) {
          cycleVariant(switchButton.dataset.switch === "previous" ? -1 : 1);
          return;
        }

        const action = event.target.closest("[data-action]");
        if (!action) return;
        const actionType = action.dataset.action;

        if (actionType === "reset") {
          resetInteraction();
          showToast("演示已重置。");
        } else if (actionType === "set-filter") {
          state.filter = action.dataset.filter;
          state.pendingOverwrite = null;
          render();
        } else if (actionType === "toggle-used") {
          state.showUsedProjects = !state.showUsedProjects;
          state.pendingOverwrite = null;
          render();
        } else if (actionType === "apply-assignment") {
          const project = action.dataset.project || (state.variant === "A" ? state.batchProject : state.variant === "C" ? state.basketProject : "");
          prepareApply(project);
        } else if (actionType === "overwrite-apply") {
          const project = state.pendingOverwrite?.project;
          if (project) applyProject(project, action.dataset.mode);
        } else if (actionType === "choose-basket-project") {
          state.basketProject = action.dataset.project;
          state.pendingOverwrite = null;
          render();
        } else if (actionType === "open-basket") {
          state.basketOpen = true;
          render();
        } else if (actionType === "close-basket") {
          state.basketOpen = false;
          render();
        } else if (actionType === "confirm-projects") {
          if (!allAssigned()) {
            showToast(`还有 ${events.length - assignedCount()} 条费用事件未归属。`);
            return;
          }
          state.stage = "summary";
          state.basketOpen = false;
          render({ preserve: false });
        } else if (actionType === "back-to-details") {
          state.stage = "details";
          state.filter = "all";
          state.pendingOverwrite = null;
          render({ preserve: false });
        }
      });

      document.addEventListener("change", (event) => {
        const control = event.target.dataset.control;
        if (control === "event-select") {
          const id = event.target.dataset.event;
          state.selected = event.target.checked
            ? [...new Set([...state.selected, id])]
            : state.selected.filter((selectedId) => selectedId !== id);
          if (state.variant === "C" && state.selected.length) state.basketOpen = true;
          state.pendingOverwrite = null;
          render();
        } else if (control === "region-select") {
          const ids = visibleEvents().filter((expense) => expense.region === event.target.dataset.region).map((expense) => expense.id);
          state.selected = event.target.checked
            ? [...new Set([...state.selected, ...ids])]
            : state.selected.filter((id) => !ids.includes(id));
          if (state.variant === "C" && state.selected.length) state.basketOpen = true;
          state.pendingOverwrite = null;
          render();
        } else if (control === "a-project") {
          state.batchProject = event.target.value;
          state.pendingOverwrite = null;
          render();
        } else if (control === "c-project") {
          state.basketProject = event.target.value;
          state.pendingOverwrite = null;
          render();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.dataset.control !== "b-project-search") return;
        state.projectSearch = event.target.value;
        render();
      });

      window.addEventListener("keydown", (event) => {
        const target = event.target;
        const tagName = target?.tagName?.toLowerCase();
        if (["input", "textarea", "select"].includes(tagName) || target?.isContentEditable) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleVariant(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleVariant(1);
        } else if (event.key === "Escape" && state.variant === "C" && state.basketOpen) {
          state.basketOpen = false;
          render();
        }
      });

      window.addEventListener("popstate", () => {
        state.variant = getVariant();
        resetInteraction();
        render({ preserve: false });
      });

      render({ preserve: false });
    </script>
  </body>
</html>
