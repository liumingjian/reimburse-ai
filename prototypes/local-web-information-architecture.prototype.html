<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="baox 本地 Web 信息架构原型，仅使用虚构数据。" />
    <link rel="icon" href="data:," />
    <title>baox · 本地 Web 信息架构原型</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211f;
        --ink-soft: #384441;
        --muted: #6b7772;
        --faint: #8d9792;
        --line: #d8dfdb;
        --line-strong: #becac4;
        --canvas: #f4f5f1;
        --paper: #fffefa;
        --panel: #ffffff;
        --accent: #087f73;
        --accent-deep: #056056;
        --accent-soft: #e4f2ef;
        --blue: #315fa8;
        --blue-soft: #eaf0fa;
        --amber: #a36108;
        --amber-soft: #fff2d8;
        --coral: #bd4a3c;
        --coral-soft: #fbe9e5;
        --terminal: #202927;
        --shadow: 0 16px 36px rgb(23 33 31 / 8%);
        --small-shadow: 0 5px 16px rgb(23 33 31 / 7%);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      html {
        min-width: 320px;
        background: var(--canvas);
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      select,
      input {
        font: inherit;
      }

      button,
      select {
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid rgb(49 95 168 / 32%);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3,
      p,
      dl,
      ul {
        margin-top: 0;
      }

      h1,
      h2,
      h3 {
        letter-spacing: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 42px;
        line-height: 1.1;
      }

      h2 {
        margin-bottom: 8px;
        font-size: 18px;
        line-height: 1.25;
      }

      h3 {
        margin-bottom: 5px;
        font-size: 14px;
        line-height: 1.3;
      }

      p {
        margin-bottom: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .topbar {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 32px;
        background: var(--terminal);
        color: #f5faf7;
      }

      .brand-lockup {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 12px;
      }

      .brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-context {
        color: #bcc9c4;
        font-size: 12px;
        white-space: nowrap;
      }

      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #d8e1dd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        white-space: nowrap;
      }

      .topbar-meta button {
        display: inline-grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid #60706a;
        border-radius: 5px;
        background: transparent;
        color: #f5faf7;
        font-size: 17px;
      }

      .topbar-meta button:hover {
        border-color: #c7d5cf;
        background: #34423e;
      }

      .page {
        min-height: 100vh;
        padding-bottom: 116px;
      }

      .eyebrow,
      .section-kicker,
      .panel-kicker {
        margin-bottom: 7px;
        color: var(--accent-deep);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .muted {
        color: var(--muted);
      }

      .faint {
        color: var(--faint);
      }

      .status-chip,
      .evidence-tag,
      .project-chip,
      .source-chip {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }

      .status-chip::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .status-chip.warning::before {
        background: var(--amber);
      }

      .status-chip.complete::before {
        background: var(--blue);
      }

      .status-chip.handoff::before {
        background: var(--coral);
      }

      .source-chip.reference {
        border-color: #c6d4ea;
        background: var(--blue-soft);
        color: #315b96;
      }

      .evidence-tag {
        border-color: #c5ddd8;
        background: var(--accent-soft);
        color: var(--accent-deep);
      }

      .project-chip.pending {
        border-color: #e3c997;
        background: var(--amber-soft);
        color: #8a570e;
      }

      .project-chip.assigned {
        border-color: #c6d4ea;
        background: var(--blue-soft);
        color: #315b96;
      }

      .button-primary,
      .button-secondary,
      .button-quiet,
      .button-coral {
        min-height: 38px;
        border-radius: 5px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 750;
        line-height: 1.2;
      }

      .button-primary {
        border: 1px solid var(--accent-deep);
        background: var(--accent);
        color: #fff;
      }

      .button-primary:hover:not(:disabled) {
        background: var(--accent-deep);
      }

      .button-primary:disabled {
        border-color: #cbd3cf;
        background: #e2e7e4;
        color: #909b96;
      }

      .button-secondary {
        border: 1px solid var(--line-strong);
        background: var(--paper);
        color: var(--ink);
      }

      .button-secondary:hover {
        border-color: var(--blue);
        color: var(--blue);
      }

      .button-quiet {
        min-height: 32px;
        border: 0;
        background: transparent;
        color: var(--blue);
        padding: 5px 0;
        text-decoration: underline;
        text-decoration-color: #afc0de;
        text-underline-offset: 3px;
      }

      .button-coral {
        border: 1px solid #a83e34;
        background: var(--coral);
        color: #fff;
      }

      .button-coral:hover {
        background: #9d3e34;
      }

      .button-reset {
        border: 0;
        background: transparent;
        color: var(--blue);
        padding: 4px;
        font-size: 12px;
        font-weight: 700;
      }

      .select-wrap {
        display: grid;
        gap: 6px;
      }

      .select-wrap label,
      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      select {
        min-width: 0;
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        background: var(--paper);
        padding: 7px 30px 7px 10px;
      }

      select:hover {
        border-color: var(--blue);
      }

      .demo-note {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .demo-note::before {
        display: inline-grid;
        width: 16px;
        height: 16px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--blue);
        content: "i";
        font-family: Georgia, serif;
        font-size: 11px;
        font-weight: 700;
      }

      /* Variant A: a dense task queue with one decisive right rail. */
      .a-main {
        width: min(1220px, calc(100% - 56px));
        margin: 0 auto;
        padding: 38px 0 56px;
      }

      .a-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 28px;
      }

      .a-hero-copy {
        max-width: 700px;
      }

      .a-hero-copy p:last-child {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .a-hero-summary {
        display: flex;
        align-items: flex-end;
        gap: 25px;
        padding-bottom: 4px;
        white-space: nowrap;
      }

      .summary-number {
        display: block;
        color: var(--ink);
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
      }

      .summary-label {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .a-progress {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 20px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .a-progress-step {
        display: flex;
        min-height: 64px;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-right: 1px solid var(--line);
      }

      .a-progress-step:last-child {
        border-right: 0;
      }

      .a-progress-step .step-index {
        display: inline-grid;
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .a-progress-step.done .step-index {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .a-progress-step.active {
        background: var(--accent-soft);
      }

      .a-progress-step.active .step-index {
        border-color: var(--accent-deep);
        color: var(--accent-deep);
      }

      .a-progress-step strong,
      .a-progress-step span {
        display: block;
      }

      .a-progress-step strong {
        font-size: 12px;
      }

      .a-progress-step span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .a-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(320px, 0.85fr);
        align-items: start;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .a-queue,
      .a-rail {
        min-width: 0;
      }

      .a-queue {
        border-right: 1px solid var(--line);
      }

      .a-panel-heading,
      .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .a-panel-heading {
        padding: 20px 22px 15px;
        border-bottom: 1px solid var(--line);
      }

      .a-panel-heading h2,
      .section-heading h2 {
        margin-bottom: 3px;
      }

      .a-panel-heading p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .queue-count {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .expense-list {
        display: grid;
      }

      .expense-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 88px;
        padding: 13px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .expense-row:last-child {
        border-bottom: 0;
      }

      .expense-row.is-selected {
        border-left: 3px solid var(--accent);
        background: #f4faf8;
        padding-left: 19px;
      }

      .row-index {
        color: var(--faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
      }

      .row-main {
        min-width: 0;
      }

      .row-main button {
        display: block;
        max-width: 100%;
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
      }

      .row-main button:hover .row-title {
        color: var(--accent-deep);
      }

      .row-title {
        display: block;
        overflow: hidden;
        font-size: 14px;
        font-weight: 780;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px 9px;
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
      }

      .row-amount {
        display: grid;
        justify-items: end;
        gap: 6px;
        text-align: right;
      }

      .amount {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
      }

      .row-amount .button-quiet {
        font-size: 11px;
      }

      .a-rail {
        display: grid;
        align-content: start;
      }

      .rail-block {
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }

      .rail-block:last-child {
        border-bottom: 0;
      }

      .rail-block p {
        color: var(--muted);
        font-size: 12px;
      }

      .assignment-block {
        display: grid;
        gap: 12px;
      }

      .assignment-block p {
        margin-bottom: 0;
      }

      .assignment-actions {
        display: grid;
        gap: 9px;
      }

      .assignment-actions .button-secondary,
      .assignment-actions .button-quiet {
        justify-self: start;
      }

      .assignment-actions .button-quiet {
        font-size: 11px;
      }

      .individual-assignments {
        display: grid;
        gap: 8px;
        margin-top: 2px;
      }

      .individual-assignment {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 132px;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #edf0ee;
      }

      .individual-assignment:last-child {
        border-bottom: 0;
      }

      .individual-assignment strong {
        display: block;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .individual-assignment span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }

      .individual-assignment select {
        min-height: 32px;
        padding-top: 5px;
        padding-bottom: 5px;
        font-size: 11px;
      }

      .selected-detail {
        display: grid;
        gap: 12px;
        padding-top: 2px;
      }

      .detail-title {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .detail-title h3 {
        margin-bottom: 2px;
        font-size: 15px;
      }

      .detail-title p {
        margin-bottom: 0;
        font-size: 11px;
      }

      .detail-facts {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 6px 12px;
        margin: 0;
        font-size: 11px;
      }

      .detail-facts dt {
        color: var(--muted);
      }

      .detail-facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .non-blocking {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr);
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid #ecd9b2;
        background: #fffaf0;
      }

      .non-blocking::before {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--amber);
        content: "";
      }

      .non-blocking strong,
      .non-blocking span {
        display: block;
      }

      .non-blocking strong {
        color: #7e510e;
        font-size: 11px;
      }

      .non-blocking span {
        margin-top: 3px;
        color: #8b6b39;
        font-size: 11px;
      }

      .collapsed-detail {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .collapsed-detail summary {
        color: var(--blue);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .collapsed-detail-body {
        display: grid;
        gap: 7px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
      }

      .source-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .authorization {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 20px;
        margin-top: 18px;
        border: 1px solid var(--line-strong);
        border-left: 4px solid var(--coral);
        background: var(--paper);
        padding: 17px 20px;
      }

      .authorization h2 {
        margin-bottom: 4px;
        font-size: 15px;
      }

      .authorization p {
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 11px;
      }

      .authorization label,
      .save-authorization label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .authorization input,
      .save-authorization input {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        margin: 1px 0 0;
        accent-color: var(--coral);
      }

      .authorization-cta {
        display: grid;
        justify-items: end;
        gap: 7px;
      }

      .authorization-cta small {
        color: var(--muted);
        font-size: 10px;
        text-align: right;
      }

      .authorization-used {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        border: 1px solid #c9ddd8;
        background: var(--accent-soft);
        padding: 14px 18px;
      }

      .authorization-used strong,
      .authorization-used span {
        display: block;
      }

      .authorization-used strong {
        color: var(--accent-deep);
        font-size: 13px;
      }

      .authorization-used span {
        margin-top: 3px;
        color: #47746d;
        font-size: 11px;
      }

      .erp-status {
        margin-top: 18px;
        border: 1px solid var(--line);
        background: #f8faf8;
        padding: 18px 20px;
      }

      .erp-status-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 15px;
      }

      .erp-status-header h2 {
        margin-bottom: 3px;
        font-size: 15px;
      }

      .erp-status-header p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .erp-stage-line {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .erp-stage {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        min-height: 49px;
        border-top: 2px solid var(--line-strong);
        padding-top: 9px;
      }

      .erp-stage.done {
        border-color: var(--accent);
      }

      .erp-stage.active {
        border-color: var(--coral);
      }

      .erp-stage-index {
        display: inline-grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .erp-stage.done .erp-stage-index {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .erp-stage.active .erp-stage-index {
        border-color: var(--coral);
        color: var(--coral);
      }

      .erp-stage strong,
      .erp-stage span {
        display: block;
      }

      .erp-stage strong {
        font-size: 11px;
      }

      .erp-stage span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }

      .erp-status-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .erp-status-action p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .save-authorization {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        border: 1px solid #ecd0cc;
        background: var(--coral-soft);
        padding: 12px 14px;
      }

      .save-authorization p {
        margin-bottom: 0;
        color: #88423b;
        font-size: 11px;
      }

      /* Variant B: a three-column event reader that puts evidence in the middle. */
      .b-main {
        width: min(1320px, calc(100% - 48px));
        margin: 0 auto;
        padding: 34px 0 56px;
      }

      .b-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      .b-heading-copy {
        max-width: 760px;
      }

      .b-heading-copy p:last-child {
        margin-bottom: 0;
        color: var(--muted);
      }

      .b-total-lockup {
        display: grid;
        grid-template-columns: auto auto;
        gap: 5px 18px;
        align-items: end;
        border-left: 3px solid var(--blue);
        padding-left: 15px;
        white-space: nowrap;
      }

      .b-total-lockup .summary-number {
        grid-row: span 2;
        font-size: 30px;
      }

      .b-total-lockup span:last-child {
        color: var(--muted);
        font-size: 11px;
      }

      .b-workbench {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr) minmax(270px, 0.85fr);
        min-height: 610px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .event-index {
        border-right: 1px solid var(--line);
        background: #f7f9f6;
      }

      .event-index-heading {
        padding: 18px 16px 13px;
        border-bottom: 1px solid var(--line);
      }

      .event-index-heading h2 {
        margin-bottom: 3px;
        font-size: 14px;
      }

      .event-index-heading span {
        color: var(--muted);
        font-size: 11px;
      }

      .event-nav-item {
        display: grid;
        grid-template-columns: 25px minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        min-height: 80px;
        align-items: start;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 13px 12px;
        text-align: left;
      }

      .event-nav-item:hover {
        background: #eef5f2;
      }

      .event-nav-item.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .event-nav-number {
        color: var(--faint);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 800;
      }

      .event-nav-item strong,
      .event-nav-item span {
        display: block;
      }

      .event-nav-item strong {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .event-nav-item span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
      }

      .event-reader {
        min-width: 0;
        border-right: 1px solid var(--line);
        padding: 22px 25px;
      }

      .reader-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .reader-header h2 {
        margin-bottom: 4px;
        font-size: 20px;
      }

      .reader-header p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .reader-amount {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 20px;
        font-weight: 800;
        white-space: nowrap;
      }

      .reader-section {
        border-top: 1px solid var(--line);
        padding: 17px 0;
      }

      .reader-section:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .reader-section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 11px;
      }

      .reader-section-heading h3 {
        margin-bottom: 0;
        font-size: 12px;
      }

      .connection-stack {
        display: grid;
        gap: 8px;
      }

      .connection-item {
        display: grid;
        grid-template-columns: 27px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        min-height: 54px;
        border: 1px solid var(--line);
        background: #fafcf9;
        padding: 9px 11px;
      }

      .connection-icon {
        display: inline-grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border: 1px solid #b8d8d1;
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-size: 12px;
        font-weight: 800;
      }

      .connection-item.reference .connection-icon {
        border-color: #c6d4ea;
        background: var(--blue-soft);
        color: var(--blue);
      }

      .connection-item strong,
      .connection-item span {
        display: block;
      }

      .connection-item strong {
        font-size: 11px;
      }

      .connection-item span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .reader-callout {
        border-left: 3px solid var(--amber);
        background: #fffaf0;
        padding: 11px 13px;
      }

      .reader-callout strong,
      .reader-callout span {
        display: block;
      }

      .reader-callout strong {
        color: #7e510e;
        font-size: 11px;
      }

      .reader-callout span {
        margin-top: 4px;
        color: #8b6b39;
        font-size: 11px;
      }

      .reader-facts {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 7px 12px;
        margin: 0;
        font-size: 11px;
      }

      .reader-facts dt {
        color: var(--muted);
      }

      .reader-facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .candidate-pane {
        min-width: 0;
        padding: 20px 18px;
      }

      .candidate-pane h2 {
        margin-bottom: 3px;
        font-size: 15px;
      }

      .candidate-pane > p {
        color: var(--muted);
        font-size: 11px;
      }

      .candidate-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 11px;
      }

      .candidate-table th {
        border-bottom: 1px solid var(--line-strong);
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        padding: 8px 5px;
        text-align: left;
      }

      .candidate-table th:last-child,
      .candidate-table td:last-child {
        text-align: right;
      }

      .candidate-table td {
        border-bottom: 1px solid #edf0ee;
        padding: 10px 5px;
        vertical-align: top;
      }

      .candidate-table tr:last-child td {
        border-bottom: 0;
      }

      .candidate-table .candidate-name {
        display: block;
        overflow: hidden;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .candidate-table .candidate-meta {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .candidate-table select {
        width: 100%;
        min-height: 31px;
        padding: 5px 22px 5px 6px;
        font-size: 10px;
      }

      .candidate-pane .assignment-block {
        margin-top: 21px;
        border-top: 1px solid var(--line);
        padding-top: 17px;
      }

      .candidate-pane .assignment-block h3 {
        font-size: 12px;
      }

      .b-footer-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.75fr);
        gap: 18px;
        margin-top: 18px;
      }

      .b-footer-grid .authorization,
      .b-footer-grid .erp-status {
        margin-top: 0;
      }

      .b-footer-grid .authorization {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .b-footer-grid .authorization-cta {
        justify-items: start;
      }

      .b-footer-grid .authorization-cta small {
        text-align: left;
      }

      .b-footer-grid .erp-status {
        padding: 17px 18px;
      }

      .b-footer-grid .erp-stage-line {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .b-footer-grid .erp-stage {
        min-height: 34px;
        grid-template-columns: 22px minmax(0, 1fr);
        border-top: 0;
        border-left: 2px solid var(--line-strong);
        padding: 0 0 0 9px;
      }

      .b-footer-grid .erp-stage.done {
        border-color: var(--accent);
      }

      .b-footer-grid .erp-stage.active {
        border-color: var(--coral);
      }

      .b-footer-grid .erp-status-action {
        display: block;
      }

      .b-footer-grid .erp-status-action button {
        margin-top: 11px;
      }

      /* Variant C: a single-column brief with progressive disclosure. */
      .c-main {
        width: min(980px, calc(100% - 48px));
        margin: 0 auto;
        padding: 38px 0 56px;
      }

      .c-overview {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 30px;
        border-bottom: 1px solid var(--line-strong);
        padding-bottom: 27px;
      }

      .c-overview p:last-child {
        margin-bottom: 0;
        color: var(--muted);
      }

      .c-total-block {
        display: grid;
        justify-items: end;
      }

      .c-total-block .summary-number {
        color: var(--blue);
        font-size: 38px;
      }

      .c-total-block .summary-label {
        margin-top: 4px;
      }

      .c-flow {
        position: relative;
        display: grid;
        gap: 0;
        margin-top: 26px;
      }

      .c-flow::before {
        position: absolute;
        top: 22px;
        bottom: 28px;
        left: 19px;
        width: 1px;
        background: var(--line-strong);
        content: "";
      }

      .c-step {
        position: relative;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 18px;
        padding-bottom: 20px;
      }

      .c-step:last-child {
        padding-bottom: 0;
      }

      .c-step-marker {
        position: relative;
        z-index: 1;
        display: inline-grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: var(--canvas);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 800;
      }

      .c-step.complete .c-step-marker {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .c-step.active .c-step-marker {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: var(--blue);
      }

      .c-step-body {
        min-width: 0;
        border-bottom: 1px solid var(--line);
        padding: 5px 0 22px;
      }

      .c-step:last-child .c-step-body {
        border-bottom: 0;
      }

      .c-step-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
      }

      .c-step-heading h2 {
        margin-bottom: 3px;
        font-size: 19px;
      }

      .c-step-heading p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .c-complete-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        color: var(--muted);
        font-size: 11px;
      }

      .c-complete-line strong {
        color: var(--ink-soft);
      }

      .c-review-disclosure {
        margin-top: 13px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .c-review-disclosure summary {
        color: var(--blue);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .c-review-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
        margin-top: 12px;
      }

      .c-review-item {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 10px;
      }

      .c-review-item strong,
      .c-review-item span {
        display: block;
      }

      .c-review-item strong {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .c-review-item span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
      }

      .c-assignment {
        border: 1px solid #c6d4ea;
        border-left: 4px solid var(--blue);
        background: #f8fafe;
        padding: 18px 19px;
      }

      .c-assignment .assignment-block {
        gap: 10px;
      }

      .c-assignment .assignment-block h3 {
        margin-bottom: 0;
        font-size: 16px;
      }

      .c-assignment .assignment-block p {
        max-width: 680px;
      }

      .c-assignment .individual-assignment {
        border-color: #dae4f1;
      }

      .c-erp-preview {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 25px;
        align-items: start;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 19px;
      }

      .c-erp-preview h3 {
        margin-bottom: 5px;
        font-size: 15px;
      }

      .c-erp-preview p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .c-erp-facts {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 6px 12px;
        margin: 0;
        font-size: 11px;
      }

      .c-erp-facts dt {
        color: var(--muted);
      }

      .c-erp-facts dd {
        margin: 0;
        text-align: right;
      }

      .c-flow .authorization {
        margin-top: 15px;
      }

      .c-flow .erp-status {
        margin-top: 15px;
      }

      /* Evidence view is intentionally a focused overlay, not a permanent audit desk. */
      .evidence-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(21 30 28 / 43%);
        padding: 24px;
      }

      .evidence-dialog {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: min(980px, 100%);
        max-height: min(760px, calc(100vh - 48px));
        overflow: hidden;
        border: 1px solid #aebcb5;
        background: var(--paper);
        box-shadow: 0 24px 60px rgb(0 0 0 / 22%);
      }

      .evidence-dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 17px 20px;
      }

      .evidence-dialog-header h2 {
        margin-bottom: 3px;
        font-size: 17px;
      }

      .evidence-dialog-header p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .dialog-close {
        display: inline-grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        background: #fff;
        color: var(--ink-soft);
        font-size: 20px;
        line-height: 1;
      }

      .dialog-close:hover {
        border-color: var(--coral);
        color: var(--coral);
      }

      .evidence-dialog-body {
        display: grid;
        grid-template-columns: minmax(300px, 0.92fr) minmax(300px, 1.08fr);
        min-height: 0;
        overflow: auto;
      }

      .document-stage {
        display: grid;
        place-items: center;
        min-height: 490px;
        border-right: 1px solid var(--line);
        background: #e9ede9;
        padding: 28px;
      }

      .document-paper {
        position: relative;
        width: min(330px, 100%);
        min-height: 418px;
        border: 1px solid #c5c9c4;
        background: #fff;
        box-shadow: 0 12px 24px rgb(23 33 31 / 13%);
        padding: 21px 21px 25px;
        transform: rotate(-1deg);
      }

      .paper-label {
        display: inline-flex;
        border: 1px solid #d7dfdb;
        padding: 3px 6px;
        color: var(--muted);
        font-size: 9px;
      }

      .document-paper h3 {
        margin: 18px 0 5px;
        color: #2a3531;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
      }

      .paper-subtitle {
        color: #6b7772;
        font-size: 10px;
      }

      .paper-rule {
        height: 1px;
        margin: 17px 0;
        background: #cbd2cc;
      }

      .paper-grid {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 9px 10px;
        color: #56615c;
        font-size: 10px;
      }

      .paper-grid strong {
        color: #26312d;
        font-weight: 750;
      }

      .paper-highlight {
        margin: 21px 0 17px;
        border: 2px solid #e4b455;
        background: #fff8e5;
        padding: 11px 10px;
        color: #5c430f;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.3;
      }

      .paper-total {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #cbd2cc;
        padding-top: 12px;
        color: #2a3531;
        font-size: 12px;
      }

      .paper-total strong {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 17px;
      }

      .paper-stamp {
        position: absolute;
        right: 21px;
        bottom: 23px;
        border: 2px solid rgb(189 74 60 / 48%);
        border-radius: 50%;
        color: rgb(189 74 60 / 72%);
        padding: 8px 6px;
        font-size: 10px;
        font-weight: 800;
        transform: rotate(-14deg);
      }

      .evidence-reading {
        min-width: 0;
        padding: 24px 25px;
      }

      .evidence-reading h3 {
        margin-bottom: 4px;
        font-size: 16px;
      }

      .evidence-reading > p {
        color: var(--muted);
        font-size: 11px;
      }

      .evidence-finding {
        margin: 18px 0;
        border-left: 3px solid var(--amber);
        background: #fffaf0;
        padding: 12px 14px;
      }

      .evidence-finding strong,
      .evidence-finding span {
        display: block;
      }

      .evidence-finding strong {
        color: #7e510e;
        font-size: 12px;
      }

      .evidence-finding span {
        margin-top: 5px;
        color: #8b6b39;
        font-size: 11px;
      }

      .evidence-facts {
        display: grid;
        grid-template-columns: 94px minmax(0, 1fr);
        gap: 8px 11px;
        margin: 0;
        font-size: 11px;
      }

      .evidence-facts dt {
        color: var(--muted);
      }

      .evidence-facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .evidence-reading details {
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .evidence-reading summary {
        color: var(--blue);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .evidence-quote {
        margin: 12px 0 0;
        border-left: 2px solid var(--blue);
        background: var(--blue-soft);
        padding: 10px 12px;
        color: #315b96;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }

      /* Shared ERP details are restyled by the surrounding variant where needed. */
      .erp-status[data-phase="handed-off"] {
        border-color: #d8c8c4;
        background: #fbf8f7;
      }

      .erp-status[data-phase="draft-saved"] {
        border-color: #c9ddd8;
      }

      /* The switcher is diagnostic UI and is hidden for a production-marked body. */
      .prototype-switcher[hidden] {
        display: none;
      }

      .prototype-switcher {
        position: fixed;
        z-index: 30;
        right: 50%;
        bottom: 18px;
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 10px;
        border: 1px solid #52605b;
        border-radius: 999px;
        background: #202927;
        box-shadow: 0 12px 30px rgb(0 0 0 / 20%);
        color: #fff;
        padding: 5px 8px;
        transform: translateX(50%);
      }

      .switcher-arrow {
        display: inline-grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid #64746d;
        border-radius: 50%;
        background: #2b3733;
        color: #fff;
        font-size: 19px;
        line-height: 1;
      }

      .switcher-arrow:hover {
        border-color: #b9cbc4;
        background: #3a4943;
      }

      .switcher-label {
        min-width: 155px;
        color: #eef5f1;
        font-size: 12px;
        font-weight: 750;
        text-align: center;
      }

      .switcher-label span {
        color: #aebcb6;
        font-weight: 500;
      }

      .toast {
        position: fixed;
        z-index: 40;
        right: 22px;
        bottom: 82px;
        max-width: min(360px, calc(100% - 44px));
        border: 1px solid #b8d8d1;
        background: #f5fbf8;
        box-shadow: var(--small-shadow);
        color: var(--accent-deep);
        padding: 11px 14px;
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 1040px) {
        .a-grid {
          grid-template-columns: minmax(0, 1fr) minmax(290px, 0.78fr);
        }

        .b-workbench {
          grid-template-columns: 170px minmax(0, 1fr) minmax(245px, 0.8fr);
        }

        .event-reader {
          padding-right: 18px;
          padding-left: 18px;
        }

        .candidate-pane {
          padding-right: 13px;
          padding-left: 13px;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          padding-right: 20px;
          padding-left: 20px;
        }

        .a-main,
        .b-main,
        .c-main {
          width: min(100% - 32px, 680px);
        }

        .a-hero,
        .b-heading,
        .c-overview {
          display: block;
        }

        .a-hero-summary,
        .b-total-lockup,
        .c-total-block {
          justify-content: start;
          justify-items: start;
          margin-top: 18px;
        }

        .a-progress {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .a-progress-step:nth-child(2) {
          border-right: 0;
        }

        .a-progress-step:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }

        .a-grid {
          grid-template-columns: 1fr;
        }

        .a-queue {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .b-workbench {
          grid-template-columns: 150px minmax(0, 1fr);
        }

        .candidate-pane {
          grid-column: 1 / -1;
          border-top: 1px solid var(--line);
        }

        .candidate-table {
          table-layout: auto;
        }

        .b-footer-grid {
          grid-template-columns: 1fr;
        }

        .c-review-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .c-erp-preview {
          grid-template-columns: 1fr;
        }

        .c-erp-facts dd {
          text-align: left;
        }

        .evidence-dialog-body {
          grid-template-columns: 1fr;
        }

        .document-stage {
          min-height: 410px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .evidence-reading {
          padding: 20px;
        }
      }

      @media (max-width: 560px) {
        body {
          font-size: 13px;
        }

        .brand-context {
          display: none;
        }

        .topbar-meta {
          font-size: 10px;
        }

        .a-main,
        .b-main,
        .c-main {
          width: calc(100% - 24px);
          padding-top: 25px;
        }

        h1 {
          font-size: 29px;
        }

        .a-progress-step {
          min-height: 76px;
          align-items: flex-start;
          padding: 12px 10px;
        }

        .a-progress-step .step-index {
          margin-top: 1px;
        }

        .a-panel-heading,
        .rail-block,
        .candidate-pane,
        .event-reader {
          padding-right: 15px;
          padding-left: 15px;
        }

        .expense-row {
          grid-template-columns: 24px minmax(0, 1fr);
          gap: 8px;
          padding-right: 14px;
          padding-left: 14px;
        }

        .expense-row.is-selected {
          padding-left: 11px;
        }

        .row-amount {
          grid-column: 2;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 9px;
          justify-items: start;
          margin-top: -3px;
          text-align: left;
        }

        .row-main button {
          width: 100%;
        }

        .row-title {
          white-space: normal;
        }

        .authorization,
        .authorization-used {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .authorization-cta {
          justify-items: start;
        }

        .authorization-cta small {
          text-align: left;
        }

        .erp-status,
        .b-footer-grid .erp-status {
          padding-right: 14px;
          padding-left: 14px;
        }

        .erp-status-header,
        .erp-status-action {
          display: block;
        }

        .erp-status-header .status-chip {
          margin-top: 10px;
        }

        .erp-status-action button {
          margin-top: 11px;
        }

        .b-workbench {
          grid-template-columns: 1fr;
        }

        .event-index {
          display: grid;
          grid-template-columns: repeat(5, minmax(78px, 1fr));
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .event-index-heading {
          display: none;
        }

        .event-nav-item {
          display: block;
          min-height: 66px;
          border-right: 1px solid var(--line);
          border-bottom: 0;
          padding: 9px 8px;
        }

        .event-nav-item.is-selected {
          box-shadow: inset 0 3px 0 var(--accent);
        }

        .event-nav-number {
          display: block;
          margin-bottom: 3px;
        }

        .event-nav-item strong {
          font-size: 10px;
        }

        .event-nav-item span {
          margin-top: 2px;
          font-size: 9px;
        }

        .reader-header {
          display: block;
        }

        .reader-amount {
          margin-top: 11px;
        }

        .c-review-list {
          grid-template-columns: 1fr;
        }

        .c-step {
          grid-template-columns: 32px minmax(0, 1fr);
          gap: 11px;
        }

        .c-flow::before {
          left: 15px;
        }

        .c-step-marker {
          width: 32px;
          height: 32px;
          font-size: 10px;
        }

        .c-step-heading {
          display: block;
        }

        .c-step-heading .status-chip {
          margin-top: 9px;
        }

        .evidence-scrim {
          padding: 10px;
        }

        .evidence-dialog {
          max-height: calc(100vh - 20px);
        }

        .document-stage {
          min-height: 340px;
          padding: 17px;
        }

        .document-paper {
          min-height: 350px;
          padding: 16px;
        }

        .document-paper h3 {
          margin-top: 12px;
        }

        .paper-highlight {
          margin: 14px 0;
          font-size: 13px;
        }

        .switcher-label {
          min-width: 116px;
          font-size: 11px;
        }

        .prototype-switcher {
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body data-env="prototype">
    <div id="app"></div>
    <div id="prototype-switcher" class="prototype-switcher" aria-label="原型方案切换" hidden></div>

    <script>
      /* Three variants of the completed expense task, switchable via ?variant=, on a throwaway local prototype route. */
      const variants = [
        { key: "A", name: "任务队列" },
        { key: "B", name: "事件阅读器" },
        { key: "C", name: "分步简报" },
      ];

      const task = {
        id: "BX-260902-014",
        title: "华东客户交付 · 8 月差旅",
        date: "2026-08-18 — 2026-08-20",
        employee: "林默 · 研发交付组",
        total: 1284.6,
        eventCount: 5,
        materialCount: 7,
        readyVersion: 3,
      };

      const expenses = [
        {
          id: "e1",
          index: "01",
          title: "上海虹桥机场 → 杭州客户现场",
          meta: "08-18 · 网约车",
          amount: 186.4,
          category: "外地市内交通",
          invoice: "INV-240818-01",
          reference: "TRIP-240818-02",
          evidence: "derived",
          note: "行程单补全起终点",
        },
        {
          id: "e2",
          index: "02",
          title: "杭州客户现场 → 上海虹桥",
          meta: "08-19 · 网约车",
          amount: 126.2,
          category: "外地市内交通",
          invoice: "INV-240818-01",
          reference: "TRIP-240818-02",
          evidence: "explicit",
          note: "聚焦提示：一张纯发票拆为两条候选明细",
        },
        {
          id: "e3",
          index: "03",
          title: "杭州西湖区住宿",
          meta: "08-18 至 08-20 · 住宿",
          amount: 720,
          category: "住宿费",
          invoice: "INV-240819-03",
          reference: "STAY-240819-01",
          evidence: "derived",
          note: "水单补全入住与离店日期",
        },
        {
          id: "e4",
          index: "04",
          title: "杭州客户现场 → 杭州东站",
          meta: "08-20 · 网约车",
          amount: 78,
          category: "外地市内交通",
          invoice: "INV-240820-04",
          reference: "TRIP-240820-05",
          evidence: "explicit",
          note: "起终点城市一致",
        },
        {
          id: "e5",
          index: "05",
          title: "杭州东 → 上海虹桥",
          meta: "08-20 · 高铁",
          amount: 174,
          category: "长途交通",
          invoice: "INV-240820-06",
          reference: "",
          evidence: "explicit",
          note: "长途发票直接提供行程",
        },
      ];

      const projects = [
        { value: "P-2307", label: "P-2307 · 华东客户交付" },
        { value: "P-1180", label: "P-1180 · 内部培训" },
        { value: "P-3312", label: "P-3312 · 产品调研" },
      ];

      const getInitialVariant = () => {
        const requested = new URLSearchParams(window.location.search).get("variant");
        return variants.some((variant) => variant.key === requested) ? requested : "A";
      };

      const state = {
        variant: getInitialVariant(),
        selectedExpense: "e2",
        projectMode: "batch",
        batchProject: "",
        rowProjects: {},
        authorization: false,
        saveAuthorization: false,
        erpPhase: "ready",
        evidenceOpen: false,
        toast: "",
      };

      let toastTimer;

      const money = (value) => `¥${value.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      const currentExpense = () => expenses.find((expense) => expense.id === state.selectedExpense) || expenses[0];

      const projectLabel = (value) => projects.find((project) => project.value === value)?.label || "待选择";

      const selectedProject = (expense) =>
        state.projectMode === "batch" ? state.batchProject : state.rowProjects[expense.id] || "";

      const allProjectsAssigned = () =>
        expenses.every((expense) => Boolean(selectedProject(expense)));

      const setVariant = (key) => {
        state.variant = key;
        state.evidenceOpen = false;
        const url = new URL(window.location.href);
        url.searchParams.set("variant", key);
        window.history.replaceState({}, "", url.href);
        render();
      };

      const cycleVariant = (offset) => {
        const index = variants.findIndex((variant) => variant.key === state.variant);
        const nextIndex = (index + offset + variants.length) % variants.length;
        setVariant(variants[nextIndex].key);
      };

      const showToast = (message) => {
        window.clearTimeout(toastTimer);
        state.toast = message;
        render();
        toastTimer = window.setTimeout(() => {
          state.toast = "";
          render();
        }, 2700);
      };

      const statusChip = (label, tone = "") => `<span class="status-chip ${tone}">${label}</span>`;

      const erpPhaseDisplay = {
        ready: ["等待启动授权", ""],
        running: ["运行中", "warning"],
        "awaiting-save": ["等待保存", "warning"],
        "draft-saved": ["草稿已验证", "complete"],
        "handed-off": ["已交接", "handoff"],
      };

      const projectChip = (expense) => {
        const project = selectedProject(expense);
        return `<span class="project-chip ${project ? "assigned" : "pending"}">${project ? projectLabel(project) : "待选择项目"}</span>`;
      };

      const projectOptions = (selected = "") =>
        [
          `<option value="">选择项目…</option>`,
          ...projects.map(
            (project) => `<option value="${project.value}" ${project.value === selected ? "selected" : ""}>${project.label}</option>`,
          ),
        ].join("");

      const assignmentControl = (variantClass = "") => {
        const isBatch = state.projectMode === "batch";
        return `
          <div class="assignment-block ${variantClass}">
            <div>
              <div class="section-kicker">任务选择 · 项目归属</div>
              <h3>这些费用都属于哪个项目？</h3>
            </div>
            <p>材料不能证明项目归属。先一次选择，baox 会把它应用到 ${task.eventCount} 条候选明细；只有确实分属不同项目时才逐条展开。</p>
            ${
              isBatch
                ? `
                    <div class="assignment-actions">
                      <div class="select-wrap">
                        <label for="batch-project-${state.variant}">批量应用到全部候选明细</label>
                        <select id="batch-project-${state.variant}" data-control="batch-project">
                          ${projectOptions(state.batchProject)}
                        </select>
                      </div>
                      <button class="button-quiet" type="button" data-action="choose-individual">这些费用分属不同项目</button>
                    </div>
                  `
                : `
                    <div class="individual-assignments">
                      ${expenses
                        .map(
                          (expense) => `
                            <label class="individual-assignment">
                              <span>
                                <strong>${expense.index} · ${expense.title}</strong>
                                <span>${money(expense.amount)} · ${expense.category}</span>
                              </span>
                              <select data-control="row-project" data-expense="${expense.id}">
                                ${projectOptions(state.rowProjects[expense.id] || "")}
                              </select>
                            </label>
                          `,
                        )
                        .join("")}
                      <button class="button-quiet" type="button" data-action="choose-batch">改为一次应用同一项目</button>
                    </div>
                  `
            }
          </div>
        `;
      };

      const authorizationBlock = (variantClass = "") => {
        if (state.erpPhase !== "ready") {
          const [phaseLabel, phaseTone] = erpPhaseDisplay[state.erpPhase];
          return `
            <div class="authorization-used ${variantClass}">
              <div>
                <strong>启动授权已使用</strong>
                <span>ERP 就绪快照 v${task.readyVersion} 已锁定项目归属与候选明细，当前只显示本地模拟状态。</span>
              </div>
              ${statusChip(phaseLabel, phaseTone)}
            </div>
          `;
        }

        const canStart = state.authorization && allProjectsAssigned();
        return `
          <section class="authorization ${variantClass}" aria-labelledby="authorization-title-${state.variant}">
            <div>
              <div class="section-kicker">控制权边界</div>
              <h2 id="authorization-title-${state.variant}">启动 ERP 草稿创建</h2>
              <p>这会授权 baox 使用本次 ERP 就绪快照打开有头 ERP，填写并保存一份 ERP 草稿。不会提交审批、付款或删除。</p>
              <label>
                <input type="checkbox" data-control="authorization" ${state.authorization ? "checked" : ""} />
                <span>我确认项目归属和金额，可以启动本次 ERP 草稿创建</span>
              </label>
            </div>
            <div class="authorization-cta">
              <button class="button-coral" type="button" data-action="start-erp" ${canStart ? "" : "disabled"}>启动 ERP 草稿创建</button>
              <small>${allProjectsAssigned() ? "项目归属已齐全" : "先完成项目归属选择"}</small>
            </div>
          </section>
        `;
      };

      const erpStatus = (variantClass = "") => {
        const phases = {
          ready: {
            label: "等待启动授权",
            tone: "",
            intro: "ERP 未启动；本地 Web 只保留本次任务的授权入口。",
            action: "启动后模拟有头 ERP 的填写过程",
          },
          running: {
            label: "baox 运行中",
            tone: "warning",
            intro: "有头 ERP 已打开，baox 暂时持有 ERP 自动化控制权。",
            action: "字段、纯发票与金额正在按快照填写",
          },
          "awaiting-save": {
            label: "等待保存确认",
            tone: "warning",
            intro: "填写已完成，保存 ERP 草稿需要一次即时确认。",
            action: "先确认保存，再验证单据编号和修改态",
          },
          "draft-saved": {
            label: "草稿已验证",
            tone: "complete",
            intro: "ERP 已返回单据编号并进入修改态，baox 尚未提交审批。",
            action: "验证完成后释放自动化控制权",
          },
          "handed-off": {
            label: "已交接给用户",
            tone: "handoff",
            intro: "ERP 草稿已交接；baox 不再继续操作这个有头浏览器。",
            action: "用户检查草稿并决定后续动作",
          },
        };
        const phase = phases[state.erpPhase];
        const stageClass = (stage) => {
          if (state.erpPhase === "ready") return stage === "snapshot" ? "done" : "";
          if (state.erpPhase === "running") return stage === "handoff" ? "" : stage === "snapshot" ? "done" : "active";
          if (state.erpPhase === "awaiting-save") return stage === "handoff" ? "" : "active";
          if (state.erpPhase === "draft-saved") return stage === "handoff" ? "active" : "done";
          return "done";
        };

        let action = "";
        if (state.erpPhase === "running") {
          action = `<button class="button-secondary" type="button" data-action="advance-erp">模拟完成填写</button>`;
        } else if (state.erpPhase === "awaiting-save") {
          action = `
            <div class="save-authorization">
              <p>保存是有外部副作用的动作，必须在当前 ERP 页面状态已核对后即时确认。</p>
              <label>
                <input type="checkbox" data-control="save-authorization" ${state.saveAuthorization ? "checked" : ""} />
                <span>我确认保存当前 ERP 草稿</span>
              </label>
              <button class="button-coral" type="button" data-action="save-erp" ${state.saveAuthorization ? "" : "disabled"}>保存 ERP 草稿并验证</button>
            </div>
          `;
        } else if (state.erpPhase === "draft-saved") {
          action = `<button class="button-primary" type="button" data-action="handoff-erp">交接 ERP 浏览器</button>`;
        } else if (state.erpPhase === "handed-off") {
          action = `<span class="demo-note">演示结束 · 不会连接真实 ERP</span>`;
        }

        return `
          <section class="erp-status ${variantClass}" data-phase="${state.erpPhase}" aria-labelledby="erp-title-${state.variant}">
            <div class="erp-status-header">
              <div>
                <div class="section-kicker">ERP 运行 / 交接</div>
                <h2 id="erp-title-${state.variant}">${phase.intro}</h2>
                <p>${phase.action}</p>
              </div>
              ${statusChip(phase.label, phase.tone)}
            </div>
            <div class="erp-stage-line">
              <div class="erp-stage ${stageClass("snapshot")}">
                <span class="erp-stage-index">1</span>
                <span><strong>就绪快照</strong><span>项目与候选明细已锁定</span></span>
              </div>
              <div class="erp-stage ${stageClass("fill")}">
                <span class="erp-stage-index">2</span>
                <span><strong>填写并保存草稿</strong><span>纯发票上传，禁止提交</span></span>
              </div>
              <div class="erp-stage ${stageClass("handoff")}">
                <span class="erp-stage-index">3</span>
                <span><strong>用户接管</strong><span>baox 释放控制权</span></span>
              </div>
            </div>
            ${action ? `<div class="erp-status-action"><p>当前模拟状态：${phase.label}</p>${action}</div>` : ""}
          </section>
        `;
      };

      const expenseRow = (expense) => `
        <article class="expense-row ${state.selectedExpense === expense.id ? "is-selected" : ""}">
          <span class="row-index">${expense.index}</span>
          <div class="row-main">
            <button type="button" data-action="select-expense" data-expense="${expense.id}" aria-current="${state.selectedExpense === expense.id ? "true" : "false"}">
              <span class="row-title">${expense.title}</span>
              <span class="row-meta"><span>${expense.meta}</span><span>${expense.category}</span>${projectChip(expense)}</span>
            </button>
          </div>
          <div class="row-amount">
            <span class="amount">${money(expense.amount)}</span>
            <button class="button-quiet" type="button" data-action="open-evidence" data-expense="${expense.id}">查看证据</button>
          </div>
        </article>
      `;

      const eventNavItem = (expense) => `
        <button class="event-nav-item ${state.selectedExpense === expense.id ? "is-selected" : ""}" type="button" data-action="select-expense" data-expense="${expense.id}" aria-current="${state.selectedExpense === expense.id ? "true" : "false"}">
          <span class="event-nav-number">${expense.index}</span>
          <span>
            <strong>${expense.title}</strong>
            <span>${money(expense.amount)} · ${expense.category}</span>
          </span>
        </button>
      `;

      const candidateTable = () => `
        <table class="candidate-table">
          <caption class="sr-only">候选明细与项目归属</caption>
          <thead>
            <tr><th scope="col">费用事件</th><th scope="col">项目归属</th><th scope="col">金额</th></tr>
          </thead>
          <tbody>
            ${expenses
              .map(
                (expense) => `
                  <tr>
                    <td><span class="candidate-name">${expense.title}</span><span class="candidate-meta">${expense.category}</span></td>
                    <td>${projectChip(expense)}</td>
                    <td class="amount">${money(expense.amount)}</td>
                  </tr>
                `,
              )
              .join("")}
          </tbody>
        </table>
      `;

      const selectedReader = () => {
        const expense = currentExpense();
        return `
          <div class="reader-header">
            <div>
              <div class="panel-kicker">费用事件 ${expense.index}</div>
              <h2>${expense.title}</h2>
              <p>${expense.meta} · ${expense.category}</p>
            </div>
            <span class="reader-amount">${money(expense.amount)}</span>
          </div>
          <section class="reader-section">
            <div class="reader-section-heading"><h3>材料证据关联</h3>${statusChip("已整理", "complete")}</div>
            <div class="connection-stack">
              <div class="connection-item">
                <span class="connection-icon">票</span>
                <span><strong>${expense.invoice}</strong><span>主要报销凭证 · 上传 ERP</span></span>
                <span class="source-chip">纯发票</span>
              </div>
              ${
                expense.reference
                  ? `<div class="connection-item reference"><span class="connection-icon">证</span><span><strong>${expense.reference}</strong><span>参考材料 · 仅补全行程上下文</span></span><span class="source-chip reference">不上传</span></div>`
                  : `<div class="connection-item reference"><span class="connection-icon">—</span><span><strong>无参考材料</strong><span>长途发票直接提供行程信息</span></span><span class="source-chip reference">无</span></div>`
              }
            </div>
          </section>
          <section class="reader-section">
            <div class="reader-callout"><strong>非阻塞提示</strong><span>${expense.note}。已通过确定性校验，不影响 ERP 就绪；需要原件时只聚焦这一条费用事件。</span></div>
          </section>
          <section class="reader-section">
            <div class="reader-section-heading"><h3>已解析值</h3><span class="evidence-tag">${expense.evidence === "explicit" ? "explicit" : "derived"}</span></div>
            <dl class="reader-facts">
              <dt>费用类别</dt><dd>${expense.category}</dd>
              <dt>ERP 费用项目</dt><dd>按公司规则映射 · 只读</dd>
              <dt>ERP 发票类型</dt><dd>按凭证票种映射 · 只读</dd>
              <dt>项目归属</dt><dd>${projectLabel(selectedProject(expense))}</dd>
            </dl>
          </section>
          <button class="button-secondary" type="button" data-action="open-evidence" data-expense="${expense.id}">打开当前费用事件的证据视图</button>
        `;
      };

      const renderVariantA = () => `
        <div class="page page-a">
          <header class="topbar">
            <div class="brand-lockup"><span class="brand">baox</span><span class="brand-context">本地 Web · 本次报销</span></div>
            <div class="topbar-meta"><span>${task.id}</span><button type="button" data-action="reset" title="重置演示">↺</button></div>
          </header>
          <main class="a-main">
            <section class="a-hero">
              <div class="a-hero-copy">
                <div class="eyebrow">本次报销 · 已自动整理</div>
                <h1>${task.title}</h1>
                <p>${task.employee} · ${task.date} · CLI 已完成材料盘点、费用事件整理与确定性校验。</p>
              </div>
              <div class="a-hero-summary">
                <div><span class="summary-number">${money(task.total)}</span><span class="summary-label">费用总额</span></div>
                <div><span class="summary-number">${task.eventCount}</span><span class="summary-label">候选明细</span></div>
              </div>
            </section>
            <div class="a-progress" aria-label="本次报销阶段">
              <div class="a-progress-step done"><span class="step-index">✓</span><span><strong>材料盘点</strong><span>${task.materialCount} 份材料</span></span></div>
              <div class="a-progress-step done"><span class="step-index">✓</span><span><strong>自动整理</strong><span>证据与映射已完成</span></span></div>
              <div class="a-progress-step active"><span class="step-index">3</span><span><strong>任务选择</strong><span>只需选择项目归属</span></span></div>
              <div class="a-progress-step"><span class="step-index">4</span><span><strong>ERP 草稿</strong><span>等待明确启动</span></span></div>
            </div>
            <div class="a-grid">
              <section class="a-queue" aria-labelledby="a-queue-title">
                <div class="a-panel-heading"><div><h2 id="a-queue-title">候选明细</h2><p>按费用事件列出，细节默认收起。</p></div><span class="queue-count">${task.eventCount} 条 · ${money(task.total)}</span></div>
                <div class="expense-list">${expenses.map(expenseRow).join("")}</div>
              </section>
              <aside class="a-rail" aria-label="任务选择与聚焦信息">
                <section class="rail-block">${assignmentControl("a-assignment")}</section>
                <section class="rail-block"><div class="section-kicker">当前选择</div>${(() => {
                  const expense = currentExpense();
                  return `<div class="selected-detail"><div class="detail-title"><div><h3>${expense.title}</h3><p>${expense.meta} · ${expense.category}</p></div><span class="amount">${money(expense.amount)}</span></div><dl class="detail-facts"><dt>主要凭证</dt><dd>${expense.invoice}</dd><dt>参考材料</dt><dd>${expense.reference || "无"}</dd><dt>项目归属</dt><dd>${projectLabel(selectedProject(expense))}</dd></dl><div class="non-blocking"><span><strong>可按需查看原件</strong><span>${expense.note}，不构成待确认项。</span></span></div><details class="collapsed-detail"><summary>查看自动整理详情</summary><div class="collapsed-detail-body"><div class="source-line"><span class="source-chip">纯发票</span><span>${expense.invoice} · 上传 ERP</span></div><div class="source-line"><span class="source-chip reference">参考材料</span><span>${expense.reference || "无"} · 不上传 ERP</span></div><div>字段候选、来源契约和确定性校验均已完成；这里只展示本次费用事件的摘要。</div></div></details><button class="button-quiet" type="button" data-action="open-evidence" data-expense="${expense.id}">聚焦查看这一条证据</button></div>`;
                })()}</section>
              </aside>
            </div>
            ${authorizationBlock("a-authorization")}
            ${erpStatus("a-erp")}
            <p class="demo-note" style="margin: 13px 0 0;">虚构数据 · 所有按钮只改变当前页面内存状态，不连接真实 ERP 或凭据库。</p>
          </main>
        </div>
      `;

      const renderVariantB = () => `
        <div class="page page-b">
          <header class="topbar">
            <div class="brand-lockup"><span class="brand">baox</span><span class="brand-context">事件阅读器</span></div>
            <div class="topbar-meta"><span>已整理 · ${task.id}</span><button type="button" data-action="reset" title="重置演示">↺</button></div>
          </header>
          <main class="b-main">
            <section class="b-heading">
              <div class="b-heading-copy"><div class="eyebrow">费用事件 · 按需查看证据</div><h1>先看一笔，再决定是否打开原件</h1><p>${task.title} 已经达到 ERP 就绪。这个方案把单笔费用事件、材料证据关联和候选明细放在同一个阅读路径中。</p></div>
              <div class="b-total-lockup"><span class="summary-number">${money(task.total)}</span><span>${task.eventCount} 条候选明细</span><span>${statusChip("ERP 就绪", "complete")}</span></div>
            </section>
            <div class="b-workbench">
              <nav class="event-index" aria-label="费用事件列表"><div class="event-index-heading"><h2>费用事件</h2><span>选择一笔查看</span></div>${expenses.map(eventNavItem).join("")}</nav>
              <section class="event-reader" aria-live="polite" aria-labelledby="reader-title"><span id="reader-title" class="sr-only">费用事件详情</span>${selectedReader()}</section>
              <aside class="candidate-pane" aria-labelledby="candidate-title"><div class="section-kicker">ERP 投影</div><h2 id="candidate-title">候选明细</h2><p>费用项目与 ERP 发票类型由公司规则只读映射；这里只选择项目归属。</p>${candidateTable()}${assignmentControl("b-assignment")}</aside>
            </div>
            <div class="b-footer-grid">
              ${authorizationBlock("b-authorization")}
              ${erpStatus("b-erp")}
            </div>
            <p class="demo-note" style="margin: 13px 0 0;">虚构数据 · 不提供常驻材料审核台，也不提供文件上传入口。</p>
          </main>
        </div>
      `;

      const renderVariantC = () => `
        <div class="page page-c">
          <header class="topbar">
            <div class="brand-lockup"><span class="brand">baox</span><span class="brand-context">本次报销简报</span></div>
            <div class="topbar-meta"><span>${task.id}</span><button type="button" data-action="reset" title="重置演示">↺</button></div>
          </header>
          <main class="c-main">
            <section class="c-overview">
              <div><div class="eyebrow">任务进度 · 没有阻塞性待确认项</div><h1>${task.title}</h1><p>${task.employee} · ${task.date}<br /> CLI 已把复杂的材料理解留在后台；你只需要完成一次任务选择并决定是否启动 ERP。</p></div>
              <div class="c-total-block"><span class="summary-number">${money(task.total)}</span><span class="summary-label">${task.eventCount} 条候选明细</span></div>
            </section>
            <section class="c-flow" aria-label="本次报销处理路径">
              <article class="c-step complete">
                <span class="c-step-marker">01</span>
                <div class="c-step-body"><div class="c-step-heading"><div><h2>材料已整理</h2><p>${task.materialCount} 份报销材料已分类，费用事件和字段候选已生成。</p></div>${statusChip("已完成", "complete")}</div><div class="c-complete-line"><strong>纯发票 4 份</strong><span>参考材料按需使用 · 原始材料未改动</span><span>确定性校验通过</span></div><details class="c-review-disclosure"><summary>展开整理摘要</summary><div class="c-review-list">${expenses.slice(0, 3).map((expense) => `<div class="c-review-item"><strong>${expense.title}</strong><span>${money(expense.amount)} · ${expense.category}</span></div>`).join("")}</div></details></div>
              </article>
              <article class="c-step active">
                <span class="c-step-marker">02</span>
                <div class="c-step-body"><div class="c-step-heading"><div><h2>选择项目归属</h2><p>这是材料无法证明、但启动 ERP 前必须补充的任务选择。</p></div>${statusChip(allProjectsAssigned() ? "已选择" : "需要选择", allProjectsAssigned() ? "complete" : "warning")}</div><div class="c-assignment">${assignmentControl("c-assignment-control")}</div><details class="c-review-disclosure"><summary>查看 ${task.eventCount} 条候选明细</summary><div class="c-review-list">${expenses.map((expense) => `<div class="c-review-item"><strong>${expense.index} · ${expense.title}</strong><span>${money(expense.amount)} · ${projectLabel(selectedProject(expense))}</span></div>`).join("")}</div></details></div>
              </article>
              <article class="c-step">
                <span class="c-step-marker">03</span>
                <div class="c-step-body"><div class="c-step-heading"><div><h2>创建 ERP 草稿</h2><p>开始后显示运行状态；草稿验证后由用户接管有头 ERP。</p></div>${statusChip(erpPhaseDisplay[state.erpPhase][0], erpPhaseDisplay[state.erpPhase][1])}</div><div class="c-erp-preview"><div><h3>将交给 ERP 的内容</h3><p>使用 ERP 就绪快照 v${task.readyVersion}，上传纯发票，写入 ${task.eventCount} 条候选明细；参考材料不会上传。</p></div><dl class="c-erp-facts"><dt>金额</dt><dd>${money(task.total)}</dd><dt>明细</dt><dd>${task.eventCount} 条</dd><dt>权限</dt><dd>只创建草稿</dd></dl></div>${authorizationBlock("c-authorization")}${erpStatus("c-erp")}</div>
              </article>
            </section>
            <p class="demo-note" style="margin: 14px 0 0;">虚构数据 · 这是一次性原型，刷新页面不会保存选择。</p>
          </main>
        </div>
      `;

      const evidenceDialog = () => {
        if (!state.evidenceOpen) return "";
        const expense = currentExpense();
        return `
          <div class="evidence-scrim" data-action="close-evidence">
            <section class="evidence-dialog" role="dialog" aria-modal="true" aria-labelledby="evidence-title" data-evidence-dialog>
              <header class="evidence-dialog-header"><div><div class="eyebrow">聚焦证据视图 · 只看当前异常</div><h2 id="evidence-title">${expense.index} · ${expense.title}</h2><p>不打开完整材料工作台，只展示这一条费用事件需要核对的原始页和解释。</p></div><button class="dialog-close" type="button" data-action="close-evidence" aria-label="关闭证据视图" title="关闭">×</button></header>
              <div class="evidence-dialog-body">
                <div class="document-stage"><div class="document-paper"><span class="paper-label">虚构电子票样本 · ${expense.invoice}</span><h3>电子普通发票</h3><div class="paper-subtitle">上海示例交通服务有限公司</div><div class="paper-rule"></div><div class="paper-grid"><span>开票日期</span><strong>2026-08-19</strong><span>购买方</span><strong>林默</strong><span>票种</span><strong>增值税普通发票</strong></div><div class="paper-highlight">杭州东 → 上海虹桥</div><div class="paper-grid"><span>服务内容</span><strong>网约车客运服务</strong><span>税率</span><strong>3%</strong></div><div class="paper-rule"></div><div class="paper-total"><span>价税合计</span><strong>${money(expense.amount)}</strong></div><span class="paper-stamp">示例</span></div></div>
                <div class="evidence-reading"><div class="section-kicker">为什么出现提示</div><h3>一张纯发票支持两条候选明细</h3><p>这不是待确认项。Agent 已依据行程单拆分费用事件，并通过金额、日期和城市规则校验。</p><div class="evidence-finding"><strong>非阻塞提示 · ${expense.note}</strong><span>当前候选明细采用 ${money(expense.amount)}，与原件高亮金额一致；另一条候选明细仍保留同一主要报销凭证。</span></div><dl class="evidence-facts"><dt>主要报销凭证</dt><dd><span class="source-chip">${expense.invoice} · 上传 ERP</span></dd><dt>参考材料</dt><dd>${expense.reference ? `<span class="source-chip reference">${expense.reference} · 不上传 ERP</span>` : "无"}</dd><dt>材料证据状态</dt><dd><span class="evidence-tag">${expense.evidence}</span></dd><dt>任务阶段</dt><dd>ERP 就绪 · 不需要用户纠正</dd><dt>项目归属</dt><dd>${projectLabel(selectedProject(expense))}</dd></dl><details><summary>查看原文摘录</summary><p class="evidence-quote">服务内容：网约车客运服务 · 行程：杭州东 → 上海虹桥 · 价税合计：${money(expense.amount)}</p></details><button class="button-secondary" style="margin-top: 20px;" type="button" data-action="close-evidence">返回本次报销</button></div>
              </div>
            </section>
          </div>
        `;
      };

      const renderSwitcher = () => {
        const switcher = document.getElementById("prototype-switcher");
        if (document.body.dataset.env === "production") {
          switcher.hidden = true;
          return;
        }
        const current = variants.find((variant) => variant.key === state.variant) || variants[0];
        switcher.hidden = false;
        switcher.innerHTML = `
          <button class="switcher-arrow" type="button" data-switch="previous" aria-label="上一个方案" title="上一个方案">←</button>
          <span class="switcher-label">${current.key} · ${current.name} <span>方案 ${variants.findIndex((variant) => variant.key === current.key) + 1}/3</span></span>
          <button class="switcher-arrow" type="button" data-switch="next" aria-label="下一个方案" title="下一个方案">→</button>
        `;
      };

      const render = () => {
        const html = state.variant === "A" ? renderVariantA() : state.variant === "B" ? renderVariantB() : renderVariantC();
        document.getElementById("app").innerHTML = html + evidenceDialog() + (state.toast ? `<div class="toast" role="status">${state.toast}</div>` : "");
        renderSwitcher();
      };

      document.addEventListener("click", (event) => {
        const switchButton = event.target.closest("[data-switch]");
        if (switchButton) {
          cycleVariant(switchButton.dataset.switch === "previous" ? -1 : 1);
          return;
        }

        const action = event.target.closest("[data-action]");
        if (!action) return;
        const actionType = action.dataset.action;

        if (actionType === "select-expense") {
          state.selectedExpense = action.dataset.expense;
          render();
        } else if (actionType === "open-evidence") {
          state.selectedExpense = action.dataset.expense;
          state.evidenceOpen = true;
          render();
        } else if (actionType === "close-evidence") {
          if (event.target.closest("[data-evidence-dialog]") && !event.target.closest("button")) return;
          state.evidenceOpen = false;
          render();
        } else if (actionType === "choose-individual") {
          state.projectMode = "individual";
          state.authorization = false;
          render();
        } else if (actionType === "choose-batch") {
          state.projectMode = "batch";
          state.authorization = false;
          render();
        } else if (actionType === "start-erp") {
          if (!state.authorization || !allProjectsAssigned()) {
            showToast("先完成项目归属并勾选启动授权。");
            return;
          }
          state.erpPhase = "running";
          state.evidenceOpen = false;
          showToast("已记录启动授权，进入本地 ERP 运行演示。");
        } else if (actionType === "advance-erp") {
          state.erpPhase = "awaiting-save";
          state.saveAuthorization = false;
          showToast("模拟填写完成，等待即时保存确认。");
        } else if (actionType === "save-erp") {
          if (!state.saveAuthorization) return;
          state.erpPhase = "draft-saved";
          showToast("模拟已验证单据编号和修改态，草稿尚未提交。");
        } else if (actionType === "handoff-erp") {
          state.erpPhase = "handed-off";
          showToast("已释放 ERP 自动化控制权，浏览器交给用户。");
        } else if (actionType === "reset") {
          state.selectedExpense = "e2";
          state.projectMode = "batch";
          state.batchProject = "";
          state.rowProjects = {};
          state.authorization = false;
          state.saveAuthorization = false;
          state.erpPhase = "ready";
          state.evidenceOpen = false;
          showToast("演示已重置。");
        }
      });

      document.addEventListener("change", (event) => {
        const control = event.target.dataset.control;
        if (control === "batch-project") {
          state.batchProject = event.target.value;
          state.authorization = false;
          render();
        } else if (control === "row-project") {
          state.rowProjects[event.target.dataset.expense] = event.target.value;
          state.authorization = false;
          render();
        } else if (control === "authorization") {
          state.authorization = event.target.checked;
          render();
        } else if (control === "save-authorization") {
          state.saveAuthorization = event.target.checked;
          render();
        }
      });

      window.addEventListener("keydown", (event) => {
        const target = event.target;
        const tagName = target?.tagName?.toLowerCase();
        if (["input", "textarea", "select"].includes(tagName) || target?.isContentEditable) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleVariant(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleVariant(1);
        } else if (event.key === "Escape" && state.evidenceOpen) {
          state.evidenceOpen = false;
          render();
        }
      });

      window.addEventListener("popstate", () => {
        state.variant = getInitialVariant();
        state.evidenceOpen = false;
        render();
      });

      render();
    </script>
  </body>
</html>
