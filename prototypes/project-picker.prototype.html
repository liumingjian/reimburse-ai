<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>baox · 项目归属填报方式原型</title>
    <style>
      :root {
        --ink: #17211e;
        --ink-soft: #35423d;
        --muted: #6d7a74;
        --canvas: #f4f6f3;
        --panel: #ffffff;
        --panel-soft: #f8faf8;
        --line: #d8e0dc;
        --line-strong: #bdcbc4;
        --blue: #2862ad;
        --blue-soft: #edf3fb;
        --amber: #a66506;
        --amber-soft: #fff5df;
        --coral: #c3533f;
        --coral-soft: #fdeeea;
        --green: #2b765d;
        --green-soft: #e9f5f0;
        --terminal: #202624;
        --terminal-soft: #2b332f;
        --terminal-muted: #aeb9b5;
        --shadow: 0 12px 28px rgb(27 47 40 / 10%);
      }

      * { box-sizing: border-box; }

      html {
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
      }

      body { min-width: 320px; margin: 0; padding-bottom: 132px; background: var(--canvas); }

      button, input, select { font: inherit; }
      button, input[type="checkbox"], input[type="radio"] { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }

      .page { max-width: 1240px; margin: 0 auto; padding: 20px 20px 0; }

      /* ---------- 顶栏与常驻计数器 ---------- */
      .topbar {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
        padding: 14px 16px; margin-bottom: 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
      }
      .topbar h1 { margin: 0; font-size: 16px; }
      .topbar-sub { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
      .topbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

      .counter-chip {
        display: flex; flex-direction: column; gap: 1px; min-width: 92px;
        padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-soft);
      }
      .counter-chip strong { font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .counter-chip span { color: var(--muted); font-size: 11px; }
      .counter-chip.live { border-color: var(--blue); background: var(--blue-soft); }

      .scenario-picker { display: flex; gap: 6px; align-items: center; }
      .scenario-picker > label { color: var(--muted); font-size: 12px; }
      .scenario-button {
        padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 999px;
        background: var(--panel); color: var(--ink-soft); font-size: 12px;
      }
      .scenario-button.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }

      .section-kicker { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .variant-badge {
        padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px;
        background: var(--panel-soft); color: var(--ink-soft); font-size: 12px; white-space: nowrap;
      }
      .design-heading {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between;
        margin-bottom: 12px;
      }
      .design-heading h2 { margin: 4px 0 2px; font-size: 18px; }
      .design-heading p { max-width: 68ch; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

      /* ---------- 终端 ---------- */
      .terminal {
        padding: 16px; border-radius: 12px; background: var(--terminal); color: #eef3f1;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; line-height: 1.65;
      }
      .term-line { white-space: pre-wrap; }
      .term-line.dim { color: var(--terminal-muted); }
      .term-line.warn { color: #f0c274; }
      .term-line.bad { color: #f19b88; }
      .term-line.ok { color: #8fd3b6; }
      .term-rule { margin: 10px 0; border-top: 1px dashed #46524d; }

      .q-block {
        margin: 10px 0; padding: 10px 12px; border: 1px solid #46524d; border-left: 3px solid #7fb2f0;
        border-radius: 8px; background: var(--terminal-soft);
      }
      .q-block.answered { border-left-color: #8fd3b6; }
      .q-block.blocked { border-left-color: #f19b88; }
      .q-head { margin-bottom: 8px; color: #d7e2de; }
      .q-meta { color: var(--terminal-muted); font-size: 12px; }
      .q-options { display: flex; flex-direction: column; gap: 5px; }
      .q-option {
        display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 6px 9px;
        border: 1px solid #4d5b56; border-radius: 6px; background: #232b28; color: #e6eeeb;
        font: inherit; text-align: left;
      }
      .q-option:hover { border-color: #7fb2f0; }
      .q-option.chosen { border-color: #8fd3b6; background: #26362f; }
      .q-option .key { color: var(--terminal-muted); }
      .q-option .name { color: var(--terminal-muted); }
      .q-option.escape { border-style: dashed; }

      .term-input-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .term-input {
        flex: 1; padding: 6px 9px; border: 1px solid #4d5b56; border-radius: 6px;
        background: #171d1b; color: #eef3f1; font-family: inherit;
      }
      .term-button {
        padding: 6px 14px; border: 1px solid #7fb2f0; border-radius: 6px;
        background: #24374d; color: #cfe2fa; font: inherit;
      }
      .term-button.primary { background: #2f4f6f; }
      .term-button:disabled { opacity: 0.45; }
      .term-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

      .constraint-note {
        margin: 12px 0 0; padding: 8px 10px; border-left: 3px solid var(--amber);
        border-radius: 0 6px 6px 0; background: #33301f; color: #f0c274; font-size: 12px; line-height: 1.6;
      }

      /* ---------- 网页工作台 ---------- */
      .workbench { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
      @media (max-width: 940px) { .workbench { grid-template-columns: minmax(0, 1fr); } }

      .panel { padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
      .panel-title { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
      .panel-title h3 { margin: 0; font-size: 14px; }
      .panel-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

      .cluster { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .cluster.done { border-color: var(--green); }
      .cluster-head { display: flex; gap: 10px; align-items: center; padding: 9px 11px; background: var(--panel-soft); }
      .cluster-head label { flex: 1; cursor: pointer; }
      .cluster-title { font-weight: 600; }
      .cluster-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
      .cluster-toggle { border: 0; background: none; color: var(--muted); font-size: 12px; }

      .line-row { display: flex; gap: 10px; align-items: center; padding: 7px 11px; border-top: 1px solid var(--line); }
      .line-row:hover { background: var(--panel-soft); }
      .line-main { flex: 1; min-width: 0; }
      .line-detail { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .line-meta { color: var(--muted); font-size: 12px; }
      .line-amount { font-variant-numeric: tabular-nums; }

      .chip {
        display: inline-flex; gap: 5px; align-items: center; padding: 2px 8px; border-radius: 999px;
        border: 1px solid var(--line-strong); background: var(--panel-soft); color: var(--ink-soft); font-size: 12px; white-space: nowrap;
      }
      .chip.assigned { border-color: var(--green); background: var(--green-soft); color: var(--green); }
      .chip.inherited { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
      .chip.bad { border-color: var(--coral); background: var(--coral-soft); color: var(--coral); font-weight: 600; }
      .chip.none { color: var(--muted); }

      .project-item {
        display: flex; gap: 8px; align-items: baseline; width: 100%; margin-bottom: 5px; padding: 7px 9px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left;
      }
      .project-item:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
      .project-item .code { font-variant-numeric: tabular-nums; font-weight: 600; }
      .project-item .name { flex: 1; color: var(--ink-soft); font-size: 12px; }
      .project-item .count { color: var(--green); font-size: 12px; }

      .search-input, .manual-input {
        width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel);
      }
      .panel-group { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
      .panel-group-heading { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
      .project-scroll { max-height: 236px; overflow-y: auto; }

      .button-primary, .button-secondary, .button-danger {
        padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; font-size: 13px;
      }
      .button-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      .button-secondary { background: var(--panel); border-color: var(--line-strong); color: var(--ink-soft); }
      .button-danger { background: var(--coral); border-color: var(--coral); color: #fff; }

      .callout {
        margin: 10px 0; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--amber); background: var(--amber-soft); color: var(--amber); font-size: 12px; line-height: 1.6;
      }
      .callout.bad { border-color: var(--coral); background: var(--coral-soft); color: var(--coral); }
      .callout.ok { border-color: var(--green); background: var(--green-soft); color: var(--green); }
      .cluster.sub { margin: 6px 0 6px 22px; border-left: 3px solid var(--line-strong); }
      .cluster-nobox { display: inline-block; width: 13px; text-align: center; color: var(--ink-soft); }
      .grouping-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
      .button-secondary.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft, var(--panel)); font-weight: 600; }
      .plan-rows { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 6px; }
      .plan-row { display: flex; align-items: baseline; gap: 10px; padding: 4px 8px; border-radius: 6px; }
      .plan-row.on { background: rgba(0, 0, 0, 0.05); }
      .plan-name { min-width: 12em; font-weight: 600; }
      .plan-num { min-width: 4em; font-variant-numeric: tabular-nums; font-weight: 700; }
      .plan-steps { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
      .callout-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

      /* ---------- 底部对比条 ---------- */
      .compare-bar {
        position: fixed; right: 0; bottom: 0; left: 0; z-index: 40;
        padding: 8px 16px 10px; background: rgb(255 255 255 / 96%); border-top: 1px solid var(--line-strong);
        box-shadow: 0 -8px 20px rgb(27 47 40 / 8%);
      }
      .compare-inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1240px; margin: 0 auto; }
      .compare-title { min-width: 116px; color: var(--muted); font-size: 11px; line-height: 1.4; }
      .compare-card { flex: 1; min-width: 188px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft); }
      .compare-card.live { border-color: var(--blue); background: var(--blue-soft); }
      .compare-card b { font-size: 13px; }
      .compare-nums { display: flex; gap: 12px; align-items: baseline; margin-top: 2px; }
      .compare-nums .measured { font-size: 20px; font-variant-numeric: tabular-nums; }
      .compare-nums .est { color: var(--muted); font-size: 12px; }
      .compare-card small { display: block; color: var(--muted); font-size: 11px; line-height: 1.45; }

      .log-toggle { border: 0; background: none; color: var(--blue); font-size: 12px; text-decoration: underline; }
      .log-list { max-height: 150px; margin: 6px 0 0; padding: 0 0 0 18px; overflow-y: auto; color: var(--muted); font-size: 12px; line-height: 1.6; }

      .demo-note { margin: 16px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.7; }

      .toast {
        position: fixed; bottom: 148px; left: 50%; z-index: 60; transform: translateX(-50%);
        max-width: 84vw; padding: 9px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px;
        box-shadow: var(--shadow);
      }

      .prototype-switcher {
        position: fixed; right: 16px; bottom: 148px; z-index: 50;
        display: flex; gap: 6px; align-items: center; padding: 6px 8px;
        border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: #fff; box-shadow: var(--shadow);
      }
      .switcher-arrow { width: 28px; height: 28px; border: 0; border-radius: 999px; background: #2f3b37; color: #fff; }
      .switcher-label { display: flex; flex-direction: column; padding: 0 6px; font-size: 12px; }
      .switcher-label span { color: #a9b6b1; font-size: 10px; }
    </style>
  </head>
  <body data-env="prototype">
    <div id="app"></div>
    <div id="compare" class="compare-bar" aria-label="三变体交互次数对比"></div>
    <div id="prototype-switcher" class="prototype-switcher" aria-label="原型方案切换" hidden></div>

    <script>
      /*
        三种「项目归属填报方式」并排比较，同一批虚构费用事件，?variant=A|B|C 切换。
        原型要产出的是一个数字：每个变体走完全程需要几次用户交互。
        记账口径：一次需要用户动手的动作 = 1 次交互（选项点击、勾选、点项目、打字回车、
        提交、打开浏览器都算）。切换变体不清零，三份计数各自保留，见底部对比条。
      */
      const variants = [
        { key: "A", name: "终端逐簇问" },
        { key: "B", name: "网页工作台" },
        { key: "C", name: "终端起手 + 页面收尾" },
      ];

      const task = { id: "BX-260907-032", title: "9 月差旅与本地费用 · 37 条", employee: "林默 · 研发交付组" };

      /* 内置清单：发布时冻结的 ERP 派生快照（Q2 / Q11）。故意放了成串的相似名称。 */
      const PROJECTS = [
        { code: "P-1042", name: "招商银行—零售中台二期" },
        { code: "P-1043", name: "招商银行—零售中台三期" },
        { code: "P-1044", name: "招商银行—零售中台四期" },
        { code: "P-1051", name: "招商银行—信用卡活动运营" },
        { code: "P-1120", name: "平安产险—理赔中台一期" },
        { code: "P-1121", name: "平安产险—理赔中台二期" },
        { code: "P-1128", name: "平安产险—车险定损影像" },
        { code: "P-1203", name: "广发证券—资管系统重构一期" },
        { code: "P-1204", name: "广发证券—资管系统重构二期" },
        { code: "P-1210", name: "广发证券—柜台迁移" },
        { code: "P-1305", name: "南方电网—计量数据平台" },
        { code: "P-1306", name: "南方电网—计量数据平台二期" },
        { code: "P-1311", name: "南方电网—配网巡检小程序" },
        { code: "P-1402", name: "顺丰—仓配调度优化" },
        { code: "P-1403", name: "顺丰—仓配调度优化二期" },
        { code: "P-1410", name: "顺丰—冷链温控看板" },
        { code: "P-1501", name: "美的—工厂能耗看板" },
        { code: "P-1502", name: "美的—工厂能耗看板二期" },
        { code: "P-1508", name: "美的—供应商门户" },
        { code: "P-1601", name: "长城汽车—整车质量追溯" },
        { code: "P-1602", name: "长城汽车—整车质量追溯二期" },
        { code: "P-1701", name: "中国石化—加油站会员中台" },
        { code: "P-1702", name: "中国石化—加油站会员中台二期" },
        { code: "P-1801", name: "京东健康—处方流转平台" },
        { code: "P-1802", name: "京东健康—处方流转平台二期" },
        { code: "P-1901", name: "三一重工—设备物联接入" },
        { code: "P-1902", name: "三一重工—设备物联接入二期" },
        { code: "P-2001", name: "中信保诚—代理人展业助手" },
        { code: "P-2002", name: "中信保诚—代理人展业助手二期" },
        { code: "P-2101", name: "海尔—用户旅程分析" },
        { code: "P-2102", name: "海尔—用户旅程分析二期" },
        { code: "P-2211", name: "中原银行—信贷中台一期" },
        { code: "P-2212", name: "中原银行—信贷中台二期" },
        { code: "P-2301", name: "泸州老窖—渠道费用管理" },
        { code: "P-2401", name: "上汽通用—售后备件预测" },
        { code: "P-2501", name: "蒙牛—经销商结算" },
        { code: "P-2601", name: "携程—商旅结算对接" },
        { code: "P-2701", name: "公司内部—财务系统升级" },
        { code: "P-2801", name: "公司内部—员工培训" },
        { code: "P-3050", name: "国信证券—数据治理平台" },
      ];

      /* ERP 只读核对的模拟（kernel/src/erpcatalog.mjs · verifyProject 的四种 verdict）。
         快照与 ERP 之间故意留了三处错位，用来画 Q7 的核对失败与 Q15 的「这是清单的问题」。 */
      const ERP_DRIFT = {
        "P-2211": { verdict: "unusable", detail: "ERP 主数据：项目状态「已关闭」（2026-04-30 结项），不可作为报销归属", hint: "P-2212" },
        "P-3050": { verdict: "ambiguous", detail: "ERP 主数据返回 2 条同号记录（数据治理平台 / 数据治理平台（迁移）），无法判定", hint: "" },
        "P-2301": { verdict: "missing", detail: "内置清单里有，ERP 主数据里查不到——快照自 2026-06 冻结后该项目被撤销", hint: "" },
      };

      const verifyProject = (code) => {
        const known = PROJECTS.find((project) => project.code === code);
        if (ERP_DRIFT[code]) return { code, ...ERP_DRIFT[code] };
        if (!known) return { code, verdict: "missing", detail: "内置清单和 ERP 主数据里都没有这个项目号", hint: "" };
        return { code, verdict: "confirmed", detail: `ERP 主数据：${known.name} · 进行中`, hint: "" };
      };

      const VERDICT_LABEL = {
        confirmed: "核对通过",
        missing: "核对失败 · ERP 查无此项目",
        ambiguous: "核对失败 · 清单与 ERP 错位",
        unusable: "核对失败 · 项目不可用",
      };

      /* 费用事件与归属簇（Q9：连续日期 + 同城的行程，或同一主要报销凭证）。 */
      const L = (id, date, city, category, detail, amount) => ({ id, date, city, category, detail, amount });

      const CLUSTERS = [
        {
          id: "gz", kind: "行程", title: "广州 · 9/3–9/6", basis: "连续日期 + 同城",
          pool: ["P-1120", "P-1121", "P-1128"],
          lines: [
            L("gz-1", "09-03", "广州", "长途交通", "北京—广州 机票", 1280),
            L("gz-2", "09-03", "广州", "市外交通", "白云机场—酒店 打车", 96),
            L("gz-3", "09-03", "广州", "住宿", "广州天河 酒店 3 晚", 1470),
            L("gz-4", "09-04", "广州", "餐饮", "客户现场午餐", 88),
            L("gz-5", "09-04", "广州", "市内交通", "酒店—客户现场", 42),
            L("gz-6", "09-05", "广州", "餐饮", "项目组晚餐", 236),
            L("gz-7", "09-06", "广州", "市外交通", "酒店—白云机场 打车", 104),
            L("gz-8", "09-06", "广州", "长途交通", "广州—北京 机票", 1360),
          ],
        },
        {
          id: "sz", kind: "行程", title: "深圳 · 9/9–9/11", basis: "连续日期 + 同城",
          pool: ["P-1203", "P-1204", "P-1210"],
          lines: [
            L("sz-1", "09-09", "深圳", "长途交通", "北京—深圳 机票", 1420),
            L("sz-2", "09-09", "深圳", "市外交通", "宝安机场—酒店", 88),

          id: "inv", kind: "凭证", title: "合并交通票 INV-TR-8842 · 分摊 3 段", basis: "同一主要报销凭证",

      /* 需要用户决策的簇：继承簇不问（Q14）。这本身就是一个结论——凭证簇把 6 个簇降到 5 次决策。 */
      const askableClusters = () => CLUSTERS.filter((cluster) => !cluster.inheritFrom);
      const ALL_LINES = CLUSTERS.flatMap((cluster) => cluster.lines.map((line) => ({ ...line, clusterId: cluster.id })));
      const clusterById = (id) => CLUSTERS.find((cluster) => cluster.id === id);
      /* 归属簇没有层级，补齐字段好让渲染器只认一种 group 形状。 */
      CLUSTERS.forEach((cluster) => {

      });
      const projectByCode = (code) => PROJECTS.find((project) => project.code === code);
      const projectName = (code) => projectByCode(code)?.name || "（清单外）";

      /*
        分组维度。归属簇（行程／凭证）是 Q9 的原结论；费用类别是用户在看过原型后提出的替代。

      const CATEGORY_ORDER = ["长途交通", "市外交通", "市内交通", "住宿", "餐饮", "会议", "招待"];
      const CATEGORY_GROUPS = CATEGORY_ORDER.map((name) => ({

        ownLines: ALL_LINES.filter((line) => line.category === name),

      /*
        V1 分组（用户拍板的口径）：一级只有四类——市内交通 / 市外交通 / 长途 / 住宿。
        本市＝北京；在外地城市里跑的地面交通算「市外交通」，并按城市二级分。
        余下的餐饮、会议、招待本版**不分组**，摊在最后逐条处理——这是「只做四类」的实际代价，
        必须看得见，否则 V1 的账是假的。
      */
      const HOME_CITY = "北京";
      const cat1Of = (line) => {
        if (line.category === "长途交通") return "长途";
        if (line.category === "住宿") return "住宿";
        if (line.category === "市外交通") return "市外交通";
        if (line.category === "市内交通") return line.city === HOME_CITY ? "市内交通" : "市外交通";
        return "其他";
      };
      const V1_ORDER = ["市内交通", "市外交通", "长途", "住宿"];
      /* 交通票的特殊处理：同一张合并凭证分摊出来的几段，绑成一个选择单元，勾一次就是一整张票。 */
      const voucherOf = (line) => (clusterById(line.clusterId).kind === "凭证" ? clusterById(line.clusterId) : null);

      const makeGroup = (id, kind, title, basis, lines, extra = {}) => ({
        id, kind, title, basis, lines, children: [], ownLines: lines, ...extra,
      });

      const V1_GROUPS = (() => {
        const out = V1_ORDER.map((name) => {
          const lines = ALL_LINES.filter((line) => cat1Of(line) === name);
          if (name !== "市外交通") return makeGroup(`v1-${name}`, "一级类别", name, "同一费用类别", lines);
          const cities = [...new Set(lines.map((line) => line.city))];
          const children = cities.map((city) => {
            const cityLines = lines.filter((line) => line.city === city);
            const vouchers = [...new Set(cityLines.map((line) => voucherOf(line)).filter(Boolean))];
            const bundled = vouchers.map((voucher) =>
              makeGroup(`v1-市外交通-${city}-${voucher.id}`, "交通凭证", voucher.title, "同一张合并交通票，分摊出的各段绑成一个选择单元", cityLines.filter((line) => voucherOf(line) === voucher)),
            );
            const loose = cityLines.filter((line) => !voucherOf(line));
            return { ...makeGroup(`v1-市外交通-${city}`, "城市", city, "市外交通 · 按城市二级分类", cityLines), children: bundled, ownLines: loose };
          });
          return { ...makeGroup("v1-市外交通", "一级类别", "市外交通", "外地城市内的地面交通 · 按城市二级分类", lines), children, ownLines: [] };
        });
        const rest = ALL_LINES.filter((line) => cat1Of(line) === "其他");
        /* 没有整组复选框：本版没给它分类，就不能白拿一次整组勾。 */
        return [...out, makeGroup("v1-其他", "本版不分组", `其他（${rest.length} 条）`, "餐饮 / 会议 / 招待——V1 的四类之外，只能逐条勾", rest, { noGroupSelect: true })];
      })();

      /*
        「其他」到底给不给整组勾，是 V1 唯一一处能自己决定的成本。单列一档出来量它，
        免得「只做四类」的代价被算到分组维度头上。
      */
      const V1_GROUPS_PLUS = V1_GROUPS.map((group) =>
        group.noGroupSelect
          ? { ...group, id: "v1p-其他", noGroupSelect: false, kind: "兜底组", title: group.title.replace("其他", "其他"), basis: "四类之外的一律进这一组，但给它一个整组勾" }
          : group,
      );

      const GROUPINGS = [
        { key: "catv1", name: "按费用类别 V1（四类 + 市外按城市）", note: "一级四类：市内交通 / 市外交通 / 长途 / 住宿；市外交通按城市二级分；合并交通票绑成一个单元。四类之外的逐条处理。" },
        { key: "catv1plus", name: "V1 + 其他也成组", note: "同 V1，只多一条：四类之外的那些进一个「其他」兜底组，也给整组勾。用来量「只做四类」花了多少钱。" },
        { key: "category", name: "按费用类别（七类平铺）", note: "上一版的对照：不分级、不按城市，餐饮会议招待各自成组。" },
        { key: "cluster", name: "按归属簇（行程/凭证）", note: "Q9 原口径：连续日期＋同城，或同一主要报销凭证；凭证簇继承分摊前那一行。" },
      ];
      const GROUP_SETS = { catv1: V1_GROUPS, catv1plus: V1_GROUPS_PLUS, category: CATEGORY_GROUPS, cluster: CLUSTERS };
      const groupsOf = (grouping) => GROUP_SETS[grouping] || V1_GROUPS;
      /* 层级分组要能按 id 找到任意一层，勾选框的 indeterminate 才对得上。 */
      const flattenGroups = (groups) => groups.flatMap((group) => [group, ...flattenGroups(group.children || [])]);
      const ALL_GROUPS = Object.values(GROUP_SETS).flatMap((set) => flattenGroups(set));
      const groupById = (id) => ALL_GROUPS.find((group) => group.id === id);
      const groupingByKey = (key) => GROUPINGS.find((item) => item.key === key) || GROUPINGS[0];

      /*
        场景 = 这批费用「真正」落在几个项目上。C 的价值完全取决于例外率，
        所以例外率必须是可当场拨动的旋钮，而不是写死的乐观假设。
      */
      const SCENARIOS = [
        { key: "focused", name: "集中", desc: "37 条全落在 1 个项目", truth: { gz: "P-1042", sz: "P-1042", sh: "P-1042", cd: "P-1042", bj: "P-1042" } },
        { key: "mild", name: "轻度分散", desc: "2 个项目，主项目占 3/4", truth: { gz: "P-1120", sz: "P-1042", sh: "P-1042", cd: "P-1042", bj: "P-1042" } },

        /*
          第四个场景是给「按类别分组」留的反例：真值按费用类别落，行程簇内部反而不一致。
          没有它，类别分组只会在按行程构造的数据上挨打——那就是一场作弊的对照。
        */
        {
          key: "bycat", name: "按旧七类落", desc: "差旅费归项目，市内与餐饮归部门费用池（上一版口径）",
          byCategory: { 长途交通: "P-1042", 市外交通: "P-1042", 住宿: "P-1042", 市内交通: "P-2701", 餐饮: "P-2701", 会议: "P-2801", 招待: "P-2801" },

          按 V1 口径落：长途与住宿进集中差旅池，外地地面交通跟着所在城市的项目走，
          本市交通与餐饮会议进部门费用池。这是「市外交通按城市二级分」唯一能挣到钱的世界。
        */
        {
          key: "bycatv1", name: "按V1四类落", desc: "长途/住宿进差旅池，市外交通按城市跟项目，市内与其他进部门池",
          byV1: { 长途: "P-1042", 住宿: "P-1042", 市内交通: "P-2701", 其他: "P-2701" },

      const scenario = () => SCENARIOS.find((item) => item.key === state.scenario) || SCENARIOS[2];

      /* 真值的最小单位是明细行；簇真值和类别真值都由它导出。 */
      const truthOfLine = (line) => {
        const current = scenario();
        if (current.byV1) {
          const cat1 = cat1Of(line);
          return cat1 === "市外交通" ? current.byCity[line.city] : current.byV1[cat1];
        }
        if (current.byCategory) return current.byCategory[line.category];
        const cluster = clusterById(line.clusterId || ALL_LINES.find((item) => item.id === line.id).clusterId);
        return current.truth[cluster.inheritFrom || cluster.id];
      };
      /* 簇真值 = 簇内多数派。byCat 场景下簇是不纯的，A/C 以簇为提问单位就答不准——页面会明说。 */
      const truthFor = (clusterId) => {
        const cluster = clusterById(clusterId);
        const current = scenario();
        if (current.truth) return current.truth[cluster.inheritFrom || clusterId];
        const weight = {};
        cluster.lines.forEach((line) => {
          const code = truthOfLine(line);
          weight[code] = (weight[code] || 0) + 1;
        });
        return Object.entries(weight).sort((a, b) => b[1] - a[1])[0][0];

      const groupIsPure = (group) => new Set(group.lines.map((line) => truthOfLine(line))).size === 1;
      const impureGroups = (grouping) => groupsOf(grouping).filter((group) => !groupIsPure(group));

      /* C 的主项目 = 覆盖行数最多的真值；例外簇 = 真值与主项目不同的可问簇。 */
      const mainProjectOfScenario = () => {
        const weight = {};
        CLUSTERS.forEach((cluster) => {
          const code = truthFor(cluster.id);

        return Object.entries(weight).sort((a, b) => b[1] - a[1])[0][0];

      const exceptionClusters = () => askableClusters().filter((cluster) => truthFor(cluster.id) !== mainProjectOfScenario());
      const exceptionLineCount = () =>
        CLUSTERS.filter((cluster) => truthFor(cluster.id) !== mainProjectOfScenario()).reduce((sum, cluster) => sum + cluster.lines.length, 0);

      /* ---------------------------------------------------------------- 状态与记账 */

      const getVariant = () => {

      const freshB = () => ({

        search: "", searchCounted: false, manualOpen: false, manualError: null,
        pendingOverwrite: null, verifyResults: [], submitted: false,
      });

      const counters = { A: { actions: 0, browser: 0, log: [] }, B: { actions: 0, browser: 0, log: [] }, C: { actions: 0, browser: 0, log: [] } };

      const state = {
        variant: getVariant(),
        scenario: "real",
        showLog: false,
        toast: "",
        pendingFocusId: "",
        a: freshA(),
        b: freshB(),
