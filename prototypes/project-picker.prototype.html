      };

      let toastTimer;

      const bump = (label, { browser = false } = {}) => {
        const counter = counters[state.variant];
        counter.actions += 1;
        if (browser) counter.browser += 1;
        counter.log.push(`#${counter.actions}${browser ? " · 开浏览器" : ""} ${label}`);
      };

      const resetVariant = (key) => {
        counters[key] = { actions: 0, browser: 0, log: [] };
        if (key === "A") state.a = freshA();
        /* 分组维度是看法不是数据，重置计数时留着，免得 QA 每换一次场景都要重新切。 */
        if (key === "B") state.b = { ...freshB(), grouping: state.b?.grouping || "catv1" };
        if (key === "C") state.c = freshC();
      };

      const resetAll = () => variants.forEach((variant) => resetVariant(variant.key));

      const money = (value) => `¥${value.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const clusterAmount = (cluster) => cluster.lines.reduce((sum, line) => sum + line.amount, 0);

      /* ---------------------------------------------------------------- 归属写入 */

      /* Q4：候选只影响排序，绝不预填。本任务内已选优先，其次本人历史。终端最多放 3 个 + 「其他」。 */
      const candidatesFor = (cluster, assign) => {
        const counts = {};
        Object.values(assign).forEach((entry) => {
          if (entry && entry.via !== "继承") counts[entry.code] = (counts[entry.code] || 0) + 1;
        });
        const used = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
        const ordered = [];
        [...used, ...cluster.pool].forEach((code) => {
          if (!ordered.includes(code)) ordered.push(code);
        });
        return ordered.slice(0, 3);
      };

      /* Q14：分摊出的多段继承分摊前那一行的项目，不标待确认。Q16：簇内单独改过的行不被覆盖。 */
      const assignCluster = (assign, clusterId, code, via) => {
        clusterById(clusterId).lines.forEach((line) => {
          assign[line.id] = { code, via };
        });
        CLUSTERS.filter((cluster) => cluster.inheritFrom === clusterId).forEach((cluster) => {
          cluster.lines.forEach((line) => {
            if (assign[line.id]?.via === "覆盖") return;
            assign[line.id] = { code, via: "继承" };
          });
        });
      };

      const assignedCount = (assign) => ALL_LINES.filter((line) => assign[line.id]).length;
      const usedCodes = (assign) => [...new Set(ALL_LINES.map((line) => assign[line.id]?.code).filter(Boolean))];
      const codeLineCount = (assign, code) => ALL_LINES.filter((line) => assign[line.id]?.code === code).length;
      const clusterAssignment = (assign, cluster) => {
        const codes = [...new Set(cluster.lines.map((line) => assign[line.id]?.code).filter(Boolean))];
        if (!codes.length) return { code: "", mixed: false };
        if (codes.length > 1 || cluster.lines.some((line) => !assign[line.id])) return { code: codes[0], mixed: true };
        return { code: codes[0], mixed: false };
      };

      /* Q11：写入前只对本次用到的三五个项目号做只读核对，不核对整本清单。 */
      const runVerification = (assign) => usedCodes(assign).map((code) => verifyProject(code));
      const failuresOf = (results) => results.filter((result) => result.verdict !== "confirmed");
      const verdictOfCode = (results, code) => results.find((result) => result.code === code)?.verdict || "";

      /*
        B 的最省选择路径。给定分组维度，走一遍真值：能整组勾就整组勾，勾不动就逐条勾，
        然后点一次项目把这一批扫进去。这是「按类别分组还是按归属簇分组」唯一诚实的裁判——
        它对两种分法用的是同一把尺，谁在什么数据上省，直接看数。
      */
      const bPlan = (grouping) => {
        const groups = groupsOf(grouping);
        const assign = {};
        const weight = {};
        ALL_LINES.forEach((line) => {
          const code = truthOfLine(line);
          weight[code] = (weight[code] || 0) + 1;
        });
        const codes = Object.keys(weight).sort((a, b) => weight[b] - weight[a]);
        const moves = [];
        const steps = [];
        let selects = 0;
        let picks = 0;
        codes.forEach((code) => {
          const want = ALL_LINES.filter((line) => truthOfLine(line) === code && assign[line.id]?.code !== code);
          if (!want.length) {
            steps.push(`${code}：${weight[code]} 条已被凭证继承带到位，0 次点击`);
            return;
          }
          const wantIds = want.map((line) => line.id);
          /* Q14：父簇被整簇选中时，分摊出来的那几段是白送的，不该记成点击。 */
          const free = new Set();
          CLUSTERS.filter((cluster) => cluster.inheritFrom).forEach((child) => {
            const parent = clusterById(child.inheritFrom);
            if (parent.lines.every((line) => wantIds.includes(line.id))) child.lines.forEach((line) => free.add(line.id));
          });
          const picked = new Set();
          const groupHits = [];
          const cover = (group) => {
            if (!group.lines.length) return;
            if (group.lines.every((line) => free.has(line.id))) return;
            if (!group.noGroupSelect && group.lines.every((line) => wantIds.includes(line.id))) {
              groupHits.push(group.id);
              group.lines.forEach((line) => picked.add(line.id));
              return;
            }
            (group.children || []).forEach(cover);
          };
          groups.forEach(cover);
          const lineHits = wantIds.filter((id) => !picked.has(id) && !free.has(id));
          lineHits.forEach((id) => picked.add(id));
          selects += groupHits.length + lineHits.length;
          picks += 1;
          moves.push({ code, groups: groupHits, lines: lineHits });
          steps.push(`${code}（${wantIds.length} 条）：${groupHits.length} 次整组勾 + ${lineHits.length} 次逐条勾 + 1 次点项目`);
          CLUSTERS.forEach((cluster) => {
            const inCluster = cluster.lines.filter((line) => picked.has(line.id));
            if (!inCluster.length) return;
            if (inCluster.length === cluster.lines.length && !cluster.inheritFrom) {
              assignCluster(assign, cluster.id, code, "选择");
            } else {
              inCluster.forEach((line) => {
                assign[line.id] = { code, via: cluster.inheritFrom ? "覆盖" : "选择" };
              });
            }
          });
        });
        const searches = picks;
        return { selects, picks, searches, moves, steps, codes, total: 1 + selects + picks + searches + 1 };
      };

      /* ---------------------------------------------------------------- 估算模型 */
      /*
        与实测同口径的公式估算，写在对比条上供当场反驳。
        用户可以说「你这条公式不对」——那正是原型该收到的反馈。
      */
      const estimate = (key) => {
        const asks = askableClusters();
        const rounds = Math.ceil(asks.length / 4);
        const truthCodes = [...new Set(asks.map((cluster) => truthFor(cluster.id)))];
        const failures = truthCodes.filter((code) => verifyProject(code).verdict !== "confirmed").length;

        if (key === "A") {
          /* 手打的编码当场核对，坏码只多花一次重打；从候选里选中的坏码要拖到最后核对才炸，代价大得多。 */
          const assign = {};
          let manual = 0;
          let inlineRetry = 0;
          let lateFailure = 0;
          /* 关键：候选排序里的「本任务内已选」只在轮与轮之间刷新——同一轮的 4 道题是一起问的，
             第 1 题选的项目帮不到第 2 题。A 的成本因此对「簇怎么分轮」很敏感。 */
          for (let start = 0; start < asks.length; start += 4) {
            const round = asks.slice(start, start + 4);
            const snapshot = { ...assign };
            const settlements = [];
            round.forEach((cluster) => {
              const truth = truthFor(cluster.id);
              const inCandidates = candidatesFor(cluster, snapshot).includes(truth);
              const bad = verifyProject(truth).verdict !== "confirmed";
              if (!inCandidates) manual += 1;
              if (bad && !inCandidates) inlineRetry += 1;
              if (bad && inCandidates) lateFailure += 1;
              settlements.push([cluster.id, bad ? verifyProject(truth).hint || truth : truth]);
            });
            settlements.forEach(([clusterId, code]) => assignCluster(assign, clusterId, code, "选择"));
          }
          return {
            actions: asks.length + manual + inlineRetry + rounds + 1 + lateFailure * 3,
            browser: 0,
            formula: `${asks.length} 选项 + ${manual} 手打（候选装不下）${inlineRetry ? ` + ${inlineRetry} 手打被当场拦下重打` : ""} + ${rounds} 提交轮次 + 1 核对写入${lateFailure ? ` + ${lateFailure}×3 核对失败退回重答` : ""}`,
          };
        }
        if (key === "B") {
          const grouping = state.b.grouping;
          const plan = bPlan(grouping);
          const badCodes = plan.codes.filter((code) => verifyProject(code).verdict !== "confirmed").length;
          const fix = badCodes * 2;
          return {
            actions: plan.total + fix,
            browser: 1,
            formula: `1 开浏览器 + ${plan.selects} 勾选（${groupingByKey(grouping).name}）+ ${plan.picks} 点项目 + ${plan.searches} 搜索 + 1 核对提交${badCodes ? ` + ${badCodes}×2 就地改派` : ""}`,
          };
        }
        const exceptions = exceptionClusters();
        /* 起手式的候选也是猜的：主项目不在前 3 猜测里，就得多打一次字。 */
        const manualMain = cMainCandidates().includes(mainProjectOfScenario()) ? 0 : 1;
        const opener = 2 + manualMain + 1;
        if (!exceptions.length) {
          return {
            actions: opener + 1,
            browser: 0,
            formula: `2 选项（主项目 + 无例外）${manualMain ? "+ 1 手打主项目 " : ""}+ 1 提交 + 1 核对写入 · 全程不开浏览器`,
          };
        }
        const fix = failures * 2;
        return {
          actions: opener + 1 + exceptions.length * 2 + 1 + fix,
          browser: 1,
          formula: `2 选项${manualMain ? " + 1 手打主项目" : ""} + 1 提交 + 1 开浏览器 + ${exceptions.length}×2 改派例外簇 + 1 核对提交${failures ? ` + ${failures}×2 就地改派` : ""}`,
        };
      };

      /* ---------------------------------------------------------------- 通用片段 */

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);

      const currentAssign = () => (state.variant === "A" ? state.a.assign : state.variant === "B" ? state.b.assign : state.c.assign);

      const renderTopbar = () => {
        const counter = counters[state.variant];
        const assign = currentAssign();
        return `
          <header class="topbar">
            <div>
              <h1>${task.title}</h1>
              <p class="topbar-sub">${task.id} · ${task.employee} · 内置清单 ${PROJECTS.length} 个项目（发布时冻结的快照）</p>
            </div>
            <div class="topbar-right">
              <div class="scenario-picker">
                <label>场景</label>
                ${SCENARIOS.map(
                  (item) =>
                    `<button class="scenario-button ${state.scenario === item.key ? "active" : ""}" type="button" data-action="set-scenario" data-scenario="${item.key}" title="${escapeHtml(item.desc)}">${item.name}</button>`,
                ).join("")}
              </div>
              <div class="counter-chip live"><strong>${counter.actions}</strong><span>本变体交互次数</span></div>
              <div class="counter-chip"><strong>${counter.browser}</strong><span>开浏览器次数</span></div>
              <div class="counter-chip"><strong>${assignedCount(assign)}/${ALL_LINES.length}</strong><span>已归属明细</span></div>
              <button class="button-secondary" type="button" data-action="reset-variant" title="只清空当前变体的计数">重置本变体</button>
            </div>
          </header>
        `;
      };

      const renderCompareBar = () => {
        const bar = document.getElementById("compare");
        const exceptions = exceptionClusters();
        bar.innerHTML = `
          <div class="compare-inner">
            <div class="compare-title">
              <b>交互次数对比</b><br />场景「${scenario().name}」·<br />例外 ${exceptionLineCount()}/${ALL_LINES.length} 条（${exceptions.length} 个簇）
            </div>
            ${variants
              .map((variant) => {
                const counter = counters[variant.key];
                const guess = estimate(variant.key);
                return `
                  <div class="compare-card ${state.variant === variant.key ? "live" : ""}">
                    <b>${variant.key} · ${variant.name}</b>
                    <div class="compare-nums">
                      <span class="measured">${counter.actions}</span>
                      <span class="est">实测 · 估算 ${guess.actions} 次 · 开浏览器 ${counter.browser}/${guess.browser}</span>
                    </div>
                    <small>${guess.formula}</small>
                  </div>
                `;
              })
              .join("")}
            <div>
              <button class="log-toggle" type="button" data-action="toggle-log">${state.showLog ? "收起流水" : "查看交互流水"}</button>
              <button class="log-toggle" type="button" data-action="reset-all">全部重置</button>
            </div>
          </div>
          ${state.showLog ? `<ol class="log-list">${counters[state.variant].log.map((entry) => `<li>${escapeHtml(entry)}</li>`).join("") || "<li>还没有交互</li>"}</ol>` : ""}
        `;
      };

      const lineChip = (line, assign, results) => {
        const entry = assign[line.id];
        if (!entry) return `<span class="chip none">未归属</span>`;
        const verdict = verdictOfCode(results, entry.code);
        if (verdict && verdict !== "confirmed") {
          return `<span class="chip bad" title="${escapeHtml(VERDICT_LABEL[verdict])}">${entry.code} · 核对失败</span>`;
        }
        const klass = entry.via === "继承" ? "inherited" : "assigned";
        const tag = entry.via === "继承" ? " · 继承" : entry.via === "手打" ? " · 手打" : entry.via === "覆盖" ? " · 单独改" : "";
        return `<span class="chip ${klass}">${entry.code}${tag}</span>`;
      };

      /* 只读的归属总览，A 用它来展示终端问答之外发生了什么（尤其是凭证簇的继承）。 */
      const renderClusterSummary = (assign, results) => `
        <section class="panel" style="margin-top:14px;">
          <div class="panel-title"><h3>归属总览</h3><span class="line-meta">${assignedCount(assign)}/${ALL_LINES.length} 条已归属</span></div>
          ${CLUSTERS.map((cluster) => {
            const current = clusterAssignment(assign, cluster);
            const chip = current.code
              ? lineChip(cluster.lines[0], assign, results)
              : `<span class="chip none">未归属</span>`;
            return `
              <div class="line-row" style="border-top:1px solid var(--line);">
                <div class="line-main">
                  <span class="line-detail"><b>${cluster.kind} · ${cluster.title}</b></span>
                  <span class="line-meta">${cluster.lines.length} 条 · ${money(clusterAmount(cluster))} · 成组依据：${cluster.basis}${cluster.inheritFrom ? ` · 继承自「${clusterById(cluster.inheritFrom).title}」` : ""}</span>
                </div>
                ${chip}
              </div>
            `;
          }).join("")}
          <p class="panel-note">凭证簇不单独发问：它跟随分摊前那一行（Q14）。6 个簇因此只产生 ${askableClusters().length} 次决策。</p>
        </section>
      `;

      /*
        A 和 C 的提问单位是行程簇。真值按费用类别落的时候，簇内部就不是一个项目了——
        它们只能答出簇的多数派，也就是答错。这条必须画出来，不然「按类别分组」的代价会被藏在 B 里看不见。
      */
      const clusterAskWarning = (key) => {
        if (scenario().truth) return "";
        const impure = CLUSTERS.filter((cluster) => !cluster.inheritFrom && !groupIsPure(cluster));
        if (!impure.length) return "";
        const wrong = ALL_LINES.filter((line) => truthOfLine(line) !== truthFor(line.clusterId)).length;
        return `
          <div class="callout bad">
            <b>本场景下 ${key} 的提问单位不成立</b><br />
            这批钱按<b>费用类别</b>落项目，而 ${key} 是按<b>行程簇</b>发问的：${impure.length} 个簇内部跨了不止一个项目。
            一簇一答只能给出簇内多数派，会有 <b>${wrong} 条</b>落错项目，而且核对拦不住——项目号本身是好的，只是归错了人。
            下面的交互次数因此不能拿去和 B 比：它买到的不是同一个结果。切到 B 用「按费用类别」分组才能表达这批真值。
          </div>
        `;
      };

      /* ================================================================ 变体 A */
      /* 终端逐簇问。不开浏览器，但要老实画出 AskUserQuestion 的硬约束：
         每轮 ≤4 题、每题 2–4 选项，所以只在簇数 ≤4、候选 ≤3 时成立。 */

      const aPending = () => askableClusters().filter((cluster) => !state.a.answers[cluster.id]);

      const aCandidates = (cluster) => {
        const hinted = state.a.hints || [];
        const ordered = [];
        [...hinted, ...candidatesFor(cluster, state.a.assign)].forEach((code) => {
          if (!ordered.includes(code)) ordered.push(code);
        });
        return ordered.slice(0, 3);
      };

      const renderQuestionBlock = (cluster, index, total) => {
        const draft = state.a.draft[cluster.id];
        const candidates = aCandidates(cluster);
        const isManual = state.a.manualFor === cluster.id;
        const options = candidates
          .map((code, position) => {
            const used = codeLineCount(state.a.assign, code);
            return `
              <button class="q-option ${draft && draft.code === code ? "chosen" : ""}" type="button" data-action="a-pick" data-cluster="${cluster.id}" data-code="${code}">
                <span class="key">[${position + 1}]</span>
                <span>${code}</span>
                <span class="name">${escapeHtml(projectName(code))}${used ? ` · 本次已用 ${used} 条` : ""}</span>
              </button>
            `;
          })
          .join("");
        return `
          <div class="q-block ${draft ? "answered" : ""}">
            <div class="q-head">
              问题 ${index + 1}/${total} · 归属簇「${cluster.kind} · ${cluster.title}」
              <div class="q-meta">${cluster.lines.length} 条 · ${money(clusterAmount(cluster))} · 依据 ${cluster.basis} → 归入哪个项目？</div>
            </div>
            <div class="q-options">
              ${options}
              <button class="q-option escape ${isManual ? "chosen" : ""}" type="button" data-action="a-other" data-cluster="${cluster.id}">
                <span class="key">[${candidates.length + 1}]</span><span>其他</span><span class="name">清单里没有 / 不在候选里 · 手动输入项目号</span>
              </button>
            </div>
            ${
              isManual
                ? `
              <div class="term-input-row">
                <span class="q-meta">项目号 &gt;</span>
                <input class="term-input" id="a-manual" data-focus-id="a-manual" data-control="a-manual" type="text" value="${escapeHtml(state.a.manualText)}" placeholder="例如 P-2211，回车提交" autocomplete="off" />
                <button class="term-button" type="button" data-action="a-manual-submit" data-cluster="${cluster.id}">回车</button>
              </div>
              ${
                state.a.manualError
                  ? `<div class="term-line bad" style="margin-top:6px;">✗ ${state.a.manualError.code} · ${VERDICT_LABEL[state.a.manualError.verdict]}
${escapeHtml(state.a.manualError.detail)}${state.a.manualError.hint ? `
→ 这是内置清单与 ERP 错位，不是你填错。主数据里对应的在用项目是 ${state.a.manualError.hint}（${escapeHtml(projectName(state.a.manualError.hint))}）。` : `
→ 这是内置清单与 ERP 错位，不是你填错。请联系发布方更新快照。`}</div>`
                  : `<div class="term-line dim" style="margin-top:6px;">手打的编码立刻做一次只读核对（verifyProject），不通过就在这里硬阻塞。</div>`
              }
            `
                : ""
            }
            ${draft ? `<div class="term-line ok" style="margin-top:6px;">✓ 本题已选 ${draft.code} · ${escapeHtml(projectName(draft.code))}${draft.via === "手打" ? "（手打）" : ""}</div>` : ""}
          </div>
        `;
      };

      const renderVariantA = () => {
        const pending = aPending();
        const round = pending.slice(0, 4);
        const waiting = pending.length - round.length;
        const results = state.a.verifyResults;
        const failures = failuresOf(results);
        const answered = round.every((cluster) => state.a.draft[cluster.id]);
        const done = state.a.submitted;

        let body = "";
        if (pending.length) {
          body = `
            <div class="term-line dim">$ baox 继续任务 ${task.id}</div>
            <div class="term-line">已解析 ${ALL_LINES.length} 条候选明细，按连续日期＋同城／同一凭证聚成 ${CLUSTERS.length} 个归属簇。</div>
            <div class="term-line dim">凭证簇「${clusterById("inv").title}」继承分摊前那一行，不单独发问。需要你回答的是 ${askableClusters().length} 个簇。</div>
            ${state.a.reaskNote ? `<div class="term-rule"></div><div class="term-line bad">✗ 写入前核对未通过，受影响的簇已退回重答（见下）。</div>` : ""}
            <div class="term-rule"></div>
            <div class="term-line warn">◆ AskUserQuestion · 第 ${state.a.rounds + 1} 轮 · 本轮 ${round.length} 题（每轮上限 4 题）${waiting ? ` · 还有 ${waiting} 个簇排在下一轮` : ""}</div>
            ${round.map((cluster, index) => renderQuestionBlock(cluster, index, round.length)).join("")}
            <div class="term-actions">
              <button class="term-button primary" type="button" data-action="a-submit-round" ${answered ? "" : "disabled"}>提交本轮（${round.filter((cluster) => state.a.draft[cluster.id]).length}/${round.length} 已答）</button>
            </div>
            <p class="constraint-note">
              硬约束照实画：AskUserQuestion 一次最多 4 题、每题 2–4 个选项。6 个簇 → ${askableClusters().length} 个待答簇 → ${Math.ceil(askableClusters().length / 4)} 轮。
              簇再多一点（比如季度报销 12 个簇）就是 3 轮起，终端里翻不回去、也改不了上一轮的答案。
            </p>
          `;
        } else if (!results.length) {
          body = `
            <div class="term-line ok">✓ ${askableClusters().length} 个簇全部答完，${assignedCount(state.a.assign)} 条明细已归属。</div>
            <div class="term-line dim">本次用到 ${usedCodes(state.a.assign).length} 个项目号：${usedCodes(state.a.assign).join("、")}</div>
            <div class="term-rule"></div>
            <div class="term-line">写入 ERP 草稿前，只对这 ${usedCodes(state.a.assign).length} 个项目号做只读核对（不核对整本清单）。</div>
            <div class="term-actions"><button class="term-button primary" type="button" data-action="a-verify">核对并写入</button></div>
          `;
        } else if (failures.length) {
          body = `
            <div class="term-line bad">✗ 核对未通过：${failures.map((failure) => `${failure.code} ${VERDICT_LABEL[failure.verdict]}`).join("；")}</div>
            <div class="term-actions"><button class="term-button primary" type="button" data-action="a-reask">退回重答受影响的簇</button></div>
          `;
        } else {
          body = `
            <div class="term-line ok">✓ 核对通过：${results.map((result) => `${result.code} ${escapeHtml(projectName(result.code))}`).join("；")}</div>
            <div class="term-line">${ALL_LINES.length} 条明细的项目归属已提交，可以进入 ERP 草稿授权。全程未打开浏览器。</div>
            <div class="term-line dim">共 ${counters.A.actions} 次交互。</div>
          `;
        }

        return `
          <div class="page">
            ${renderTopbar()}
            ${clusterAskWarning("A")}
            <div class="design-heading">
              <div>
                <div class="section-kicker">变体 A</div>
                <h2>终端逐簇问</h2>
                <p>不开浏览器。每个归属簇一道终端多选题，候选按「本任务内已选 &gt; 本人历史」排序，永不预填。代价是被 AskUserQuestion 的 4 题／4 选项卡死：簇一多就要多轮，候选装不下就得手打编码。</p>
              </div>
              <span class="variant-badge">A · 零浏览器，规模有上限</span>
            </div>
            <div class="terminal">${body}</div>
            ${renderClusterSummary(state.a.assign, results)}
            <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。计数口径：一次需要用户动手的动作算 1 次。</p>
          </div>
        `;
      };

      /* ================================================================ 页面共用件（B 与 C 的收尾页） */

      const projectPanel = (vs, prefix, { title, note } = {}) => {
        const used = usedCodes(vs.assign)
          .map((code) => ({ code, count: codeLineCount(vs.assign, code) }))
          .sort((a, b) => b.count - a.count);
        const usedSet = used.map((item) => item.code);
        const keyword = vs.search.trim();
        const rest = PROJECTS.filter((project) => !usedSet.includes(project.code)).filter(
          (project) => !keyword || project.code.includes(keyword) || project.name.includes(keyword),
        );
        const enabled = vs.selected.length > 0;
        const item = (code, count) => `
          <button class="project-item" type="button" data-action="${prefix}-assign" data-code="${code}" ${enabled ? "" : "disabled"} title="${enabled ? `把选中的 ${vs.selected.length} 条归入 ${code}` : "先勾选费用事件"}">
            <span class="code">${code}</span>
            <span class="name">${escapeHtml(projectName(code))}</span>
            ${count ? `<span class="count">${count} 条</span>` : ""}
          </button>
        `;
        return `
          <aside class="panel">
            <div class="panel-title"><h3>${title || "项目"}</h3><span class="line-meta">${enabled ? `已选 ${vs.selected.length} 条` : "未选中"}</span></div>
            <p class="panel-note">${note || "项目本身就是投放目标：勾选事件，然后点项目。没有「应用」按钮。"}</p>
            ${
              used.length
                ? `<div class="panel-group"><div class="panel-group-heading"><span>本次已归入（置顶）</span><span>${used.length} 个</span></div>${used.map((entry) => item(entry.code, entry.count)).join("")}</div>`
                : ""
            }
            <div class="panel-group">
              <div class="panel-group-heading"><span>内置清单</span><span>${rest.length}/${PROJECTS.length} 个</span></div>
              <input class="search-input" id="${prefix}-search" data-focus-id="${prefix}-search" data-control="${prefix}-search" type="search" value="${escapeHtml(vs.search)}" placeholder="搜项目号或名称，如「零售中台」" aria-label="搜索内置项目清单" />
              <div class="project-scroll" style="margin-top:8px;">${rest.length ? rest.map((project) => item(project.code, codeLineCount(vs.assign, project.code))).join("") : `<p class="panel-note">没有匹配的项目。清单是发布时冻结的快照，找不到就用下面的手动输入。</p>`}</div>
            </div>
            <div class="panel-group">
              <div class="panel-group-heading"><span>逃生口</span><span>清单里没有</span></div>
              ${
                vs.manualOpen
                  ? `
                    <input class="manual-input" id="${prefix}-panel-manual" data-focus-id="${prefix}-panel-manual" data-control="${prefix}-panel-manual" type="text" value="${escapeHtml(vs.manualText)}" placeholder="手动输入项目号，如 P-2211" autocomplete="off" />
                    <div class="callout-actions">
                      <button class="button-primary" type="button" data-action="${prefix}-panel-manual-submit" ${enabled ? "" : "disabled"}>核对并归入</button>
                      <button class="button-secondary" type="button" data-action="${prefix}-panel-manual-cancel">取消</button>
                    </div>
                    ${vs.manualError ? `<div class="callout bad">${vs.manualError.code} · ${VERDICT_LABEL[vs.manualError.verdict]}<br />${escapeHtml(vs.manualError.detail)}<br />${vs.manualError.hint ? `这是内置清单与 ERP 错位，不是你填错。主数据里在用的是 ${vs.manualError.hint}（${escapeHtml(projectName(vs.manualError.hint))}）。` : "这是内置清单与 ERP 错位，不是你填错。请联系发布方更新快照。"}</div>` : ""}
                  `
                  : `<button class="button-secondary" type="button" data-action="${prefix}-panel-manual-open">手动输入项目号</button>`
              }
            </div>
          </aside>
        `;
      };

      const lineRow = (line, vs, prefix, results) => `
        <div class="line-row">
          <input id="${prefix}-line-${line.id}" data-focus-id="${prefix}-line-${line.id}" type="checkbox" data-control="${prefix}-line" data-line="${line.id}" ${vs.selected.includes(line.id) ? "checked" : ""} aria-label="选择明细 ${line.detail}" />
          <div class="line-main">
            <span class="line-detail">${escapeHtml(line.detail)}</span>
            <span class="line-meta">${line.date} · ${line.city} · ${line.category}</span>
          </div>
          <span class="line-amount">${money(line.amount)}</span>
          ${lineChip(line, vs.assign, results)}
        </div>
      `;

      /*
        一个分组卡片。层级是可选的：归属簇和七类平铺没有子组，V1 的「市外交通」有城市子组，
        城市子组下面还可能挂一张合并交通票。渲染器只认 lines / children / ownLines 三个字段。
        noGroupSelect 的组不给整组复选框——本版没给它分类，就不该白拿一次整组勾。
      */
      const clusterCard = (cluster, vs, prefix, results, depth = 0) => {
        const collapsed = vs.collapsed[cluster.id] !== false;
        const current = clusterAssignment(vs.assign, cluster);
        const selectedInCluster = cluster.lines.filter((line) => vs.selected.includes(line.id)).length;
        const complete = cluster.lines.every((line) => vs.assign[line.id]);
        const badVerdict = current.code && verdictOfCode(results, current.code) && verdictOfCode(results, current.code) !== "confirmed";
        const children = cluster.children || [];
        const ownLines = cluster.ownLines || cluster.lines;
        return `
          <div class="cluster ${complete && !badVerdict ? "done" : ""} ${depth ? "sub" : ""}">
            <div class="cluster-head">
              ${
                cluster.noGroupSelect
                  ? `<span class="cluster-nobox" title="本版不给这一组整组勾选">—</span>`
                  : `<input id="${prefix}-cluster-${cluster.id}" data-focus-id="${prefix}-cluster-${cluster.id}" type="checkbox" data-control="${prefix}-cluster" data-cluster="${cluster.id}" ${selectedInCluster === cluster.lines.length ? "checked" : ""} aria-label="整组选择 ${cluster.title}" />`
              }
              <label ${cluster.noGroupSelect ? "" : `for="${prefix}-cluster-${cluster.id}"`}>
                <span class="cluster-title">${cluster.kind} · ${cluster.title}</span>
                <span class="cluster-meta">${cluster.lines.length} 条 · ${money(clusterAmount(cluster))} · ${cluster.basis}${cluster.inheritFrom ? ` · 继承自「${clusterById(cluster.inheritFrom).title}」` : ""}${selectedInCluster ? ` · 已选 ${selectedInCluster}` : ""}</span>
              </label>
              ${current.code ? lineChip(cluster.lines.find((line) => vs.assign[line.id]) || cluster.lines[0], vs.assign, results) : `<span class="chip none">未归属</span>`}
              ${current.mixed ? `<span class="chip">组内不一致</span>` : ""}
              <button class="cluster-toggle" type="button" data-action="${prefix}-toggle-cluster" data-cluster="${cluster.id}">${collapsed ? (children.length ? "展开" : "展开明细") : "收起"}</button>
            </div>
            ${
              collapsed
                ? ""
                : children.map((child) => clusterCard(child, vs, prefix, results, depth + 1)).join("") +
                  ownLines.map((line) => lineRow(line, vs, prefix, results)).join("")
            }
          </div>
        `;
      };

      const overwriteCallout = (vs, prefix) =>
        vs.pendingOverwrite
          ? `
        <div class="callout">
          选中的 ${vs.pendingOverwrite.changed.length} 条已经归到别的项目上了。改派到 ${vs.pendingOverwrite.code} · ${escapeHtml(projectName(vs.pendingOverwrite.code))}？
          <div class="callout-actions">
            <button class="button-secondary" type="button" data-action="${prefix}-overwrite" data-mode="unassigned">只处理未归属</button>
            <button class="button-danger" type="button" data-action="${prefix}-overwrite" data-mode="all">确认覆盖</button>
            <button class="button-secondary" type="button" data-action="${prefix}-overwrite" data-mode="cancel">取消</button>
          </div>
        </div>
      `
          : "";

      const verifyCallout = (vs, prefix) => {
        const results = vs.verifyResults;
        if (!results.length) return "";
        const failures = failuresOf(results);
        if (!failures.length) {
          return `<div class="callout ok">✓ 本次用到的 ${results.length} 个项目号全部核对通过，可以进入 ERP 草稿授权。共 ${counters[state.variant].actions} 次交互。</div>`;
        }
        return failures
          .map((failure) => {
            const lines = ALL_LINES.filter((line) => vs.assign[line.id]?.code === failure.code);
            return `
              <div class="callout bad">
                <b>${failure.code} · ${VERDICT_LABEL[failure.verdict]}</b><br />
                ${escapeHtml(failure.detail)}<br />
                ${failure.hint ? `这是内置清单与 ERP 错位，不是你填错。主数据里在用的是 ${failure.hint}（${escapeHtml(projectName(failure.hint))}）。` : "这是内置清单与 ERP 错位，不是你填错。请联系发布方更新快照。"}
                影响 ${lines.length} 条明细——就地改派，不用离开这一页。
                <div class="callout-actions">
                  <button class="button-secondary" type="button" data-action="${prefix}-select-failed" data-code="${failure.code}">选中受影响的 ${lines.length} 条</button>
                </div>
              </div>
            `;
          })
          .join("");
      };

      /*
        把「哪种分法更省」摊开给用户看。它读的是场景真值，是上帝视角的估算，不是用户已经点出来的东西——
        标签上写清楚，免得被当成页面在预填。
      */
      const bPlanCallout = (vs) => {
        const rows = GROUPINGS.map((item) => ({ item, plan: bPlan(item.key) }));
        const best = rows.reduce((a, b) => (b.plan.total < a.plan.total ? b : a));
        const current = rows.find((row) => row.item.key === vs.grouping);
        return `
          <div class="callout ${current === best ? "ok" : ""}">
            <b>本场景「${scenario().name}」下的最省选择路径</b>（按真值算的上帝视角估算，页面不会替你点）
            <div class="plan-rows">
              ${rows
                .map(
                  (row) => `
                <div class="plan-row ${row.item.key === vs.grouping ? "on" : ""}">
                  <span class="plan-name">${row.item.name}</span>
                  <span class="plan-num">${row.plan.total} 次</span>
                  <span class="line-meta">${row.plan.selects} 勾选 + ${row.plan.picks} 点项目 + ${row.plan.searches} 搜索 + 开页 1 + 提交 1</span>
                </div>
              `,
                )
                .join("")}
            </div>
            <span class="line-meta">${
              rows.every((row) => row.plan.total === rows[0].plan.total)
                ? "三种分法打平。"
                : `最省的是「${best.item.name}」，比最贵的一种少 ${Math.max(...rows.map((row) => row.plan.total)) - best.plan.total} 次。`
            }</span>
            <div class="plan-steps">${current.plan.steps.map((step) => `<span>${escapeHtml(step)}</span>`).join("")}</div>
          </div>
        `;
      };

      /* ================================================================ 变体 B */

      const renderVariantB = () => {
        const vs = state.b;
        if (!vs.opened) {
          return `
            <div class="page">
              ${renderTopbar()}
              <div class="design-heading">
                <div>
                  <div class="section-kicker">变体 B</div>
                  <h2>网页工作台</h2>
                  <p>规模没有上限，代价是每次都得切一趟浏览器。左侧按费用类别折叠（可切回归属簇），组头一个复选框全选整组；右侧项目面板，项目本身就是投放目标。</p>
                </div>
                <span class="variant-badge">B · 无规模上限，必开浏览器</span>
              </div>
              <div class="terminal">
                <div class="term-line dim">$ baox 继续任务 ${task.id}</div>
                <div class="term-line">已解析 ${ALL_LINES.length} 条候选明细，聚成 ${CLUSTERS.length} 个归属簇。项目归属请在本地页面填报。</div>
                <div class="term-line warn">→ http://127.0.0.1:8765/task/${task.id}/projects</div>
                <div class="term-actions"><button class="term-button primary" type="button" data-action="b-open">打开浏览器页面</button></div>
                <p class="constraint-note">这一步就是 B 的固定成本：无论 1 个簇还是 20 个簇，都要离开终端一次。</p>
              </div>
              <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。</p>
            </div>
          `;
        }
        return `
          <div class="page">
            ${renderTopbar()}
            <div class="design-heading">
              <div>
                <div class="section-kicker">变体 B</div>
                <h2>网页工作台</h2>
                <p>项目 → 事件：勾选一个组（或组内几条），点右侧项目，一次扫入一批。决策次数 = 项目数，不是事件数——前提是分组切在项目的边界上。</p>
              </div>
              <span class="variant-badge">B · 无规模上限，必开浏览器</span>
            </div>
            ${overwriteCallout(vs, "b")}
            ${verifyCallout(vs, "b")}
            <div class="workbench">
              <section class="panel">
                <div class="panel-title"><h3>候选明细 · ${groupingByKey(vs.grouping).name}</h3><span class="line-meta">${assignedCount(vs.assign)}/${ALL_LINES.length} 已归属</span></div>
                <div class="grouping-switch">
                  ${GROUPINGS.map(
                    (item) => `
                    <button class="button-secondary ${item.key === vs.grouping ? "on" : ""}" type="button" data-action="b-set-grouping" data-grouping="${item.key}">${item.name}（${groupsOf(item.key).length} 组）</button>
                  `,
                  ).join("")}
                  <span class="line-meta">${groupingByKey(vs.grouping).note}</span>
                </div>
                ${bPlanCallout(vs)}
                ${groupsOf(vs.grouping).map((group) => clusterCard(group, vs, "b", vs.verifyResults)).join("")}
                <div class="callout-actions">
                  <button class="button-primary" type="button" data-action="b-verify" ${assignedCount(vs.assign) === ALL_LINES.length ? "" : "disabled"}>核对并提交（${usedCodes(vs.assign).length} 个项目号）</button>
                  <span class="line-meta">组不能拆并（Q16）；要动其中几条，展开明细单独勾。</span>
                </div>
              </section>
              ${projectPanel(vs, "b", { title: "项目", note: "项目本身就是投放目标：勾选事件后点项目即归入，没有「应用」按钮。已归入的置顶。" })}
            </div>
            <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。未点过的明细恒为未归属，页面不做任何预填。</p>
          </div>
        `;
      };

      /* ================================================================ 变体 C */
      /* 终端只问一道起手式，例外才弹页面。它是否成立，完全取决于例外率。 */

      const cMainCandidates = () => {
        const weight = {};
        askableClusters().forEach((cluster) => {
          cluster.pool.forEach((code, position) => {
            weight[code] = (weight[code] || 0) + cluster.lines.length * [1, 0.6, 0.3][position];
          });
        });
        return Object.entries(weight)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3)
          .map((entry) => entry[0]);
      };

      const renderVariantC = () => {
        const vs = state.c;
        const heading = `
          <div class="design-heading">
            <div>
              <div class="section-kicker">变体 C</div>
              <h2>终端起手 + 页面收尾</h2>
              <p>终端只问一道「这批费用主要归哪个项目」，一键全归入；只有例外才弹页面。常见情形下满足「登录一次之后不再打开任何浏览器页面」，代价是例外一多就退化成 B 再加一次多余的提问。</p>
            </div>
            <span class="variant-badge">C · 赌例外率低</span>
          </div>
        `;

        if (vs.step === "opener" || vs.step === "asked") {
          const candidates = cMainCandidates();
          const isManual = vs.manualFor === "main";
          const q1 = `
            <div class="q-block ${vs.draftMain ? "answered" : ""}">
              <div class="q-head">问题 1/2 · 起手式
                <div class="q-meta">${ALL_LINES.length} 条明细、${money(ALL_LINES.reduce((sum, line) => sum + line.amount, 0))}。这批费用<b>主要</b>归哪个项目？选中后全部归入，这是你的一次动作，不是预填。</div>
              </div>
              <div class="q-options">
                ${candidates
                  .map(
                    (code, position) => `
                  <button class="q-option ${vs.draftMain === code ? "chosen" : ""}" type="button" data-action="c-pick-main" data-code="${code}">
                    <span class="key">[${position + 1}]</span><span>${code}</span><span class="name">${escapeHtml(projectName(code))} · 按本人历史推测</span>
                  </button>
                `,
                  )
                  .join("")}
                <button class="q-option escape ${isManual ? "chosen" : ""}" type="button" data-action="c-other-main">
                  <span class="key">[4]</span><span>其他</span><span class="name">都不是 · 手动输入项目号</span>
                </button>
              </div>
              ${
                isManual
                  ? `
                <div class="term-input-row">
                  <span class="q-meta">项目号 &gt;</span>
                  <input class="term-input" id="c-manual" data-focus-id="c-manual" data-control="c-manual" type="text" value="${escapeHtml(vs.manualText)}" placeholder="例如 P-1042，回车提交" autocomplete="off" />
                  <button class="term-button" type="button" data-action="c-manual-submit">回车</button>
                </div>
                ${vs.manualError ? `<div class="term-line bad" style="margin-top:6px;">✗ ${vs.manualError.code} · ${VERDICT_LABEL[vs.manualError.verdict]}
${escapeHtml(vs.manualError.detail)}</div>` : ""}
              `
                  : ""
              }
            </div>
          `;
          const q2 = `
            <div class="q-block ${vs.draftException !== null ? "answered" : ""}">
              <div class="q-head">问题 2/2 · 例外
                <div class="q-meta">除了主项目，还有别的项目要挑出来吗？</div>
              </div>
              <div class="q-options">
                <button class="q-option ${vs.draftException === false ? "chosen" : ""}" type="button" data-action="c-exception" data-value="no">
                  <span class="key">[1]</span><span>没有例外</span><span class="name">全部归入主项目，直接提交，不开浏览器</span>
                </button>
                <button class="q-option ${vs.draftException === true ? "chosen" : ""}" type="button" data-action="c-exception" data-value="yes">
                  <span class="key">[2]</span><span>有例外</span><span class="name">打开页面把例外挑出来</span>
                </button>
              </div>
            </div>
          `;
          const ready = vs.draftMain && vs.draftException !== null;
          return `
            <div class="page">
              ${renderTopbar()}
              ${clusterAskWarning("C")}
              ${heading}
              <div class="terminal">
                <div class="term-line dim">$ baox 继续任务 ${task.id}</div>
                <div class="term-line">已解析 ${ALL_LINES.length} 条候选明细，聚成 ${CLUSTERS.length} 个归属簇。</div>
                <div class="term-rule"></div>
                <div class="term-line warn">◆ AskUserQuestion · 第 1 轮 · 2 题</div>
                ${q1}
                ${q2}
                <div class="term-actions"><button class="term-button primary" type="button" data-action="c-submit-opener" ${ready ? "" : "disabled"}>提交本轮</button></div>
                <p class="constraint-note">
                  本场景真正的例外：${exceptionClusters().length} 个簇 / ${exceptionLineCount()} 条（${Math.round((exceptionLineCount() / ALL_LINES.length) * 100)}%）。
                  例外率越高，C 越接近「B 加两次多余的提问」。用顶栏的场景开关当场验它。
                </p>
              </div>
              <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。</p>
            </div>
          `;
        }

        if (vs.step === "done-terminal") {
          const results = vs.verifyResults;
          const failures = failuresOf(results);
          return `
            <div class="page">
              ${renderTopbar()}
              ${clusterAskWarning("C")}
              ${heading}
              <div class="terminal">
                <div class="term-line ok">✓ ${ALL_LINES.length} 条明细全部归入 ${vs.mainProject} · ${escapeHtml(projectName(vs.mainProject))}（起手式，用户的一次动作）。</div>
                ${
                  !results.length
                    ? `<div class="term-line">写入前只核对这 1 个项目号。</div>
                       <div class="term-actions"><button class="term-button primary" type="button" data-action="c-verify-terminal">核对并写入</button></div>`
                    : failures.length
                      ? `<div class="term-line bad">✗ ${failures.map((failure) => `${failure.code} ${VERDICT_LABEL[failure.verdict]}`).join("；")}
${escapeHtml(failures[0].detail)}
→ 这是内置清单与 ERP 错位，不是你填错。${failures[0].hint ? `主数据里在用的是 ${failures[0].hint}。` : ""}</div>
                         <div class="term-actions"><button class="term-button primary" type="button" data-action="c-reopen">回到起手式重选</button></div>`
                      : `<div class="term-line ok">✓ 核对通过。项目归属已提交，可以进入 ERP 草稿授权。</div>
                         <div class="term-line">全程未打开浏览器，共 ${counters.C.actions} 次交互。</div>`
                }
              </div>
              ${renderClusterSummary(vs.assign, results)}
              <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。</p>
            </div>
          `;
        }

        if (!vs.opened) {
          return `
            <div class="page">
              ${renderTopbar()}
              ${clusterAskWarning("C")}
              ${heading}
              <div class="terminal">
                <div class="term-line ok">✓ ${ALL_LINES.length} 条明细已全部归入 ${vs.mainProject} · ${escapeHtml(projectName(vs.mainProject))}。</div>
                <div class="term-line">你说有例外——把例外挑出来需要一个页面。</div>
                <div class="term-line warn">→ http://127.0.0.1:8765/task/${task.id}/projects?only=exceptions</div>
                <div class="term-actions"><button class="term-button primary" type="button" data-action="c-open">打开浏览器页面</button></div>
                <p class="constraint-note">C 的判据在这里破功：只要存在例外，那条「此后不再需要打开任何浏览器页面」就不成立了。</p>
              </div>
              <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。</p>
            </div>
          `;
        }

        const shown = CLUSTERS.filter((cluster) => !vs.onlyMain || clusterAssignment(vs.assign, cluster).code === vs.mainProject);
        return `
          <div class="page">
            ${renderTopbar()}
            ${clusterAskWarning("C")}
            ${heading}
            <div class="callout">
              起手式已把 ${ALL_LINES.length} 条全归入 <b>${vs.mainProject} · ${escapeHtml(projectName(vs.mainProject))}</b>。这一页只做一件事：把不属于它的挑出来改派。
              <div class="callout-actions">
                <button class="button-secondary" type="button" data-action="c-toggle-filter">${vs.onlyMain ? `只看仍归在主项目的簇（${shown.length}）· 点击显示全部` : "显示全部簇 · 点击只看主项目"}</button>
                <span class="line-meta">内核并不知道哪些是例外，所以这一页还是得把它们全列出来——这正是 C 与 B 的差距在高例外率下消失的原因。</span>
              </div>
            </div>
            ${overwriteCallout(vs, "c")}
            ${verifyCallout(vs, "c")}
            <div class="workbench">
              <section class="panel">
                <div class="panel-title"><h3>例外挑拣 · 按归属簇</h3><span class="line-meta">${shown.length}/${CLUSTERS.length} 个簇</span></div>
                ${shown.map((cluster) => clusterCard(cluster, vs, "c", vs.verifyResults)).join("")}
                <div class="callout-actions">
                  <button class="button-primary" type="button" data-action="c-verify">核对并提交（${usedCodes(vs.assign).length} 个项目号）</button>
                </div>
              </section>
              ${projectPanel(vs, "c", { title: "改派到", note: "勾选要挑出来的簇，然后点项目。主项目置顶在「本次已归入」里。" })}
            </div>
            <p class="demo-note">虚构数据 · 一次性原型 · 无持久化。</p>
          </div>
        `;
      };

      /* ================================================================ 交互 */

      const showToast = (message, focusId = "") => {
        window.clearTimeout(toastTimer);
        state.toast = message;
        state.pendingFocusId = focusId;
        render();
        toastTimer = window.setTimeout(() => {
          state.toast = "";
          const toast = document.querySelector("[data-toast]");
          if (toast) toast.remove();
        }, 2600);
      };

      const stateFor = (prefix) => (prefix === "b" ? state.b : state.c);

      /* 归属写入：整簇被选中就走 assignCluster（带凭证簇继承），否则逐条写并标「单独改」。 */
      const applyAssignment = (prefix, code, mode) => {
        const vs = stateFor(prefix);
        if (!vs.selected.length) {
          showToast("先勾选费用事件，再点项目。");
          return;
        }
        /*
          覆盖保护只拦「用户在这一页真的做过别的决定」的行：
          起手式一键铺上去的、以及核对已经判定为坏码的，改派本来就是这一页存在的理由，不该再问一遍。
        */
        const badCodes = failuresOf(vs.verifyResults).map((failure) => failure.code);
        const changed = vs.selected.filter((id) => {
          const entry = vs.assign[id];
          if (!entry || entry.code === code) return false;
          if (entry.via === "起手式") return false;
          if (badCodes.includes(entry.code)) return false;
          return true;
        });
        if (changed.length && !mode) {
          vs.pendingOverwrite = { code, changed };
          render();
          return;
        }
        const targets = mode === "unassigned" ? vs.selected.filter((id) => !vs.assign[id]) : vs.selected;
        CLUSTERS.forEach((cluster) => {
          const inCluster = cluster.lines.filter((line) => targets.includes(line.id));
          if (!inCluster.length) return;
          if (inCluster.length === cluster.lines.length && !cluster.inheritFrom) {
            assignCluster(vs.assign, cluster.id, code, "选择");
          } else {
            inCluster.forEach((line) => {
              vs.assign[line.id] = { code, via: cluster.inheritFrom ? "覆盖" : "选择" };
            });
          }
        });
        vs.selected = [];
        vs.pendingOverwrite = null;
        /* 核对是内核的事，不再向用户收一次点击。 */
        if (vs.verifyResults.length) vs.verifyResults = runVerification(vs.assign);
        showToast(`已把 ${targets.length} 条归入 ${code} · ${projectName(code)}。`);
      };

      const toggleSelection = (vs, ids, label) => {
        const allSelected = ids.every((id) => vs.selected.includes(id));
        vs.selected = allSelected ? vs.selected.filter((id) => !ids.includes(id)) : [...new Set([...vs.selected, ...ids])];
        bump(`${allSelected ? "取消勾选" : "勾选"}${label}`);
      };

      const handleManualSubmit = (prefix) => {
        const vs = stateFor(prefix);
        const code = vs.manualText.trim().toUpperCase();
        if (!code) return;
        bump(`手打项目号 ${code}`);
        const result = verifyProject(code);
        if (result.verdict !== "confirmed") {
          vs.manualError = result;
          render();
          return;
        }
        vs.manualError = null;
        vs.manualOpen = false;
        vs.manualText = "";
        applyAssignment(prefix, code, "all");
      };

      const ACTIONS = {
        "set-scenario": (dataset) => {
          if (state.scenario === dataset.scenario) return;
          state.scenario = dataset.scenario;
          resetAll();
          showToast(`场景切到「${scenario().name}」：${scenario().desc}。三份计数已清零。`);
        },
        "reset-variant": () => {
          resetVariant(state.variant);
          showToast(`变体 ${state.variant} 已重置。`);
        },
        "reset-all": () => {
          resetAll();
          showToast("三个变体的计数与状态都已重置。");
        },
        "toggle-log": () => {
          state.showLog = !state.showLog;
          render();
        },

        /* ---- A ---- */
        "a-pick": (dataset) => {
          bump(`A 选项：${clusterById(dataset.cluster).title} → ${dataset.code}`);
          state.a.draft[dataset.cluster] = { code: dataset.code, via: "选择" };
          state.a.manualFor = "";
          state.a.manualError = null;
          render();
        },
        "a-other": (dataset) => {
          bump(`A 选「其他」：${clusterById(dataset.cluster).title}`);
          state.a.manualFor = dataset.cluster;
          state.a.manualText = "";
          state.a.manualError = null;
          state.pendingFocusId = "a-manual";
          render();
        },
        "a-manual-submit": (dataset) => {
          const code = state.a.manualText.trim().toUpperCase();
          if (!code) return;
          bump(`A 手打项目号 ${code}`);
          const result = verifyProject(code);
          if (result.verdict !== "confirmed") {
            state.a.manualError = result;
            render();
            return;
          }
          state.a.draft[dataset.cluster] = { code, via: "手打" };
          state.a.manualFor = "";
          state.a.manualError = null;
          render();
        },
        "a-submit-round": () => {
          bump("A 提交本轮");
          Object.entries(state.a.draft).forEach(([clusterId, draft]) => {
            state.a.answers[clusterId] = draft;
            assignCluster(state.a.assign, clusterId, draft.code, draft.via);
          });
          state.a.draft = {};
          state.a.manualFor = "";
          state.a.rounds += 1;
          state.a.reaskNote = null;
          state.a.verifyResults = [];
          render();
        },
        "a-verify": () => {
          bump("A 核对并写入");
          const results = runVerification(state.a.assign);
          state.a.verifyResults = results;
          const failures = failuresOf(results);
          if (failures.length) {
            /* 硬阻塞：受影响的簇自动退回重答，并把 ERP 指出的在用项目补进候选。 */
            const badCodes = failures.map((failure) => failure.code);
            state.a.hints = failures.map((failure) => failure.hint).filter(Boolean);
            askableClusters().forEach((cluster) => {
              const current = clusterAssignment(state.a.assign, cluster).code;
              if (!badCodes.includes(current)) return;
              delete state.a.answers[cluster.id];
              cluster.lines.forEach((line) => delete state.a.assign[line.id]);
              CLUSTERS.filter((child) => child.inheritFrom === cluster.id).forEach((child) => {
                child.lines.forEach((line) => delete state.a.assign[line.id]);
              });
            });
            state.a.reaskNote = failures;
          }
          render();
        },
        "a-reask": () => {
          state.a.verifyResults = [];
          render();
        },

        /* ---- B ---- */
        "b-open": () => {
          bump("B 打开浏览器页面", { browser: true });
          state.b.opened = true;
          render();
        },
        /* 切分组维度只换看法，不改归属，因此和展开/收起同类：不记一次交互。 */
        "b-set-grouping": (dataset) => {
          state.b.grouping = dataset.grouping;
          state.b.collapsed = {};
          state.b.selected = [];
          render();
        },
        "b-toggle-cluster": (dataset) => {
          state.b.collapsed[dataset.cluster] = !(state.b.collapsed[dataset.cluster] !== false);
          render();
        },
        "b-assign": (dataset) => {
          bump(`B 点项目 ${dataset.code}`);
          applyAssignment("b", dataset.code, null);
        },
        "b-overwrite": (dataset) => {
          const pending = state.b.pendingOverwrite;
          if (!pending) return;
          if (dataset.mode === "cancel") {
            bump("B 取消覆盖");
            state.b.pendingOverwrite = null;
            render();
            return;
          }
          bump(dataset.mode === "all" ? "B 确认覆盖" : "B 只处理未归属");
          applyAssignment("b", pending.code, dataset.mode);
        },
        "b-panel-manual-open": () => {
          state.b.manualOpen = true;
          state.b.manualError = null;
          state.pendingFocusId = "b-panel-manual";
          render();
        },
        "b-panel-manual-cancel": () => {
          state.b.manualOpen = false;
          state.b.manualError = null;
          render();
        },
        "b-panel-manual-submit": () => handleManualSubmit("b"),
        "b-verify": () => {
          bump("B 核对并提交");
          state.b.verifyResults = runVerification(state.b.assign);
          render();
        },
        "b-select-failed": (dataset) => {
          const ids = ALL_LINES.filter((line) => state.b.assign[line.id]?.code === dataset.code).map((line) => line.id);
          state.b.selected = ids;
          bump(`B 就地改派：选中 ${dataset.code} 的 ${ids.length} 条`);
          render();
        },

        /* ---- C ---- */
        "c-pick-main": (dataset) => {
          bump(`C 起手式主项目 → ${dataset.code}`);
          state.c.draftMain = dataset.code;
          state.c.manualFor = "";
          state.c.manualError = null;
          render();
        },
        "c-other-main": () => {
          bump("C 起手式选「其他」");
          state.c.manualFor = "main";
          state.c.manualText = "";
          state.c.manualError = null;
          state.pendingFocusId = "c-manual";
          render();
        },
        "c-manual-submit": () => {
          const code = state.c.manualText.trim().toUpperCase();
          if (!code) return;
          bump(`C 手打主项目 ${code}`);
          const result = verifyProject(code);
          if (result.verdict !== "confirmed") {
            state.c.manualError = result;
            render();
            return;
          }
          state.c.draftMain = code;
          state.c.manualFor = "";
          state.c.manualError = null;
          render();
        },
        "c-exception": (dataset) => {
          bump(`C 例外？→ ${dataset.value === "yes" ? "有" : "没有"}`);
          state.c.draftException = dataset.value === "yes";
          render();
        },
        "c-submit-opener": () => {
          bump("C 提交本轮");
          const vs = state.c;
          vs.mainProject = vs.draftMain;
          askableClusters().forEach((cluster) => assignCluster(vs.assign, cluster.id, vs.mainProject, "起手式"));
          vs.step = vs.draftException ? "page" : "done-terminal";
          render();
        },
        "c-verify-terminal": () => {
          bump("C 核对并写入");
          state.c.verifyResults = runVerification(state.c.assign);
          render();
        },
        "c-reopen": () => {
          const vs = state.c;
          vs.step = "opener";
          vs.assign = {};
          vs.verifyResults = [];
          vs.draftMain = "";
          vs.draftException = null;
          render();
        },
        "c-open": () => {
          bump("C 打开浏览器页面", { browser: true });
          state.c.opened = true;
          render();
        },
        "c-toggle-filter": () => {
          state.c.onlyMain = !state.c.onlyMain;
          render();
        },
        "c-toggle-cluster": (dataset) => {
          state.c.collapsed[dataset.cluster] = !(state.c.collapsed[dataset.cluster] !== false);
          render();
        },
        "c-assign": (dataset) => {
          bump(`C 点项目 ${dataset.code}`);
          applyAssignment("c", dataset.code, null);
        },
        "c-overwrite": (dataset) => {
          const pending = state.c.pendingOverwrite;
          if (!pending) return;
          if (dataset.mode === "cancel") {
            bump("C 取消覆盖");
            state.c.pendingOverwrite = null;
            render();
            return;
          }
          bump(dataset.mode === "all" ? "C 确认覆盖" : "C 只处理未归属");
          applyAssignment("c", pending.code, dataset.mode);
        },
        "c-panel-manual-open": () => {
          state.c.manualOpen = true;
          state.c.manualError = null;
          state.pendingFocusId = "c-panel-manual";
          render();
        },
        "c-panel-manual-cancel": () => {
          state.c.manualOpen = false;
          state.c.manualError = null;
          render();
        },
        "c-panel-manual-submit": () => handleManualSubmit("c"),
        "c-verify": () => {
          bump("C 核对并提交");
          state.c.verifyResults = runVerification(state.c.assign);
          render();
        },
        "c-select-failed": (dataset) => {
          const ids = ALL_LINES.filter((line) => state.c.assign[line.id]?.code === dataset.code).map((line) => line.id);
          state.c.selected = ids;
          bump(`C 就地改派：选中 ${dataset.code} 的 ${ids.length} 条`);
          render();
        },
      };

      document.addEventListener("click", (event) => {
        const switchButton = event.target.closest("[data-switch]");
        if (switchButton) {
          cycleVariant(switchButton.dataset.switch === "previous" ? -1 : 1);
          return;
        }
        const trigger = event.target.closest("[data-action]");
        if (!trigger) return;
        const handler = ACTIONS[trigger.dataset.action];
        if (handler) handler(trigger.dataset);
      });

      document.addEventListener("change", (event) => {
        const control = event.target.dataset.control;
        if (!control) return;
        if (control === "b-cluster" || control === "c-cluster") {
          const prefix = control[0];
          const vs = stateFor(prefix);
          const cluster = clusterById(event.target.dataset.cluster);
          toggleSelection(vs, cluster.lines.map((line) => line.id), `整簇「${cluster.title}」${cluster.lines.length} 条`);
          render();
          return;
        }
        if (control === "b-line" || control === "c-line") {
          const prefix = control[0];
          const vs = stateFor(prefix);
          toggleSelection(vs, [event.target.dataset.line], "单条明细");
          render();
        }
      });

      document.addEventListener("input", (event) => {
        const control = event.target.dataset.control;
        if (!control) return;
        if (control === "a-manual") {
          state.a.manualText = event.target.value;
          return;
        }
        if (control === "c-manual") {
          state.c.manualText = event.target.value;
          return;
        }
        if (control === "b-panel-manual" || control === "c-panel-manual") {
          stateFor(control[0]).manualText = event.target.value;
          return;
        }
        if (control === "b-search" || control === "c-search") {
          const prefix = control[0];
          const vs = stateFor(prefix);
          const had = vs.search.trim().length > 0;
          vs.search = event.target.value;
          const has = vs.search.trim().length > 0;
          /* 一次检索算一次交互：从空变成非空时记一次，清空后可以再记。 */
          if (!had && has) bump(`${prefix.toUpperCase()} 搜索项目清单`);
          state.pendingFocusId = `${prefix}-search`;
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        const control = event.target.dataset.control;
        if (control === "a-manual") {
          event.preventDefault();
          ACTIONS["a-manual-submit"]({ cluster: state.a.manualFor });
        } else if (control === "c-manual") {
          event.preventDefault();
          ACTIONS["c-manual-submit"]({});
        } else if (control === "b-panel-manual" || control === "c-panel-manual") {
          event.preventDefault();
          handleManualSubmit(control[0]);
        }
      });

      window.addEventListener("keydown", (event) => {
        const target = event.target;
        const tagName = target?.tagName?.toLowerCase();
        if (["input", "textarea", "select"].includes(tagName) || target?.isContentEditable) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleVariant(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleVariant(1);
        }
      });

      /* ---------------------------------------------------------------- 渲染 */

      const setVariant = (key) => {
        state.variant = key;
        /* 直接双击打开时是 file:// ，部分浏览器不许改这种 URL 的 history。切换不能因此瘫掉。 */
        try {
          const url = new URL(window.location.href);
          url.searchParams.set("variant", key);
          window.history.replaceState({}, "", url.href);
        } catch (error) {
          /* 原型不管：URL 不同步而已，切换照常 */
        }
        render({ preserve: false });
      };

      const cycleVariant = (offset) => {
        const index = variants.findIndex((variant) => variant.key === state.variant);
        setVariant(variants[(index + offset + variants.length) % variants.length].key);
      };

      const renderSwitcher = () => {
        const switcher = document.getElementById("prototype-switcher");
        const current = variants.find((variant) => variant.key === state.variant) || variants[0];
        switcher.hidden = false;
        switcher.innerHTML = `
          <button class="switcher-arrow" type="button" data-switch="previous" aria-label="上一个方案" title="上一个方案（←）">←</button>
          <span class="switcher-label">${current.key} · ${current.name}<span>方案 ${variants.findIndex((variant) => variant.key === current.key) + 1}/3 · ←/→ 切换</span></span>
          <button class="switcher-arrow" type="button" data-switch="next" aria-label="下一个方案" title="下一个方案（→）">→</button>
        `;
      };

      const syncClusterIndicators = () => {
        document.querySelectorAll('[data-control="b-cluster"], [data-control="c-cluster"]').forEach((control) => {
          const vs = stateFor(control.dataset.control[0]);
          const lines = groupById(control.dataset.cluster).lines;
          const selected = lines.filter((line) => vs.selected.includes(line.id)).length;
          control.checked = selected === lines.length;
          control.indeterminate = selected > 0 && selected < lines.length;
        });
      };

      const captureView = () => ({ scrollX: window.scrollX, scrollY: window.scrollY, focusId: document.activeElement?.id || "" });

      function render({ preserve = true } = {}) {
        const previous = preserve ? captureView() : null;
        const html = state.variant === "A" ? renderVariantA() : state.variant === "B" ? renderVariantB() : renderVariantC();
        document.getElementById("app").innerHTML = html + (state.toast ? `<div class="toast" data-toast role="status">${escapeHtml(state.toast)}</div>` : "");
        renderCompareBar();
        renderSwitcher();
        window.requestAnimationFrame(() => {
          const focusId = state.pendingFocusId || previous?.focusId;
          if (state.pendingFocusId) state.pendingFocusId = "";
          if (focusId) {
            const element = document.getElementById(focusId);
            if (element) {
              element.focus({ preventScroll: true });
              if (element.setSelectionRange && element.type === "text") {
                const end = element.value.length;
                try { element.setSelectionRange(end, end); } catch (error) { /* 原型不管 */ }
              }
            }
          }
          if (previous) window.scrollTo(previous.scrollX, previous.scrollY);
          syncClusterIndicators();
        });
      }

      window.addEventListener("popstate", () => {
        state.variant = getVariant();
        render({ preserve: false });
      });

      render({ preserve: false });
    </script>
  </body>
</html>
