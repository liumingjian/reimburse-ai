packages:
  - web
  - server
  - erp-executor
  - contract
  - fixtures

# Native addons whose install script must run (pnpm 10 skips dependency build scripts unless listed).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Install scripts deliberately skipped. onnxruntime-node's postinstall only downloads binaries the tarball omits (the
# CUDA provider); the CPU binaries for macOS arm64 ship inside the package.
ignoredBuiltDependencies:
  - onnxruntime-node
