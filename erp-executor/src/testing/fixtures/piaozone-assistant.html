<!doctype html>
<!--
  Recorded DOM fixture: the piaozone invoice assistant (发票无忧助手), a cross-origin iframe and its own CDP target
  (verification-ledger V-45). Rows are Ant Design table rows with `input.ant-checkbox-input`; the "是否生成费用明细"
  choice lives inside this iframe, not in an ERP `.k-window` (save-contract.md, 2026-09-06).
  `data-action` attributes are fake-ERP behaviour hooks only.

  Rebuilt from a read-only probe of the live assistant on 2026-09-19. It has two views, not one:

    /m4-web/fpzs/index      the entry menu: 电脑端选取 / 手机端选取 / 扫码枪扫描 / 扫描仪扫描. Each entry is an <a>
                            wrapping an icon, and its caption is a SIBLING <p>, so the caption is not clickable.
                            The anchor itself measures 76x0 live — inline, wrapping a block <img> (76x74) — which
                            `data-zero-height` reproduces here. Only 电脑端选取 leads anywhere the app can upload from,
                            and 手机端选取 is not an <a> at all — it expands a QR in place and holds no link, so a
                            readiness check must not demand a destination of every entry.
    /m4-web/fpzs/kdInvoices the upload view: the 上传发票影像 tab, one hidden `multiple` file input accepting
                            .ofd/.xml/.zip/.pdf/.xls/.xlsx/.png/.jpg/.jpeg/.bmp/.gif/.tif/.tiff, the recognised-row
                            grid, and 发票导入单据. A first visit is covered by a 温馨提示 dialog whose 知道了 button
                            must be dismissed before the grid can be clicked.

  The earlier fixture put 上传发票影像 and the file input on the entry view, which no live version ever did.
-->
<html>
<head><title>发票助手</title></head>
<body>
<div id="root">
  <div class="fpzsHome">
    <div class="fpzsHomeGrid">
      <div class="row">
        <div class="accessItem"><a href="/m4-web/fpzs/kdInvoices" data-action="computer-picker" data-zero-height><img alt=""></a><p>电脑端选取</p></div>
        <!-- 手机端选取 holds no link: it expands its QR in place. Measured live 2026-09-19, and the reason
             assistantEntryReady must not ask every entry for a destination. -->
        <div class="accessItem"><img alt=""><p>手机端选取</p><p class="text">关闭窗口后，再次打开请重新扫码！</p></div>
      </div>
      <div class="row">
        <div class="accessItem"><a href="#gun"><img alt=""></a><p>扫码枪扫描</p></div>
        <div class="accessItem"><a href="#scanner"><img alt=""></a><p>扫描仪扫描</p></div>
      </div>
    </div>
    <div class="footer"><span class="choosed">所有已选发票</span><span class="controlConfig">发票合规性要求</span></div>
  </div>
  <div class="pwy-assistant" id="assistant-upload" style="display:none">
    <div class="notice" id="assistant-notice">
      <span>温馨提示</span>
      <p>原【上传单张发票】按钮和【上传含多张发票的PDF】按钮合二为一，统一使用【上传发票】按钮上传即可。</p>
      <button data-action="notice-ok">知道了</button>
    </div>
    <div class="toolbar"><span>上传发票影像</span><span>上传附件影像</span><span>企业收到的发票</span></div>
    <input type="file" multiple accept=".ofd,.xml,.zip,.pdf,.xls,.xlsx,.png,.jpg,.jpeg,.bmp,.gif,.tif,.tiff" style="display:none">
    <!-- The grid groups its recognised rows by 票种 (invoice kind) into an antd tab strip, one pane per 票种,
         captioned `<票种> <count>` with `ant-tabs-tab-active` on the current one. Measured live 2026-09-19:
         `数电票 10` and `数电票（铁路电子客票） 2` for the 12 invoices of one task. The fake ERP fills the strip
         and the panes from the uploaded invoices' 票种; only the current pane's `<tbody>` is displayed, and a
         tick SURVIVES a switch, because the tick lives on the row's own checkbox and switching only hides it. -->
    <div class="ant-tabs"><div class="ant-tabs-nav" id="assistant-tabs"></div></div>
    <table class="ant-table">
      <thead><tr><th><input type="checkbox" class="ant-checkbox-input"></th><th>销方名称</th><th>发票号码</th><th>价税合计</th><th>税额</th><th>开票日期</th><th>发票信息</th><th>操作</th></tr></thead>
    </table>
    <!-- Whatever paints over a row's checkbox. Live 2026-09-19 `document.elementFromPoint` at row 5's tick point
         returned an IMG, not the input, and that click could not have reached the checkbox. -->
    <img id="assistant-overlay" alt="">
    <!-- 已选取N张发票 counts what was uploaded into the assistant, NOT what is ticked: measured live it read
         「已选取12张发票」 unchanged through a tick, an untick and two tab switches. It is not a selection witness. -->
    <div class="footer"><span id="assistant-selected">已选取0张发票 所有已选发票已选0份附件</span><button data-action="import">发票导入单据</button></div>
  </div>
</div>
</body>
</html>
